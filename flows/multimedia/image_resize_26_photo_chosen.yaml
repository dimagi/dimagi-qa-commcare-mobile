    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- repeat:
    times: 5
    while:
      notVisible:
        text: "Image Resize"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Image Resize"
    timeout: 5000
- tapOn: "Wide Image"
- extendedWaitUntil:
