appId: org.commcare.dalvik
tags:
  - multimedia
  - automatable
---
# Master Mobile Plan (2026) > Multimedia > "Image Resize 26" - Photo chosen
# (from gallery) per question + submit.
#
# NAVIGATION CORRECTED (2026-08-11, was previously wrong - see history):
# the real "Multimedia" QA app (qateam - Multimedia CCZ, resources/)
# confirms "Image Resize" is its own top-level module reached directly from
# Start (same as image_resize_01_04_default_setting.yaml), and it contains
# FIVE SEPARATE single-purpose forms (Large/Small/Wide/Tall/Smart Image),
# each with its own one photo question - NOT one combined form with four
# questions in sequence as this flow used to assume (confirmed live,
# 2026-08-10: failed at the very first "Choose Image" tap since the device
# was sitting on the "Image Resize" form-list menu, not inside a form with
# a Choose Image widget yet). Restructured to open each of the four forms
# individually (Smart Image not exercised, matching image_resize_01_04's
# own convention), mirroring that file's Large/Small/Wide/Tall selection
# pattern.
#
# addMedia pushes a small local placeholder PNG (assets/sample_image.png)
# into the device's gallery so "Choose Image" - a real Android
# photo-picker intent, see views/widgets/ImageWidget.java's mChooseButton ->
# WidgetUtils.createPickMediaIntent(getContext(), "image/*") /
# FormEntryConstants.IMAGE_CHOOSER - has something to select. "Choose
# Image" button text verified against res/values/strings.xml:223
# (choose_image = "Choose Image"). Picking the pushed image out of
# whichever picker UI the OS shows is delegated to
# ../common/pick_first_gallery_image.yaml (see that file for the
# addMedia-picker selector citation); reusing the exact same picked image
# for all four forms satisfies the sheet's "select the same image for all
# four questions".
#
# nav_btn_finish id verified against res/layout/screen_form_entry.xml and
# FormAttachmentUploadTest.java's use of R.id.nav_btn_finish to submit a
# form - each of these forms has exactly one question, so nav_btn_finish
# (not nav_btn_next) is the only nav button ever needed here.
- addMedia:
    - "./assets/sample_image.png"
# Prepends install_app_as_web_user.yaml (APP_NAME: Multimedia) - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_MULTIMEDIA}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Image Resize"
# Image Resize 26 - Large/Small/Wide/Tall Image, one photo question each.
# UPDATE: Maestro's `repeat` has no items/for-each mode (`maestro
# check-syntax` rejects `items:` outright - "Unknown Property: items"), so
# this is four explicit blocks rather than a loop, matching
# image_resize_01_04_default_setting.yaml's own convention of naming each
# form individually.
- tapOn: "Large Image"
- tapOn: "Choose Image"
- runFlow: ../common/pick_first_gallery_image.yaml
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- repeat:
    times: 5
    while:
      notVisible:
        text: "Image Resize"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Image Resize"
    timeout: 5000
- tapOn: "Small Image"
- tapOn: "Choose Image"
- runFlow: ../common/pick_first_gallery_image.yaml
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- repeat:
    times: 5
    while:
      notVisible:
        text: "Image Resize"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Image Resize"
    timeout: 5000
- tapOn: "Wide Image"
- tapOn: "Choose Image"
- runFlow: ../common/pick_first_gallery_image.yaml
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- repeat:
    times: 5
    while:
      notVisible:
        text: "Image Resize"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Image Resize"
    timeout: 5000
- tapOn: "Tall Image"
- tapOn: "Choose Image"
- runFlow: ../common/pick_first_gallery_image.yaml
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- repeat:
    times: 5
    while:
      notVisible:
        text: "Start"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Start"
    timeout: 5000
