appId: org.commcare.dalvik
tags:
  - multimedia
  - automatable
---
# Master Mobile Plan (2026) > Multimedia > "Logo 3" - Dimagi logo visible in
# demo mode.
#
# NOTE ON "Login as user demo/123": the sheet describes this as logging in
# with a demo/123 credential pair, but activities/LoginActivity.java shows
# CommCare doesn't actually take a typed demo/123 login on this screen.
# Instead its options menu has a dedicated "Enter Practice Mode" item
# (MENU_PRACTICE_MODE, Localization.get("login.menu.demo") ->
# android_translatable_strings.txt:343 "Enter Practice Mode") wired to
# loginDemoUser(), which logs a synthetic demo user in automatically (either
# DemoUserBuilder.DEMO_USERNAME/DEMO_PASSWORD = "demo_user"/"demo_user", or
# whatever the installed app's own OfflineUserRestore.getDemoUserRestore()
# provides) - no username/password fields are shown or filled in. This flow
# drives that real on-device entry point rather than typing literal
# "demo"/"123" into the password fields, since that input wouldn't actually
# engage demo/practice mode.
#
# HomeScreenBaseActivity.doLoginLaunchChecksInOrder() shows a one-button
# "OK" warning dialog the first time a demo user lands on the home screen
# (showDemoModeWarning() -> demo.mode.warning.title = "Starting Practice
# Mode", android_translatable_strings.txt), which must be dismissed before
# the home screen itself is visible.
# home.start.demo ("Explore CommCare Practice Mode",
# android_translatable_strings.txt:351, HomeButtons.java:55) confirms we've
# landed on the practice-mode home screen, which reuses
# HomeScreenBaseActivity's toolbar/logo - see logo_02's comment for the full
# logo-chain citation and its CAVEAT about the logo ImageView having no
# distinct resource id (id/toolbar is asserted as a best-effort proxy here
# too).
- launchApp
- tapOn: "More options"
- tapOn: "Enter Practice Mode"
- assertVisible: "Starting Practice Mode"
- tapOn: "OK"
- assertVisible: "Explore CommCare Practice Mode"
- assertVisible:
    id: "org.commcare.dalvik:id/toolbar"
