appId: org.commcare.dalvik
tags:
  - multimedia
  - partial
---
# Master Mobile Plan (2026) > Multimedia > "Image Resize 11", "Image Resize
# 12", "Image Resize 13", "Image Resize 14" - repeat of Image Resize 1-4
# (View Large/Small/Wide/Tall image form) after the app's Auto-Resize Images
# setting has been changed to "Horizontal Resize" on HQ.
#
# CSV CAVEAT (not implemented here, flagging explicitly rather than
# silently dropping it): coverage_matrix.csv's own Summary column for these
# four rows is "Repeat with rotation check", i.e. the manual sheet also asks
# the tester to rotate the device and re-check the image for each form at
# this resize tier. This flow does NOT perform a device rotation - only the
# same open/page/exit-with-no-error navigation as 1-4/6-9. Maestro does
# support a `rotateDevice` command in principle, but adding it here without
# knowing what a correct post-rotation assertion would even look like (the
# expected result is again a human "still not distorted" visual check, per
# the CSV's own Dependency/Reason column) risked silently asserting nothing
# meaningful while implying more coverage than exists. Flagged for whoever
# picks this up next rather than guessed at.
#
# SEQUENCING DEPENDENCY: assumes "Image Resize 10" (the HQ-side setting
# change + new build) has already been run - see
# hq_setup/multimedia/image_resize_horizontal_resize.json.
#
# Everything else (menu/form structure assumption, navigation pattern,
# selector citations) is identical to
# flows/multimedia/image_resize_01_04_default_setting.yaml - see that file's
# header for the full citation and caveats, not repeated here to avoid
# drift between the two copies.
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Image Resize"
# Image Resize 11 - Large Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Large Image"
# Image Resize 12 - Small Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Small Image"
# Image Resize 13 - Wide Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Wide Image"
# Image Resize 14 - Tall Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Tall Image"
- back
- extendedWaitUntil:
    visible:
      text: "Start"
    timeout: 5000
