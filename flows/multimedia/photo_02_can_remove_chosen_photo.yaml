appId: org.commcare.dalvik
tags:
  - multimedia
  - automatable
---
# Master Mobile Plan (2026) > Multimedia > "Photo 2" - Can remove chosen
# photo.
#
# UPDATE, confirmed live 2026-08-12 (real on-device recording): ground-
# truthed against the real CCZ (resources/qateam - Multimedia - v381.ccz,
# modules-0/forms-3.xml) - the "Gif/Remove Image" form opens on an
# unrelated intro trigger (this_should_play_a_gif) with no "Choose Image"
# button at all; the previous version of this flow tapped "Choose Image"
# with zero navigation and would never have found it. One nav_btn_next tap
# reaches take_a_photo, the form's first real media question (which - per
# MediaWidget.java - carries BOTH a "Take Picture" and a "Choose Image"
# button), satisfying this row's "choose then remove" check just as well
# as the form's separate, later choose_image question would.
#
# addMedia pushes the same local placeholder PNG used by
# image_resize_26 (assets/sample_image.png) into the device's gallery; see
# ../common/pick_first_gallery_image.yaml for how the pushed image gets
# picked out of the system photo-picker UI after tapping "Choose Image".
#
# Button text verified against res/values/strings.xml:
#   choose_image (line 223) = "Choose Image"
#   discard_image (line 182) = "Remove Image"
# views/widgets/ImageWidget.java: mDiscardButton (wired to discard_image /
# "Remove Image") starts View.GONE and is only set VISIBLE once a binary
# attachment is registered (~line 220); tapping it calls
# clearBinaryAttachment(), which sets it back to View.GONE (~line 304) - so
# assertVisible then assertNotVisible on that exact button text is a direct
# match for the sheet's "button disappears" check.
#
# nav_btn_finish id verified against res/layout/screen_form_entry.xml and
# FormAttachmentUploadTest.java's use of R.id.nav_btn_finish to submit a
# form. Whether the form allows submitting with the image question left
# blank after removal (vs. a required-field validation prompt) depends on
# the specific CCZ's form definition and couldn't be verified here.
- addMedia:
    - "./assets/sample_image.png"
# Prepends install_app_as_web_user.yaml (APP_NAME: Multimedia) - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_MULTIMEDIA}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
# UPDATE, confirmed live (run 31276111657): title/row text ambiguity - see
# flows/multimedia/mm4_question_types.yaml's own UPDATE comment for the
# full root-cause writeup. Fixed the same way: scope to the row_txt id.
- tapOn:
    id: "org.commcare.dalvik:id/row_txt"
    text: "Multimedia"
- tapOn: "Gif/Remove Image"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- tapOn: "Choose Image"
- runFlow: ../common/pick_first_gallery_image.yaml
- assertVisible: "Remove Image"
- tapOn: "Remove Image"
- assertNotVisible: "Remove Image"
# One more question (choose_image, Q3, not required) still follows this
# one before nav_btn_finish appears - see the header's ground-truthed
# question-order citation.
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
