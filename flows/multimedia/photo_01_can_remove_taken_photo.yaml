appId: org.commcare.dalvik
tags:
  - multimedia
  - partial
---
# Master Mobile Plan (2026) > Multimedia > "Photo 1" - Remove a TAKEN
# (camera-captured, not gallery-chosen) photo.
#
# **CAMERA-CAPTURE FLAKINESS CAVEAT (same as coverage_matrix.csv's "Image
# Resize 25" row, which itself has no flow file yet for exactly this
# reason)**: real camera capture is flaky/unsupported on most cloud
# emulators/BrowserStack device images. Unlike addMedia (which pushes a file
# straight into the MediaStore/gallery, used by photo_02 and image_resize_26),
# there is no Maestro-native way to inject a photo into the OS camera app's
# capture flow - this flow instead taps "Take Picture" and then best-effort
# taps a handful of GUESSED shutter/confirm button ids from common Android
# camera apps. THESE SHUTTER/CONFIRM SELECTORS HAVE NOT BEEN VERIFIED AGAINST
# ANY REAL DEVICE OR EMULATOR CAMERA APP IN THIS ENVIRONMENT (analogous to
# how ../common/pick_first_gallery_image.yaml's system-picker ids were taken
# from Maestro's own published recipe, but no equivalent published recipe
# exists for a full "take a real photo" flow) - expect this to need
# per-device-image adjustment, or to simply not work at all on devices whose
# camera app can't produce a picture without real camera hardware/input. Only
# feasible if the BrowserStack device supports an injected camera image, per
# the sheet's own dependency note.
#
# Continues from the same "Gif/Remove Image" form as
# gif_can_add_gif.yaml/photo_02_can_remove_chosen_photo.yaml (Multimedia >
# Gif/Remove Image) and progresses forward to a "Take a photo" question.
#
# UPDATE, confirmed live 2026-08-12 (real on-device recording): ground-
# truthed against the real CCZ (resources/qateam - Multimedia - v381.ccz,
# modules-0/forms-3.xml) - this form has exactly THREE questions, none
# required: this_should_play_a_gif (trigger, Q1 - the form's own opening
# screen), take_a_photo (image, Q2), choose_image (image, Q3). Only ONE
# nav_btn_next tap separates Q1 from "Take Picture" - the previous blind
# "tap next 6 times" would have overshot straight past both image
# questions to FINISH. Replaced with a loop that stops as soon as "Take
# Picture" is visible, matching the generic-navigate-until-target
# convention already used in flows/multimedia/image_resize_25_photo_taken.yaml.
#
# mCaptureButton text verified against res/values/strings.xml:174
# (capture_image = "Take Picture") - app/src/org/commcare/views/widgets/
# MediaWidget.java adds both mCaptureButton and mChooseButton to every media
# question, so "Take Picture" should be present alongside "Choose Image" on
# whichever question this is.
#
# discard_image ("Remove Image") button behavior verified against the same
# ImageWidget.java citation as photo_02_can_remove_chosen_photo.yaml: starts
# View.GONE, only VISIBLE once a binary attachment is actually registered -
# so this flow's assertVisible/tapOn/assertNotVisible sequence only passes if
# the best-effort camera capture above genuinely produced an attached image.
# If the camera step silently fails (very likely on a device without a real
# camera), this flow will fail at the first assertVisible "Remove Image" -
# that's an honest failure, not a false pass.
#
# Deliberately does NOT submit the form afterward: photo_02's own header
# comment already flags that whether this specific CCZ allows submitting
# with the image question left blank after removal is unverified, and the
# sheet's own wording for Photo 1 doesn't call for a submit step.
# Prepends install_app_as_web_user.yaml (APP_NAME: Multimedia) - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_MULTIMEDIA}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
# UPDATE, confirmed live (run 31276111657): title/row text ambiguity - see
# flows/multimedia/mm4_question_types.yaml's own UPDATE comment for the
# full root-cause writeup. Fixed the same way: scope to the row_txt id.
- tapOn:
    id: "org.commcare.dalvik:id/row_txt"
    text: "Multimedia"
- tapOn: "Gif/Remove Image"
- repeat:
    times: 6
    while:
      notVisible: "Take Picture"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
# UPDATE, confirmed live 2026-08-12: this used to hand-roll its own
# shutter/confirm taps instead of calling ../common/capture_camera_photo.yaml
# - missing that shared subflow's own fix for the camera app's first-run
# "Turn on Location tags?" dialog, which can block the shutter button
# entirely. Switched to the shared subflow rather than re-duplicating its
# fixes here.
- tapOn: "Take Picture"
- runFlow: ../common/capture_camera_photo.yaml
- assertVisible: "Remove Image"
- tapOn: "Remove Image"
- assertNotVisible: "Remove Image"
