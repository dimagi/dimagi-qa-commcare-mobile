appId: org.commcare.dalvik
tags:
  - multimedia
  - automatable
---
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
# Prepends install_app_as_web_user.yaml (APP_NAME: Basic Tests) - a fresh
# BrowserStack session has no app installed until this runs; see DispatchActivity.java's
# CommCareSetupActivity routing when currentApp == null.
#
# Master Mobile Plan (2026) > Multimedia > "Capture 1" - Verify user is able
# to capture a signature without any errors.
#
# UPDATE, confirmed live 2026-08-12 via a real physical-device recording
# CROSS-REFERENCED against a live BrowserStack run: the SAME question
# (sig_cap, same itext label "If using an Android device, you should be
# able to capture a signature. Try it out!") rendered completely
# differently on each - a real "GATHER SIGNATURE" button leading to an
# actual DrawActivity canvas on the recording's device, vs. a plain "TAKE
# PICTURE"/"CHOOSE IMAGE" pair on BrowserStack. Switching APP_CODE to
# APP_CODE_BASIC_TESTS_LATEST did NOT resolve it - both codes resolved to
# the identical install code in a live run (no newer Basic Tests build
# currently exists to fall back to), ruling out a CCZ/app-BUILD version
# difference. The real cause is most likely the CommCare mobile APK
# version itself: CI is pinned to commcare_2.63.5, and the client-side
# logic that maps sig_cap's real appearance
# ("broadcast-signature question-tile 2-per-row") to a widget
# (SignatureWidget vs. the generic ImageWidget fallback) may match that
# string differently across CommCare versions than whatever's on the
# recording's device. Since this can't be changed by picking a different
# app build, and the sheet's actual verifiable goal ("capture a
# signature... without errors") is satisfied by whatever real widget this
# question renders as on the CI-pinned CommCare version, this flow
# targets that live, confirmed behavior (a generic image widget) rather
# than the unreachable-on-this-APK-version signature canvas. Revisit if
# the CI-pinned CommCare version ever changes.
#
# FOLLOW-UP (2026-08-12, not yet actioned): the user identified the REAL
# explanation from the recording's own header text - it was running a
# DIFFERENT app, "[Master] Basic Tests NS Copy!!" (visible truncated as
# "[Master] Basic Tests NS Co..." in the recording's own toolbar), not
# the regular "[Master] Basic Tests" app APP_CODE_BASIC_TESTS resolves to.
# This is a genuinely different app_id, not registered in
# scripts/app_registry.py - the CommCare-version theory above is likely
# moot; this was an app-identity mismatch instead. User is confirming the
# real app_id; once known, add a registry entry and switch this flow (and
# capture_02_signature_reset.yaml) back to the real signature-canvas
# implementation (Gather Signature/btnFinishDraw/btnResetDraw - see this
# file's git history for that version) against the correct app.
#
# Navigation: modules.m0="Basic Form Tests", forms.m0f10="Multimedia Only"
# (module index 0, form index 10). No required binds in this form
# (confirmed via the real CCZ, resources/qateam - [Master] Basic Tests -
# v1141.ccz, modules-0/forms-10.xml), and this form uses the X/">"
# swipe-style top bar - one nav_btn_next tap past its own intro trigger
# before sig_cap is reachable.
#
# addMedia + ../common/pick_first_gallery_image.yaml is the same verified
# "choose existing image" mechanism used throughout this repo (e.g.
# photo_02_can_remove_chosen_photo.yaml, image_resize_26_photo_chosen.yaml).
# discard_image ("Remove Image") button behavior (starts GONE, becomes
# VISIBLE once an attachment is registered) verified against the same
# ImageWidget.java citation as photo_02_can_remove_chosen_photo.yaml.
- addMedia:
    - "../multimedia/assets/sample_image.png"
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Basic Form Tests"
- scrollUntilVisible:
    element:
      text: "Multimedia Only"
    direction: DOWN
    timeout: 10000
- tapOn: "Multimedia Only"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- tapOn: "Choose Image"
- runFlow: ../common/pick_first_gallery_image.yaml
- assertVisible: "Remove Image"
