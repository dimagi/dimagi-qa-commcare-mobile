appId: org.commcare.dalvik
tags:
  - multimedia
  - partial
---
# Master Mobile Plan (2026) > Multimedia > "Image Resize 6", "Image Resize
# 7", "Image Resize 8", "Image Resize 9" - repeat of Image Resize 1-4 (View
# Large/Small/Wide/Tall image form) after the app's Auto-Resize Images
# setting has been changed to "Full Resize" on HQ.
#
# SEQUENCING DEPENDENCY: assumes "Image Resize 5" (the HQ-side setting
# change + new build) has already been run - see
# hq_setup/multimedia/image_resize_full_resize.json, which pushes the
# `custom_properties` change and cuts+releases the new build via
# scripts/hq_client.py. This flow itself does not check which resize
# setting is actually in effect (that would again be the same
# visual-regression judgment call the CSV flags for 1-4/6-9/etc.) - it only
# re-runs the on-device navigation, same as 1-4, against whatever build the
# device happens to be running. Per this repo's "each flow runnable in
# isolation" convention (docs/FRAMEWORK.md), it does not itself re-run the
# HQ pre-step; that is orchestrated separately (see hq_setup/multimedia's
# README-equivalent comment in the JSON file, and run_suite.py's
# --hq-setup flag).
#
# Everything else (menu/form structure assumption, navigation pattern,
# selector citations) is identical to
# flows/multimedia/image_resize_01_04_default_setting.yaml - see that file's
# header for the full citation and caveats, not repeated here to avoid
# drift between the two copies.
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Image Resize"
# Image Resize 6 - Large Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Large Image"
# Image Resize 7 - Small Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Small Image"
# Image Resize 8 - Wide Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Wide Image"
# Image Resize 9 - Tall Image
- runFlow:
    file: ../common/view_form_no_errors_from_menu.yaml
    env:
      FORM_NAME: "Tall Image"
- back
- extendedWaitUntil:
    visible:
      text: "Start"
    timeout: 5000
