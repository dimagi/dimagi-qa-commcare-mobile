# Master Mobile Plan (2026) > Multimedia > "Image Resize 25" - Photo taken
# (via device camera) per question + submit.
#
# BEST-EFFORT / GENUINELY FLAKY (flagging clearly up front, the same way
# photo_02_can_remove_chosen_photo.yaml flags its own caveats):
# coverage_matrix.csv's own Dependency/Reason for this exact row says
# outright "Camera capture is flaky/unsupported on most cloud emulators;
# feasible only if the BrowserStack device supports an injected camera
# image." This flow is written on that same understanding and should be
# treated as a best-effort attempt, not a reliable CI gate.
#
# Unlike Image Resize 26 (gallery pick), there is no Maestro
# `addMedia`-equivalent for camera capture: ImageWidget.java's
# mCaptureButton fires a real `android.provider.MediaStore.ACTION_IMAGE_
# CAPTURE` intent (verified: buildSystemCaptureIntent(), line 291) which
# hands off to whichever camera app is registered on the device/emulator -
# a real capture UI Maestro doesn't control, whose ids/behavior vary by OS
# build, vendor camera app, and BrowserStack's own per-device virtual/
# injected camera feed. The camera-side interaction is delegated to
# ../common/capture_camera_photo.yaml (see that file's header for the full
# best-effort/unverified caveat - every tap there is optional so a
# non-matching camera UI degrades to a silent no-op rather than a hard
# failure, but that also means this flow cannot guarantee a photo was
# actually captured on a given device image).
#
# UPDATE, confirmed live 2026-08-11 (CI run 31476507436): "Repeat 3 times:
# Take Picture" failed with element not found - the previous assumption
# below (one form with four photo questions in sequence) was wrong, the
# exact same wrong assumption image_resize_26_photo_chosen.yaml used to
# make before its own 2026-08-11 correction. Ground-truthed against the
# real CCZ (resources/qateam - Multimedia - v381.ccz, modules-1/forms-0.xml
# through forms-3.xml): "Image Resize" contains FOUR SEPARATE forms (Large/
# Small/Wide/Tall Image, Smart Image not exercised, matching
# image_resize_26's own convention), each a much longer form than a single
# photo question - image_intro trigger -> text_image input -> large_label
# trigger -> single/multi selects -> list_intro trigger -> a field-list
# group containing num/id/THEN the camera-capture image question alongside
# audio/video upload siblings -> signature -> decimal/date/time/date_time ->
# geopoint -> barcode -> hidden field. None of this form's <bind> elements
# carry required="true()" (verified the same way as
# flows/form_submissions/question_types_01_03_answer_and_submit.yaml), so
# it's safe to generically page through with nav_btn_next until the "Take
# Picture" button appears, matching this repo's established
# generic-navigation convention. Restructured to open each of the four
# forms individually below, mirroring image_resize_26's own restructuring.
#
# "Take Picture" button text verified against res/values/strings.xml:174
# (capture_image = "Take Picture"). nav_btn_next / nav_btn_finish ids
# verified the same way as image_resize_26_photo_chosen.yaml -
# res/layout/screen_form_entry.xml and FormAttachmentUploadTest.java's use
# of R.id.nav_btn_next/nav_btn_finish to advance/submit a form.
#
# UPDATE (2nd correction), confirmed live 2026-08-11: same
# transition-settle race found and fixed in
# image_resize_26_photo_chosen.yaml's own 2nd correction - added
# waitForAnimationToEnd before each of the four "page through until Take
# Picture" loops below.
# Prepends install_app_as_web_user.yaml (APP_NAME: Multimedia) - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_MULTIMEDIA}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Image Resize"

- tapOn: "Large Image"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 10000
- waitForAnimationToEnd
# UPDATE (3rd correction): same fixed 2s buffer added in
# image_resize_26_photo_chosen.yaml's own 3rd correction - see that file's
# comment for the full root-cause writeup (waitForAnimationToEnd alone
# wasn't enough against real device lag from 30+ consecutive builds this
# session).
- extendedWaitUntil:
    notVisible: "___maestro_fixed_pause_sentinel___"
    timeout: 2000
- repeat:
    times: 20
    while:
      notVisible: "Take Picture"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- tapOn: "Take Picture"
- runFlow: ../common/capture_camera_photo.yaml
- repeat:
    times: 20
    while:
      visible:
        id: "org.commcare.dalvik:id/nav_btn_next"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
          optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
    optional: true
- repeat:
    times: 5
    while:
      notVisible:
        text: "Image Resize"
    commands:
      - back
- extendedWaitUntil:
    visible:
      text: "Image Resize"
    timeout: 5000

- tapOn: "Small Image"
- extendedWaitUntil:
