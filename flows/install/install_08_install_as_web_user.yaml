appId: org.commcare.dalvik
tags:
  - install
  - partial
---
# Master Mobile Plan (2026) > Install > "Install 8" - Install app as a web user.
# PARTIAL: needs a valid HQ web-user email/password.
- launchApp
# Waits for "More options" rather than tapping it blindly: live BrowserStack
# evidence showed this exact tap (the very first interaction after a cold
# app launch) failing with "Element not found" - most likely
# CommCareSetupActivity/its toolbar hasn't finished rendering yet
# immediately after launchApp.
- extendedWaitUntil:
    visible: "More options"
    timeout: 20000
- tapOn: "More options"
- tapOn: "See Apps for My User"
- tapOn:
    id: "org.commcare.dalvik:id/switch_button"
- tapOn:
    id: "org.commcare.dalvik:id/edit_email"
# Confirmed against real BrowserStack runs: the FIRST tap that opens the
# keyboard on a fresh device session can trigger Gboard's one-time "Get Smart
# content directly in the keyboard" system consent dialog - a full-screen
# OS-level overlay unrelated to this app that blocks every subsequent tap
# until dismissed. `optional: true` makes this a no-op when it doesn't appear.
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_WEB_USER_EMAIL}"
# Dismiss the keyboard by tapping a non-interactive area (the screen's own
# title TextView, id/feature_prompt) BEFORE tapping edit_password, rather
# than hideKeyboard - confirmed against Maestro's own docs: on Android,
# hideKeyboard ALWAYS sends a back-button press (there's no OS-level "hide
# keyboard" API Maestro can call directly), regardless of whether a keyboard
# is actually showing. Live BrowserStack evidence (from
# flows/common/install_app_as_web_user.yaml, which copied this exact
# sequence) showed the password ending up typed into edit_email right after
# the email text with no separator - most likely auth_scroll_view (this
# whole form is inside a ScrollView) re-laying-out while the IME was still
# up, moving edit_password's position between when Maestro read the view
# hierarchy and when the tap executed; tapping a plain TextView (not the
# EditText itself) drops focus and dismisses the IME the same way a user
# tapping empty space would, without risking back-navigation.
- tapOn:
    id: "org.commcare.dalvik:id/feature_prompt"
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- inputText: "${HQ_WEB_USER_PASSWORD}"
- tapOn:
    id: "org.commcare.dalvik:id/feature_prompt"
- tapOn:
    text: "Skip"
    optional: true
# UPDATE - do NOT retry hideKeyboard here (a previous version of this file
# did, following install_07's example): with the keyboard already dismissed
# above via the feature_prompt tap, each further hideKeyboard call still
# fires its unconditional back-button press regardless - confirmed via a
# real BrowserStack failure whose commandlogs hierarchy dump showed the
# SAMSUNG HOME LAUNCHER on screen at this exact point (from
# install_app_as_web_user.yaml, which copies this same sequence), meaning
# the repeated back-presses had exited org.commcare.dalvik entirely. A
# single wait for get_apps_button is enough now that the keyboard is
# already down.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/get_apps_button"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/apps_list_view"
    timeout: 30000
- tapOn:
    id: "org.commcare.dalvik:id/apps_list_view"
# Confirmed against a real BrowserStack run: this tap actually DOES trigger a
# real install (a follow-up screenshot showed "Setting Up App, Step 67 of
# 90" actively progressing) even when Maestro reports the tap itself as
# FAILED - it can't reconcile its hierarchy-change check with the heavy
# native "Setting Up App" dialog taking over the screen. optional:true stops
# that self-reported failure from aborting the flow; the extendedWaitUntil
# below is the real success gate.
- tapOn:
    id: "org.commcare.dalvik:id/install_app_button"
    retryTapIfNoChange: false
    optional: true
- extendedWaitUntil:
    visible: "Setting Up App"
    timeout: 60000
