appId: org.commcare.dalvik
tags:
  - install
  - partial
---
# Master Mobile Plan (2026) > Install > "Install 7" - Install app as a mobile user.
# PARTIAL: needs a valid HQ mobile-worker username/domain/password. Uses the
# same fields InstallFromListTest.kt drives (edit_username/edit_domain/edit_password).
- launchApp
# Waits for "More options" rather than tapping it blindly: live BrowserStack
# evidence (from flows/common/install_app_as_web_user.yaml, which copied
# this same first-tap pattern) showed this exact tap failing with "Element
# not found" right after a cold app launch - most likely
# CommCareSetupActivity/its toolbar hasn't finished rendering yet.
- extendedWaitUntil:
    visible: "More options"
    timeout: 20000
- tapOn: "More options"
- tapOn: "See Apps for My User"
- tapOn:
    id: "org.commcare.dalvik:id/edit_username"
# Confirmed against several real BrowserStack runs: the FIRST tap that opens
# the keyboard on a fresh device session can trigger Gboard's one-time
# "Get Smart content directly in the keyboard" system consent dialog, which
# is a full-screen OS-level overlay completely unrelated to this app. It
# blocks every subsequent tap until dismissed (this was the real cause of
# several confusing earlier failures, including an apparent "password field
# got silently cleared" - a hardware Back press was actually dismissing this
# dialog, not the keyboard, at that moment). Dismiss it defensively wherever
# it might appear; `optional: true` makes it a no-op when it doesn't.
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_MOBILE_WORKER_USERNAME}"
- tapOn:
    id: "org.commcare.dalvik:id/edit_domain"
- inputText: "${HQ_DOMAIN}"
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- inputText: "${HQ_MOBILE_WORKER_PASSWORD}"
# UPDATE - do NOT use hideKeyboard here (this file previously did, repeated
# 3x below this comment's old position): confirmed against Maestro's own
# docs, on Android hideKeyboard ALWAYS sends a back-button press (there's no
# OS-level "hide keyboard" API Maestro can call directly), regardless of
# whether a keyboard is actually showing - and a real BrowserStack failure
# (on flows/common/install_app_as_web_user.yaml, which shares this same
# screen/pattern) showed the SAMSUNG HOME LAUNCHER on screen at the
# get_apps_button wait, meaning repeated hideKeyboard calls had backed all
# the way out of org.commcare.dalvik. Tapping a non-interactive area (the
# screen's own title TextView, id/feature_prompt) drops focus and dismisses
# the IME the same way a user tapping empty space would, without that risk -
# this replaces the old "hideKeyboard has proven flaky" workaround below,
# which was itself the cause of the flakiness, not a fix for it.
- tapOn:
    id: "org.commcare.dalvik:id/feature_prompt"
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/get_apps_button"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/apps_list_view"
    timeout: 30000
- tapOn:
    id: "org.commcare.dalvik:id/apps_list_view"
# Confirmed against a real BrowserStack run on install_08: this tap actually
# DOES trigger a real install even when Maestro reports the tap itself as
# FAILED - it can't reconcile its hierarchy-change check with the heavy
# native "Setting Up App" dialog taking over the screen. optional:true stops
# that self-reported failure from aborting the flow; the extendedWaitUntil
# below is the real success gate.
- tapOn:
    id: "org.commcare.dalvik:id/install_app_button"
    retryTapIfNoChange: false
    optional: true
- extendedWaitUntil:
    visible: "Setting Up App"
    timeout: 60000
