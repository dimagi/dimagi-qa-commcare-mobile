appId: org.commcare.dalvik
tags:
  - install
  - partial
---
# Master Mobile Plan (2026) > Install > "Install 7" - Install app as a mobile user.
# PARTIAL: needs a valid HQ mobile-worker username/domain/password. Uses the
# same fields InstallFromListTest.kt drives (edit_username/edit_domain/edit_password).
- launchApp:
    clearState: true
# Waits for "More options" rather than tapping it blindly: live BrowserStack
# evidence (from flows/common/install_app_as_web_user.yaml, which copied
# this same first-tap pattern) showed this exact tap failing with "Element
# not found" right after a cold app launch - most likely
# CommCareSetupActivity/its toolbar hasn't finished rendering yet.
- extendedWaitUntil:
    visible: "More options"
    timeout: 20000
- tapOn: "More options"
- tapOn: "See Apps for My User"
# Waits for edit_username rather than tapping it blindly, same reasoning as
# the "More options" wait above: "See Apps for My User" navigates into a
# new activity (InstallFromListActivity), and a real BrowserStack failure
# (on flows/common/install_app_as_web_user.yaml, which hits the equivalent
# switch_button element right after this same navigating tap) showed
# "Element not found" here - most likely that activity hadn't finished
# rendering yet immediately after the navigating tap.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/edit_username"
    timeout: 15000
- tapOn:
    id: "org.commcare.dalvik:id/edit_username"
# Confirmed against several real BrowserStack runs: tapping into any of
# this screen's 3 fields for the first time can trigger Gboard's one-time
# "Get Smart content directly in the keyboard" system consent dialog, a
# full-screen OS-level overlay completely unrelated to this app. It's NOT
# reliably tied to just the very FIRST tap of the whole session - confirmed
# live (2026-08-08, frame-by-frame video review) it can appear only after
# username AND domain are already filled, right as the password field gets
# focus, and dismissing it there doesn't cleanly resume the form: the
# following hideKeyboard call (with no real IME left to dismiss, since the
# dialog already consumed that "back" semantically) fell through to a REAL
# back-press that exited the app to the home screen entirely - reproducing
# the same class of bug documented elsewhere in this repo as "an apparent
# password field got silently cleared". Fix: check for and dismiss it
# before EVERY field tap, not just the first - `optional: true` makes each
# check a no-op when it doesn't appear.
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_MOBILE_WORKER_USERNAME}"
- tapOn:
    id: "org.commcare.dalvik:id/edit_domain"
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_DOMAIN}"
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_MOBILE_WORKER_PASSWORD}"
# UPDATE (2nd correction) - a single hideKeyboard call (this file's original,
# pre-session version) IS correct and was never the actual problem: on
# Android a back-press's FIRST effect, when an IME is genuinely showing, is
# to dismiss ONLY the keyboard, not navigate the activity back - that only
# happens on a SECOND back-press once no keyboard remains. The real bug was
# the "repeat hideKeyboard 3x" block this file used to have right after this
# point: once that single call had already dismissed the keyboard, each
# repeat then fell through to a real back-navigation, and enough of them
# exited the app entirely - confirmed via a real BrowserStack failure (on
# flows/common/install_app_as_web_user.yaml, which shares this same
# screen/pattern) whose commandlogs hierarchy dump showed the SAMSUNG HOME
# LAUNCHER on screen at the get_apps_button wait. A previous edit here
# overcorrected by removing hideKeyboard entirely and tapping
# id/feature_prompt instead - confirmed via a real BrowserStack screenshot
# that this does NOT dismiss the keyboard at all (tapping a plain,
# non-focusable TextView doesn't reliably steal focus away from an EditText
# on Android), leaving the keyboard covering get_apps_button. Restored the
# single hideKeyboard call; the repeat block stays removed.
- hideKeyboard
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/get_apps_button"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/apps_list_view"
    timeout: 30000
- tapOn:
    id: "org.commcare.dalvik:id/apps_list_view"
# Confirmed against a real BrowserStack run on install_08: this tap actually
# DOES trigger a real install even when Maestro reports the tap itself as
# FAILED - it can't reconcile its hierarchy-change check with the heavy
# native "Setting Up App" dialog taking over the screen. optional:true stops
# that self-reported failure from aborting the flow; the extendedWaitUntil
# below is the real success gate.
- tapOn:
    id: "org.commcare.dalvik:id/install_app_button"
    retryTapIfNoChange: false
    optional: true
# UPDATE, confirmed live (2026-08-08, full-suite run 31256655977) on
# install_08 (same inlined pattern, same failure): this used to be a hard
# (non-optional) assertion and failed even though the install genuinely
# succeeded. Same root cause flows/common/install_app_as_web_user.yaml's
# own FIFTH CAVEAT already documents and fixed there: "Setting Up App" is
# only a transitional loading screen that doesn't reliably render long
# enough (or at all) to be caught by a poll-based wait - this standalone
# file's copy of the sequence never got that same fix. Made optional, with
# the mobile-worker credentials already entered above meaning a successful
# install lands straight on the home screen ("Start") rather than another
# login prompt - asserted afterward as this flow's real success criterion.
- extendedWaitUntil:
    visible: "Setting Up App"
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 90000
