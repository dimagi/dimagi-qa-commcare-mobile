appId: org.commcare.dalvik
tags:
  - install
  - automatable
---
# Master Mobile Plan (2026) > Install > "Install 6" - Verifying web user page.
# switch_button toggles between the mobile-worker and web-user forms (see
# InstallFromListTest.kt line ~60/89).
- launchApp:
    clearState: true
- tapOn: "More options"
- tapOn: "See Apps for My User"
- tapOn:
    id: "org.commcare.dalvik:id/switch_button"
- assertVisible:
    id: "org.commcare.dalvik:id/edit_email"
- assertVisible:
    id: "org.commcare.dalvik:id/edit_password"
- assertVisible:
    id: "org.commcare.dalvik:id/get_apps_button"
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
# TODO(verify): same unverified error-string caveat as install_05.
