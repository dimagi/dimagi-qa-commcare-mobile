appId: org.commcare.dalvik
tags:
  - session_expiration
  - automatable
---
# Master Mobile Plan (2026) > Session Expiration > "Setup 1" - Install
# Application.
#
# RECLASSIFIED Automatable (2026-09-01), correcting a stale PARTIAL: this
# flow was never actually blocked on a live HQ web-user credential the way
# its old header (and install_08_install_as_web_user.yaml's own genuinely
# different, still-Partial mechanism) implied - it uses
# install_app_by_code.yaml, whose APP_CODE_SESSION_EXPIRATION is resolved
# server-side ONCE per run via resolve_app_codes() (the same
# HQ_WEB_USER_EMAIL/PASSWORD every other app-code flow in this suite already
# depends on), not a live on-device email/password entry. Confirmed passing
# live 2026-09-01. Installs "Session Expiration Test" specifically (not the
# default Basic Tests app every other workflow's flows assume) - see
# SessionExpirationTest.kt/SessionExpirationTests.kt's own APP_NAME
# citation below for why targeting this app is correct.
#
# Verified against commcare-android source (read-only reference, not modified):
#   app/instrumentation-tests/src/org/commcare/androidTests/SessionExpirationTest.kt
#     and SessionExpirationTests.kt: both companion objects declare
#     APP_NAME = "Session Expiration Test" - the exact string this flow
#     passes through to the shared subflow.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_SESSION_EXPIRATION}
- assertVisible:
    id: "org.commcare.dalvik:id/edit_username"
