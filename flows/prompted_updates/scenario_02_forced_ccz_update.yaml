appId: org.commcare.dalvik
tags:
  - prompted_updates
  - partial
---
# Master Mobile Plan (2026) > Prompted Updates > "Prompted Update Scenario 2" -
# Forced CCZ update blocker screen.
#
# PARTIAL: requires two HQ pre-steps that must straddle an on-device login -
# see hq_setup/prompted_updates/scenario_02_forced.json's header for exactly
# when to run each of its two actions (set_prompt_update_settings BEFORE the
# first login below, mark_build_status BEFORE the relogin below - see the
# "=== HQ pre-step ===" markers). ASSUMES the device has already been
# uninstalled and reinstalled to the prior released version (harness-level
# provisioning, out of Maestro's scope - same caveat as the "Setup" row in
# flows/updates_partial_failed/scenario_3_reverted_app_versions.yaml) and
# Setup 2/3 have already run.
#
# Selectors/strings verified against commcare-android source (read-only
# reference, not modified):
#   app/src/org/commcare/activities/PromptCczUpdateActivity.java:
#     setUpTypeSpecificUIComponents() sets promptTitle to
#     "ccz.update.required.title" when inForceMode() (vs
#     "ccz.update.available.title" for the optional case), and
#     actionButton's text to "ccz.update.action" either way.
#   app/src/org/commcare/activities/PromptActivity.java:
#     onBackPressed() only calls super.onBackPressed() when !inForceMode() -
#     i.e. in force mode the back press is a documented no-op, and
#     updateVisibilities() hides doLaterButton ("I'll update later") entirely
#     in force mode, so there is no dismiss path off this screen.
#   app/assets/locales/android_translatable_strings.txt:
#     ccz.update.required.title = "New version of the application is required"
#     ccz.update.action = "Update to the Latest App Version"
#     updates.staged.version = "Update to version ${0} & log out"
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") -
# a fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null. Only needed once, before the first login below - the later
# re-logins in this same flow reuse the app that's still installed.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- assertVisible: "Start"
- assertNotVisible: "New version of the application is required"
- runFlow: ../common/logout.yaml

# === HQ pre-step runs here in a real execution: mark the latest build Released ===
# (hq_setup/prompted_updates/scenario_02_forced.json's mark_build_status action)
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}

# Forced blocker appears automatically on this login - confirm it, and that
# it cannot be dismissed via the device Back button.
- extendedWaitUntil:
    visible: "New version of the application is required"
    timeout: 15000
- pressKey: Back
- assertVisible: "New version of the application is required"

# Proceed through the (unavoidable) forced update.
- tapOn: "Update to the Latest App Version"
- extendedWaitUntil:
    visible:
      text: "Update to version.*log out"
    timeout: 30000
- tapOn:
    text: "Update to version.*log out"

# Relogin: confirm no more prompt now that the device is on the latest version.
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- assertNotVisible: "New version of the application is required"
- assertNotVisible: "New version of the application is available"
- assertVisible: "Start"
