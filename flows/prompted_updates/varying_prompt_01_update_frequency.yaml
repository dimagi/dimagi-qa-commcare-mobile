appId: org.commcare.dalvik
tags:
  - prompted_updates
  - automatable
---
# Master Mobile Plan (2026) > Prompted Updates > "Varying Prompt 1" - Test Frequency.
# ASSUMES the HQ-side setup has already run (see hq_setup/prompted_updates/
# varying_prompt_setup.json): release note "3.4,1" build released.
#
# UPDATE (2026-08-20), confirmed via a user-supplied recording of this
# exact flow: was installing APP_CODE_BASIC_TESTS (the wrong app) - the
# prompt shown in that recording fires on "Case Managements!", not "Basic
# Tests".
#
# UPDATE (2026-08-20), per direct user instruction: installs the EXISTING
# build carrying release note "3.4,1" (v230, per the test plan's own step 1)
# rather than a build hq_setup creates fresh - see scripts/app_registry.py's
# CASE_MANAGEMENTS_VARYING_PROMPT entry for the full citation.
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Case Managements.*") -
# a fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null. Only needed once, before the first login below - the later
# re-logins in this same flow reuse the app that's still installed.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_CASE_MANAGEMENTS_VARYING_PROMPT}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- runFlow: ../common/update_app_via_menu.yaml
- runFlow: ../common/logout.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- assertNotVisible: "New version of the application is available"
