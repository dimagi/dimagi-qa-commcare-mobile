appId: org.commcare.dalvik
tags:
  - prompted_updates
  - automatable
---
# Master Mobile Plan (2026) > Prompted Updates > "Varying Prompt 4" - Reduced
# Show Frequency. Self-contained: first replays varying_prompt_03's 3
# dismissed-prompt logins (which is what actually reduces the frequency),
# then verifies the prompt stays suppressed for 3 more logins and reappears
# on the 4th.
#
# UPDATE (2026-08-20), same app-code fix as varying_prompt_01_update_frequency.yaml
# - see that file's own UPDATE comment for the full citation (was
# installing the wrong app; the actual prompt fires on "Case
# Managements!").
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Case Managements.*") -
# a fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null. Only needed once, before the first login below - the later
# re-logins in this same flow reuse the app that's still installed.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_CASE_MANAGEMENTS}
- repeat:
    times: 3
    commands:
      - runFlow:
          file: ../common/login.yaml
          env:
            USERNAME: ${CC_TEST2_USERNAME}
            PASSWORD: ${CC_TEST2_PASSWORD}
      - assertVisible: "New version of the application is available"
      - tapOn: "I'll update later"
      - runFlow: ../common/logout.yaml
- repeat:
    times: 3
    commands:
      - runFlow:
          file: ../common/login.yaml
          env:
            USERNAME: ${CC_TEST2_USERNAME}
            PASSWORD: ${CC_TEST2_PASSWORD}
      - assertNotVisible: "New version of the application is available"
      - runFlow: ../common/logout.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST2_USERNAME}
      PASSWORD: ${CC_TEST2_PASSWORD}
- assertVisible: "New version of the application is available"
