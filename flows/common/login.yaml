appId: org.commcare.dalvik
---
# Reusable login subflow. Params: USERNAME, PASSWORD.
# Selectors verified against commcare-android source (read-only reference, not modified):
#   app/instrumentation-tests/src/org/commcare/utils/InstrumentationUtility.kt -> login()
#   app/src/org/commcare/activities/LoginActivity.java (R.id.edit_username / edit_password / login_button)
# Confirmed (2026-08-08, user report + video, on install_07/08's identical
# fields): tapping into a text field for the first time can trigger
# Gboard's one-time "Get Smart content directly in the keyboard" system
# consent dialog - a full-screen OS-level overlay unrelated to this app.
# It's NOT reliably tied to just the very first keyboard tap of the whole
# session, so both fields below guard against it, not just this one.
#
# UPDATE, UPDATE (2nd correction), and UPDATE (3rd correction) - three
# progressively more careful timing-based fixes (re-tap the field after
# dismissing "Skip"; then also waitForAnimationToEnd before the re-tap)
# were each confirmed live to reduce but NOT eliminate the underlying bug:
# dismissing Gboard's popup can reassign Android focus back to a
# PREVIOUSLY-active field asynchronously, racing with whatever Maestro does
# next regardless of how many waits/re-taps are inserted (confirmed via a
# real re-run, build fb330cc0e184ee53e4ad5351b6f1f846cf986b38, still
# producing e.g. "qateam123" in the domain field with password left empty
# even with the wait+re-tap fix in place). Rather than keep guessing at
# timing, this now SELF-VERIFIES: each field is wrapped in a bounded
# repeat-while loop keyed on the combined id+text selector (Maestro ANDs
# multiple properties on one selector object - both must match the SAME
# element), which only exits once that specific field visibly holds
# exactly the intended value. If Gboard's popup (or its focus race)
# corrupts a field, the loop's condition simply stays true and it retries
# (re-tap, dismiss Skip if present, erase, retype) up to 3 times rather
# than trusting a single attempt's timing to have been correct.
#
# UPDATE (4th correction), confirmed live (2026-08-08, real BrowserStack
# failure + user-provided screen recording, install_08's identical pattern
# with HQ_WEB_USER_EMAIL="kbordoloi+maestro@dimagi.com"): the self-verify
# condition itself had a latent bug - `text: "^${VALUE}$"` feeds VALUE
# straight into a Maestro/Java regex with NO escaping, so any value
# containing regex metacharacters ("+" and "." in an email address, e.g.)
# never actually matches itself. The condition was therefore ALWAYS false
# for that field, so the loop kept blindly re-erasing and re-typing the
# ALREADY-correct value on every run - and each unnecessary extra
# tap/erase/type cycle was one more chance for the real Gboard focus race
# to fire, which is exactly what produced a genuinely doubled value
# ("...@dimagi.com@dim..."). Fixed by wrapping every interpolated value in
# Java regex's literal-quote syntax, \Q...\E (everything between them is
# matched as literal text, metacharacters included) - safe to apply here
# even though USERNAME/PASSWORD happen to contain no metacharacters today,
# since this subflow's params are caller-supplied and shouldn't assume that
# stays true.
- repeat:
    times: 3
    while:
      notVisible:
        id: "org.commcare.dalvik:id/edit_username"
        text: "^\\Q${USERNAME}\\E$"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/edit_username"
      - tapOn:
          text: "Skip"
          optional: true
      - tapOn:
          id: "org.commcare.dalvik:id/edit_username"
      # Confirmed (2026-08-08, user report + video): CommCare's username
      # field keeps its last-used value even after logout, so a bare
      # inputText here would concatenate onto whatever's already there
      # (e.g. "test1" + "test1" -> "test1test1"). eraseText is a no-op on
      # an already-empty field, so this is safe on a fresh install too.
      - eraseText
      - inputText: "${USERNAME}"
- repeat:
    times: 3
    while:
      notVisible:
        id: "org.commcare.dalvik:id/edit_password"
        text: "^\\Q${PASSWORD}\\E$"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/edit_password"
      - tapOn:
          text: "Skip"
          optional: true
      - tapOn:
          id: "org.commcare.dalvik:id/edit_password"
      - eraseText
      - inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/login_button"
# UPDATE (2026-08-27), confirmed live (4 real BrowserStack failures in a
# row, builds 3bda833b.../aa69e2de.../f2b9c12830...,
# update_app_02_forced_two_to_three.yaml on a freshly-registered app): a
# real, on-screen "Empty Password" error (in red, right under LOG IN)
# appeared even though the password self-verify loop above genuinely
# reported the field non-empty every time - a real discrepancy between
# Maestro's own accessibility-tree read of the masked field (unreliable,
# per this file's own earlier-tried-and-abandoned .+ non-empty check) and
# the app's real internal EditText value at the moment LOG IN is tapped.
# Verified against commcare-android source (read-only reference, not
# modified): LoginActivity.doLogin() checks `"".equals(passwordOrPin)`
# (the field's REAL committed text, read fresh at tap time) and calls
# raiseLoginMessage(StockMessages.Auth_EmptyPassword, false) then returns
# immediately - no network call, login_button stays enabled/tappable
# afterward, same as the Bad Server Response/Server Error/Couldn't Reach
# Server cases below. Real string confirmed in android_translatable_
# strings.txt: login.attempt.fail.empty.pw.title=Empty Password. Unlike
# the pre-tap field check (which can't reliably tell real content from
# whatever Maestro's own accessibility read happens to show), this checks
# the app's OWN post-tap verdict directly - a signal proven reliable by
# this real evidence - and retypes+retaps if it fires.
- repeat:
    times: 3
    while:
      visible:
        text: "Empty Password"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/edit_password"
      - eraseText
      - inputText: "${PASSWORD}"
      - hideKeyboard
      - tapOn:
          id: "org.commcare.dalvik:id/login_button"
# UPDATE, confirmed live (2026-08-08, real BrowserStack failure on BOTH the
# main attempt and its --retry-failed re-run, build
# af73a71fe00d14a20fc6d59a0b3a2da22c1211a0, on
# flows/form_submissions/geoservice_02_auto_capture_location_submit.yaml
# and flows/update/update_target_developer_options_flow.yaml, both of which
# call this subflow): the maestroScreenshot showed the device never left
# LoginActivity - username filled in correctly, but red "Bad Server
# Response" text below LOG IN. This is a real server-side response failure
# on the very first post-login network call, not a selector bug. Root
# cause verified against commcare-android source (read-only reference, not
# modified): "Bad Server Response" is notification.restore.baddata.title
# (android_translatable_strings.txt:595), wired up in
# LoginActivity.onLoginError() mapping LoginError.BadResponse/BadData to
# this title. LoginError.BadResponse traces to
# HttpCalloutOutcomes.BadResponse, set in ManageKeyRecordTask.java's
# doResponseOther() for any non-2xx/401/403 HTTP status on the key-exchange
# callout - the FIRST server request after tapping LOG IN, before any
# restore/sync screen ever appears. LoginActivityUIController.setErrorMessageUI()
# shows this error text WITHOUT disabling login_button - tapping LOG IN
# again is a genuine, source-backed retry, not a workaround. Architecturally
# a transient server-side hiccup (plausibly from many CI sessions
# authenticating against the same test accounts around the same point in a
# run), fixed centrally here (not duplicated per-caller) since every flow
# that logs in shares this same exposure.
#
# UPDATE, confirmed live (2026-08-08, real CI run 31272376559): 3 immediate
# back-to-back retries weren't enough - this recurred on
# update_target_developer_options_flow.yaml (twice) and
# login/commcare_odk_01_login.yaml, persisting through all 3 attempts each
# time. If the server is genuinely under sustained load (many parallel CI
# sessions hitting the same key-exchange endpoint around the same time, as
# the original theory suggested), hammering it with immediate retries gives
# it no time to recover. Raised to 5 attempts and inserted a real pause
# between each (waitForAnimationToEnd's timeout used as a settling delay,
# since Maestro has no standalone "wait N ms" command) rather than retrying
# instantly.
- repeat:
    times: 5
    while:
      visible:
        text: "Bad Server Response"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "org.commcare.dalvik:id/login_button"
# UPDATE (2026-08-19), confirmed live (Android 16, builds
# batch2-regressions-fix-v5/v6, both otherwise-unrelated flows failing at
# this exact same point): a DIFFERENT error text - "Server Error" with a
# "See Error Details" link, not "Bad Server Response" above - appeared
# twice in a row on the login screen, same transient-server-hiccup class
# of failure (still on LoginActivity, login_button still present/tappable)
# but a different string this repo hadn't handled yet. Same bounded-retry
# treatment as the "Bad Server Response" case above, for the same reason:
# a real, source-backed retry rather than a workaround, fixed centrally
# here since every flow that logs in shares this same exposure.
- repeat:
    times: 5
    while:
      visible:
        text: "Server Error"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "org.commcare.dalvik:id/login_button"
# UPDATE (2026-08-19, 2nd correction), confirmed live (build
# batch2-regressions-fix-v11, during the same real HQ outage/recovery
# window as the "Server Error" case above): a THIRD distinct string -
# "Couldn't Reach Server. Please check your network connection" - a
# device-side connectivity failure rather than a server-side error
# response, but still landing on this same login screen with login_button
# still present/tappable. Same bounded-retry treatment, for the same
# reason: a real retry rather than a workaround, fixed centrally here.
- repeat:
    times: 5
    while:
      visible:
        text: "Couldn't Reach Server"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "org.commcare.dalvik:id/login_button"
# A first (or post-reinstall) login triggers a data restore/sync that shows
# "Processing Data from Server" with a live progress counter (e.g.
# "Completed: 4613/5807") - confirmed via a real BrowserStack failure whose
# view-hierarchy dump showed exactly this screen still on-screen when the
# CALLER's very next assertion fired. Every flow using this shared subflow
# asserts on whatever screen comes AFTER login, so the wait belongs here
# rather than being duplicated in each caller. notVisible succeeds
# immediately if this screen never appears (e.g. a login with nothing to
# restore), so this is safe to run unconditionally.
#
# UPDATE, confirmed live (real BrowserStack failure + full-suite retry on
# the SAME build - NOT flaky - build fcff4c622a197b5e216b810db331791689b8573e,
# session 6defec6b6237a77c4ce1df53f77ad8f77b9829facc660bd0, on
# flows/form_submissions/multiple_submissions_10x_background_sync.yaml):
# "Processing Data from Server" is only the FINAL phase of this same
# restore/sync dialog, not the only one. Verified against
# LoginActivity.java's generateProgressDialog() (DataPullTask.DATA_PULL_TASK_ID
# case): the dialog starts as sync.communicating.title="Communicating with
# Server" / sync.progress.starting="Requesting Data..." and its title and
# message get swapped in place as the pull progresses through
# sync.progress.authing="Contacting server for sync...",
# sync.progress.downloading="Server contacted, downloading data.",
# sync.downloading.title="Downloading Data from Server", and only THEN
# sync.processing.title="Processing Data from Server" (all titles/messages
# at android_translatable_strings.txt:149-161). It is the SAME
# DialogFragment/button throughout - CustomProgressDialog.java's
# setupCancelButton() always binds R.id.dialog_cancel_button, the one
# literal "STOP" button defined once in
# res/layout/progress_dialog_cancel_button.xml and reused by every phase -
# not a new screen per phase. The old wait here only ever looked for the
# LAST phase's text, so if the pull is slow/stuck in an EARLIER phase (as
# it live was: the failing build's own screenshot at the caller's timeout
# showed the device still on "Communicating with Server" / "Contacting
# server for sync..." with the STOP button visible), "Processing Data from
# Server" had simply never appeared YET - this wait's notVisible check
# reported success in under a second, as if no sync dialog existed at all,
# and the caller's own next assertion then failed against a screen that was
# actually still covered by this dialog.
#
# Fix: wait on the id shared by every phase of this one continuing dialog
# (dialog_cancel_button) instead of one specific phase's text, so a slow
# pull is correctly waited out regardless of which phase it's stuck in.
- extendedWaitUntil:
    notVisible:
      id: "org.commcare.dalvik:id/dialog_cancel_button"
    timeout: 120000
# UPDATE (2026-08-21), confirmed live in CI (run 32475178875, group-a,
# multimedia/lazy_video_05_no_references_media_not_found.yaml, build
# 368045de2cd1b2eaedaf63dae8500a3a5df58a78): the "Bad Server Response"
# retry loop above checked TOO EARLY - at that check, the error hadn't
# rendered yet (the loop reported SKIPPED, i.e. not visible), and the
# dialog_cancel_button wait above also fell through immediately since no
# sync dialog had appeared either. The real key-exchange response arrived
# late enough that "Bad Server Response" only showed up ~17s AFTER this
# subflow had already reported COMPLETED - confirmed via the caller's own
# failure screenshot at that later point, still sitting on LoginActivity
# with "Bad Server Response" now visible. Same transient server-hiccup
# class already documented above, just arriving after this subflow's own
# checks had already passed - so re-check for all three known error texts
# one more time here, late, and retry the login tap if any of them showed
# up after all.
#
# UPDATE (2026-08-27), confirmed live in CI (run 33078641030, single-tag
# prompted_updates dispatch, prompted_updates/varying_prompt_01_update_
# frequency.yaml): recurred a THIRD time, past even this late re-check -
# the failure screenshot showed the device still on LoginActivity with
# "Bad Server Response" visible, but this repeat's own immediate (zero-
# wait) check had already sampled and found nothing visible, same
# SKIPPED-then-arrives-later race as the 2026-08-21 UPDATE above, just a
# beat slower still. Every fix here so far has been "check at one more
# point in time", each eventually beaten by a later-still response - adds
# a real settling pause immediately before sampling, giving an in-flight
# response actual time to render before this check reads the screen,
# instead of relying on catching it via yet another single instantaneous
# sample.
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 5
    while:
      visible:
        text: "(?i)Bad Server Response|Server Error|Couldn.t Reach Server"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          id: "org.commcare.dalvik:id/login_button"
      - extendedWaitUntil:
          notVisible:
            id: "org.commcare.dalvik:id/dialog_cancel_button"
          timeout: 120000
# UPDATE (2026-10-02), confirmed live from 10 days of nightly runs on main
# (all 11 on the SAME commit and CommCare 2.64.0 APK - so external state,
# not a code change). 6 of the 8 Maestro failures in that window - e.g.
# capture_01/capture_02/auto_cc_update_03 in run 36959122212, plus
# 09-22/09-28/10-01 - failed with "Element not found: Start" (or "Sync with
# Server") while the failure screenshot showed the HOME screen dimmed behind
# a still-spinning "Communicating with Server / Updating phone data from
# server." dialog. That run's own Maestro command trace (BrowserStack
# maestro_commands_url) showed this subflow's dialog_cancel_button wait
# above passing in 538ms - because THIS dialog is a different variant with
# NO STOP button. The hierarchy dump attached to the failed tapOn shows its
# real ids: progress_fragment_determinate > progress_dialog_title >
# dialog_title_text ("Communicating with Server"), and main_content_holder >
# progress_bar + progress_dialog_message ("Updating phone data from
# server."). While it is up the home-screen tiles are not in the
# accessibility tree at all, so every caller's next "Start"/"Sync with
# Server" lookup just times out.
#
# This was invisible in passing runs only because callers absorbed it: across
# 68 login call sites measured in two nightly runs, the step immediately
# after this subflow (a tap on / wait for "Start", which takes ~1-2s when the
# tile is already showing) took a median 8.3s (p90 11.4s, max ~26s) - the
# dialog is up at the END of this subflow in most runs, and the caller's own
# short default wait (~17s; 20s in several flows) quietly waits it out. That
# only works while HQ's restore is fast; in a slow window it isn't enough,
# which is exactly every failure above. Earlier fixes patched this one flow
# at a time (e.g. commcare_odk_01/03's 20s "Start" waits); this fixes it once
# for all ~125 call sites.
#
# Fix: wait here until NEITHER dialog variant is on screen - the STOP-button
# variant (dialog_cancel_button) and the no-STOP variant
# (progress_dialog_message), as one regex-alternation id selector (Maestro
# id selectors are regexes; external_app_02 already relies on
# "nav_btn_(next|finish)" the same way). notVisible passes immediately when
# no dialog is showing, so flows that land on an update prompt / recovery
# screen are not slowed. Checked twice with a settle in between: the
# login-screen dialog can finish and the home-screen sync dialog start a
# beat later, and a single check can land in that gap. 180s is generous on
# purpose - a restore genuinely stuck for 3 minutes should fail loudly here
# with a clear cause rather than as a confusing "Start not found" later.
- extendedWaitUntil:
    notVisible:
      id: "org.commcare.dalvik:id/(progress_dialog_message|dialog_cancel_button)"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    notVisible:
      id: "org.commcare.dalvik:id/(progress_dialog_message|dialog_cancel_button)"
    timeout: 180000
#
# UPDATE (2026-10-02, run 36986745866 on kb/harden-login-sync-wait-and-appium-
# session-retry): multimedia/lazy_video_03_download_and_play still failed
# with "Element not found: Start" - the failure hierarchy was the login
# screen showing "Bad Server Response" after every retry above had run out.
# Two things made those retries weaker than they read:
#  1. The "pause" between them is waitForAnimationToEnd with a 3-5s timeout,
#     but that timeout is a MAXIMUM - on a static login screen it returns
#     almost immediately. Measured on BrowserStack with a scratch flow:
#     waitForAnimationToEnd(timeout 15000) returned in well under 14s, while
#     an evalScript busy-wait really held for the requested time. So all the
#     retries above fire within seconds of each other, which is exactly the
#     "hammering a struggling server" the 2026-08-08 note meant to avoid.
#  2. Even at their nominal spacing, ~20s total is short next to a restore
#     that stays slow/erroring for minutes (the shared test1 account).
#
# Fix: a last-resort loop with REAL, escalating pauses (10s, 20s, 30s, 40s,
# 45s, 45s = ~3 min) before each re-tap, then a real 10s hold so a late-
# arriving error is on screen when the loop re-samples. It only runs if one
# of the three known error texts is STILL visible, so healthy logins are not
# slowed. The wait for both progress-dialog variants is repeated inside the
# loop because a successful re-tap starts a fresh restore. Delay is a plain
# Date.now() busy-wait in evalScript (Maestro has no sleep command); output.*
# is used for the counter because bare vars don't survive between evalScripts.
- evalScript: ${ output.loginRetryN = 0 }
- repeat:
    times: 6
    while:
      visible:
        text: "(?i)Bad Server Response|Server Error|Couldn.t Reach Server"
    commands:
      - evalScript: ${ output.loginRetryN = output.loginRetryN + 1; (function(){ var end = Date.now() + Math.min(10000 * output.loginRetryN, 45000); while (Date.now() < end) {} })() }
      - tapOn:
          id: "org.commcare.dalvik:id/login_button"
      - extendedWaitUntil:
          notVisible:
            id: "org.commcare.dalvik:id/(progress_dialog_message|dialog_cancel_button)"
          timeout: 180000
      - evalScript: ${ (function(){ var end = Date.now() + 10000; while (Date.now() < end) {} })() }
