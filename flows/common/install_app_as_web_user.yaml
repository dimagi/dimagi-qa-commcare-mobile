appId: org.commcare.dalvik
---
# Reusable "install a specific named app via HQ web user" subflow. Params:
# APP_NAME (exact display name as it appears in the app list, e.g. "Session
# Expiration Test").
#
# CAVEAT - Maestro's tapOn text matching is a REGEX by default, not a literal
# string match (confirmed against Maestro's own docs: text/id selectors are
# regex unless escaped). If an app's real HQ name contains regex
# metacharacters (e.g. "[Master] Basic Tests" - the brackets form a
# character class), pass a bracket/metacharacter-free SUBSTRING instead
# (e.g. "Basic Tests") rather than the full literal name - tapOn matches
# anywhere in the row's visible text by default, so a plain substring still
# selects the right row without the escaping risk. Learned the hard way:
# every flow originally using the literal "[Master] Basic Tests" here had
# to be corrected to "Basic Tests" for this exact reason.
#
# SECOND CAVEAT, learned from a real BrowserStack "Apps Available for
# Install" screenshot: the qateam domain has SEVERAL apps whose name
# contains "Basic Tests" as a substring ("[KD Copy Master] Basic Tests1",
# "[Master] Basic Tests NS Copy!!", plus the real target "[Master] Basic
# Tests") - a bare substring match is ambiguous between them.
#
# THIRD CAVEAT, learned from a real BrowserStack failure: Maestro's tapOn
# text matching is a FULL match against the element's text, not a
# "contains"/search match, despite the first caveat above's original
# (incorrect) assumption. A bare end-anchored "Basic Tests$" genuinely
# failed to match "[Master] Basic Tests" live ("Element not found: Text
# matching regex: Basic Tests$") - the leading "[Master] " prefix meant the
# regex never matched the WHOLE string. Fixed by prepending a wildcard
# prefix: ".*Basic Tests$" fullmatches "[Master] Basic Tests" (".*" absorbs
# the "[Master] " prefix, "Basic Tests" matches the literal remainder, "$"
# anchors the end) while still correctly excluding "...Basic Tests1" and
# "...Basic Tests NS Copy!!" (neither ends in exactly "Basic Tests"). This
# ".*<substring>$" shape is now this subflow's standard APP_NAME pattern -
# use it for any app name that isn't already known to be the row's ENTIRE
# text.
#
# Same "See Apps for My User" -> web-user-mode -> Get Apps mechanism as
# flows/install/install_08_install_as_web_user.yaml (verified against
# InstallFromListTest.kt's testAppInstall_usingWebWorkerDetails), except
# that flow blindly taps the whole apps_list_view container (fine when the
# domain only surfaces one app to select); this one selects a SPECIFIC row
# by its visible app-name text instead, so it can install any of the
# qateam domain's several QA apps on demand.
#
# Verified against commcare-android source (read-only reference, not modified):
#   InstallFromListActivity.java line 394-408: each row is inflated from
#     R.layout.single_available_app_view with its app_name TextView set to
#     app.getAppName() - i.e. the app's real display name is the row's own
#     visible text, not a synthetic index - and the list is sorted
#     alphabetically by that same name (line 419), so this doesn't depend on
#     row order.
#   InstallFromListActivity.java line 133-141 (setOnItemClickListener):
#     tapping a row immediately finishes this activity with RESULT_OK,
#     carrying the selected app's media profile ref back to the caller - no
#     separate per-row confirm step, same as install_08's single blind tap.
#
# Waits for "More options" rather than tapping it blindly: live BrowserStack
# evidence showed this exact tap (the very first interaction after a cold
# app launch, in both this subflow and install_07/08) failing with "Element
# not found" - most likely CommCareSetupActivity/its toolbar hasn't finished
# rendering yet immediately after launchApp, though CommCareSetupActivity
# extends BaseDrawerActivity (whose shouldShowDrawer() can be true depending
# on device/login state), so a drawer/hamburger icon replacing the standard
# overflow affordance on some devices is also a real possibility this wait
# alone would NOT fix - flag for a screenshot/view-hierarchy check if this
# still fails after the wait.
#
# UPDATE - root cause found via BrowserStack's own commandlogs API (fetched
# the failing assertion's hierarchyRoot dump directly): the screen shown at
# the timeout was the SAMSUNG HOME LAUNCHER (com.sec.android.app.launcher),
# not CommCare at all - org.commcare.dalvik was never brought to the
# foreground. This subflow is invoked via `runFlow` as another flow's very
# FIRST step, and unlike install_07/install_08 (which both open with an
# explicit `- launchApp`), this file had none - Maestro's implicit
# launch-on-appId behavior evidently does not reliably fire in that
# position. Added the explicit launchApp below to match install_07/08.
#
# UPDATE 2 - clearState: true added after a real failure whose embedded
# view-hierarchy dump (not a screenshot - confirmed the screenshot API for
# this build was returning a stale/unrelated image, see the still-open
# caveat in docs/FRAMEWORK.md-equivalent commit history) showed the device
# already sitting on "Apps Available for Install" at the very moment this
# flow's FIRST switch_button wait timed out - i.e. the device had SOME
# app's install-list screen still open from a prior attempt, not a blank
# CommCareSetupActivity. `launchApp` with no clearState (Maestro's default)
# only brings an app back to the foreground - it does NOT reset it to a
# fresh install, so if anything (a Maestro-level retry of this same test,
# or a previous flow in the same chunk/session) had left the app mid
# install-list navigation, plain launchApp would resume exactly there,
# breaking every step that assumes a blank CommCareSetupActivity start.
# clearState guarantees the true fresh-install state this whole framework's
# flows assume. NOTE: flows/mobile_pins/multiple_app_pin_per_app_isolation.yaml
# calls this subflow TWICE (installing two apps side by side) - its second
# call must NOT go through this file (clearState would wipe the first app),
# so it inlines the post-launchApp steps directly instead - see that file's
# own comment for why.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "More options"
    timeout: 20000
- tapOn: "More options"
- tapOn: "See Apps for My User"
# Waits for switch_button rather than tapping it blindly, same reasoning as
# the "More options" wait above: "See Apps for My User" navigates into a
# new activity (InstallFromListActivity), and a real BrowserStack failure
# showed "Element not found: Id matching regex: .../switch_button" here -
# most likely that activity hadn't finished rendering yet immediately after
# the navigating tap.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/switch_button"
    timeout: 15000
- tapOn:
    id: "org.commcare.dalvik:id/switch_button"
- tapOn:
    id: "org.commcare.dalvik:id/edit_email"
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_WEB_USER_EMAIL}"
# UPDATE (2nd correction) - a single hideKeyboard call, exactly where it was
# originally, IS correct here and was never the actual problem: on Android
# a back-press's FIRST effect, when an IME is genuinely showing, is to
# dismiss ONLY the keyboard, not navigate the activity back - that only
# happens on a SECOND back-press once no keyboard remains. The real bug
# (see the UPDATE two comments below) was calling hideKeyboard MULTIPLE
# times in a row after the keyboard was already gone, each one then falling
# through to a real back-navigation. The previous edit here overcorrected by
# removing hideKeyboard entirely and tapping id/feature_prompt instead -
# confirmed via a real BrowserStack screenshot that this does NOT dismiss
# the keyboard at all (tapping a plain, non-focusable TextView doesn't
# reliably steal focus away from an EditText on Android), leaving the
# keyboard covering get_apps_button. Restored the single hideKeyboard calls,
# kept the repeat block removed.
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- inputText: "${HQ_WEB_USER_PASSWORD}"
- hideKeyboard
- tapOn:
    text: "Skip"
    optional: true
# UPDATE - do NOT retry hideKeyboard here (a previous version of this file
# did, following install_07's example): confirmed against Maestro's own
# docs, on Android hideKeyboard ALWAYS sends a back-button press regardless
# of whether a keyboard is showing - calling it AGAIN once the single call
# above has already dismissed the keyboard just navigates the activity back,
# and enough repeats exit the app entirely. Confirmed via a real BrowserStack
# failure whose commandlogs hierarchy dump showed the SAMSUNG HOME LAUNCHER
# on screen at this exact point. A single wait for get_apps_button is enough
# now that the one hideKeyboard call above has dismissed the keyboard.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/get_apps_button"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/apps_list_view"
    timeout: 30000
# FOURTH CAVEAT, learned from a real BrowserStack failure on "Case
# Managements!": the apps_list_view is a SCROLLABLE list (confirmed sorted
# alphabetically per InstallFromListActivity.java line 419), and a bare
# tapOn cannot select an element that's below the fold - it only searches
# the CURRENTLY RENDERED view hierarchy. The failing run's own hierarchyRoot
# dump showed the visible page ending at "Advanced Settings" (last item
# before the status bar) with no "Case Managements!" row present at all -
# every app name that alphabetically sorts past roughly "Advanced Settings"
# (i.e. nearly every APP_NAME used in this repo besides "[Master] Basic
# Tests", which happens to sort near the top) needs a scroll first.
# scrollUntilVisible is a no-op if the target is already on screen, so this
# is safe to run unconditionally for every APP_NAME, including "Basic Tests".
#
# SEVENTH CAVEAT, learned from a real BrowserStack failure on "Session
# Expiration Test": the qateam domain's app list turned out to be much
# longer than earlier caveats assumed (confirmed live - the failing run's
# hierarchyRoot dump showed dozens of unrelated apps spanning "KD Case
# Management" through "Mobile2.47_test4_5" alphabetically, nowhere near "S").
# 20s wasn't enough scroll time to reach a target that sorts late in a list
# this long - raised to 60s.
- scrollUntilVisible:
    element:
      text: "${APP_NAME}"
    direction: DOWN
    timeout: 60000
- tapOn: "${APP_NAME}"
- tapOn:
    id: "org.commcare.dalvik:id/install_app_button"
    retryTapIfNoChange: false
    optional: true
# EIGHTH CAVEAT, learned from a real BrowserStack failure on "Conditional
# Enum in Case List" (and previously misread as a version-mismatch retry
# case for "Case Managements!" too): some apps land on an "Almost there!
# Press the button below to install your app." screen with its own "Start
# Install"/"Start Over" buttons - text-based, not the same id/screen as
# install_app_button above (that tap alone didn't reach it). Optional tap
# so flows whose app skips straight to setup aren't affected.
- tapOn:
    text: "Start Install"
    optional: true
# SIXTH CAVEAT, learned from a real BrowserStack failure on "Case
# Managements!": some apps' published CCZ requires a newer CommCare APK
# version than the "release" build BrowserStack tests against (seen live:
# "The application requires CommCare version 2.64.0. You are currently
# running 2.63.4." with "UPDATE COMMCARE VIA THE PLAY STORE" / "I'LL UPDATE
# LATER" buttons) - a genuine app/APK version drift, not a flow bug. Dismiss
# with "I'LL UPDATE LATER" if it appears so the flow can proceed; this is an
# environmental mismatch worth flagging to a human if the resulting app then
# misbehaves, but blocking every caller of this shared subflow over it would
# be worse.
- tapOn:
    text: "I.LL UPDATE LATER"
    optional: true
# FIFTH CAVEAT, learned from a real BrowserStack failure: this
# extendedWaitUntil used to be a hard (non-optional) assertion, and it timed
# out after the full 60s on 15/16 flows in one build - "Setting Up App" is
# only a transitional loading screen, and evidently doesn't reliably render
# for long enough (or at all, e.g. if BrowserStack's device already has the
# CCZ cached) to be caught by a poll-based wait. The actual thing every
# caller needs is the LOGIN screen that appears once setup finishes, which
# the next wait below already asserts - this one is now optional so a fast
# install doesn't fail the whole flow over a screen that isn't the real
# success criterion.
- extendedWaitUntil:
    visible: "Setting Up App"
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/edit_username"
    timeout: 90000
