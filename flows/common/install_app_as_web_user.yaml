appId: org.commcare.dalvik
---
# Reusable "install a specific named app via HQ web user" subflow. Params:
# APP_NAME (exact display name as it appears in the app list, e.g. "Session
# Expiration Test").
#
# CAVEAT - Maestro's tapOn text matching is a REGEX by default, not a literal
# string match (confirmed against Maestro's own docs: text/id selectors are
# regex unless escaped). If an app's real HQ name contains regex
# metacharacters (e.g. "[Master] Basic Tests" - the brackets form a
# character class), pass a bracket/metacharacter-free SUBSTRING instead
# (e.g. "Basic Tests") rather than the full literal name - tapOn matches
# anywhere in the row's visible text by default, so a plain substring still
# selects the right row without the escaping risk. Learned the hard way:
# every flow originally using the literal "[Master] Basic Tests" here had
# to be corrected to "Basic Tests" for this exact reason.
#
# Same "See Apps for My User" -> web-user-mode -> Get Apps mechanism as
# flows/install/install_08_install_as_web_user.yaml (verified against
# InstallFromListTest.kt's testAppInstall_usingWebWorkerDetails), except
# that flow blindly taps the whole apps_list_view container (fine when the
# domain only surfaces one app to select); this one selects a SPECIFIC row
# by its visible app-name text instead, so it can install any of the
# qateam domain's several QA apps on demand.
#
# Verified against commcare-android source (read-only reference, not modified):
#   InstallFromListActivity.java line 394-408: each row is inflated from
#     R.layout.single_available_app_view with its app_name TextView set to
#     app.getAppName() - i.e. the app's real display name is the row's own
#     visible text, not a synthetic index - and the list is sorted
#     alphabetically by that same name (line 419), so this doesn't depend on
#     row order.
#   InstallFromListActivity.java line 133-141 (setOnItemClickListener):
#     tapping a row immediately finishes this activity with RESULT_OK,
#     carrying the selected app's media profile ref back to the caller - no
#     separate per-row confirm step, same as install_08's single blind tap.
#
# Waits for "More options" rather than tapping it blindly: live BrowserStack
# evidence showed this exact tap (the very first interaction after a cold
# app launch, in both this subflow and install_07/08) failing with "Element
# not found" - most likely CommCareSetupActivity/its toolbar hasn't finished
# rendering yet immediately after launchApp, though CommCareSetupActivity
# extends BaseDrawerActivity (whose shouldShowDrawer() can be true depending
# on device/login state), so a drawer/hamburger icon replacing the standard
# overflow affordance on some devices is also a real possibility this wait
# alone would NOT fix - flag for a screenshot/view-hierarchy check if this
# still fails after the wait.
#
# UPDATE - root cause found via BrowserStack's own commandlogs API (fetched
# the failing assertion's hierarchyRoot dump directly): the screen shown at
# the timeout was the SAMSUNG HOME LAUNCHER (com.sec.android.app.launcher),
# not CommCare at all - org.commcare.dalvik was never brought to the
# foreground. This subflow is invoked via `runFlow` as another flow's very
# FIRST step, and unlike install_07/install_08 (which both open with an
# explicit `- launchApp`), this file had none - Maestro's implicit
# launch-on-appId behavior evidently does not reliably fire in that
# position. Added the explicit launchApp below to match install_07/08.
- launchApp
- extendedWaitUntil:
    visible: "More options"
    timeout: 20000
- tapOn: "More options"
- tapOn: "See Apps for My User"
- tapOn:
    id: "org.commcare.dalvik:id/switch_button"
- tapOn:
    id: "org.commcare.dalvik:id/edit_email"
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_WEB_USER_EMAIL}"
# hideKeyboard BEFORE tapping edit_password (not just after typing into it) -
# live BrowserStack evidence showed the password ended up typed into
# edit_email right after the email text with no separator, meaning the tap
# on edit_password landed on the wrong element/coordinate rather than
# shifting focus - almost certainly the auth_scroll_view (this whole form is
# inside a ScrollView) re-laying-out while the IME is still up, moving
# edit_password's on-screen position between when Maestro reads the view
# hierarchy and when the tap executes. Dismissing the keyboard first lets
# the layout settle before the next tap's coordinates are captured.
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- inputText: "${HQ_WEB_USER_PASSWORD}"
- hideKeyboard
- tapOn:
    text: "Skip"
    optional: true
# install_07_install_as_mobile_user.yaml's header documents hideKeyboard as
# "proven flaky across real runs" for this exact screen - not deterministic,
# so retry it a few times rather than once (NOT paired with a tap each
# time - tapping get_apps_button repeatedly would fire the request multiple
# times) and only tap once the button is actually confirmed visible.
- repeat:
    times: 3
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/get_apps_button"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/apps_list_view"
    timeout: 30000
- tapOn: "${APP_NAME}"
- tapOn:
    id: "org.commcare.dalvik:id/install_app_button"
    retryTapIfNoChange: false
    optional: true
- extendedWaitUntil:
    visible: "Setting Up App"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/edit_username"
    timeout: 90000
