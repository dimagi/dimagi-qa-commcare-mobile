appId: org.commcare.dalvik
---
# Reusable: from the home screen, open FORM_NAME and verify it opens without
# error and (per the sheet's "Update 14/18 - Updated form verification")
# contains "Registration Date" and "Age" questions, then exits without
# saving - lands back on the home screen.
# Params: FORM_NAME - the sheet always calls this "Form A".
#
# GENERIC/BEST-EFFORT CAVEAT: this is POSITION-ASSUMED - it asserts
# "Registration Date" on the form's very first screen and "Age" after exactly
# one Next tap, since the real question order in the pre-provisioned
# "Mobile Updates Test 4/5 Master" QA app could not be verified against any
# source in this repo. If the actual form orders these differently, move the
# two assertVisible calls relative to the nav_btn_next tap accordingly. The
# question wording itself ("Registration Date", "Age") is copied verbatim
# from the sheet's own expected-result text (coverage_matrix.csv Update 14/18
# summaries), not confirmed against the app's actual question labels.
#
# Selectors verified against commcare-android source (read-only reference,
# never modified by this repo) - same citations as
# flows/common/navigate_form_no_errors.yaml:
#   HomeButtons.java (home.start) -> screen_suite_menu.xml
#     (id/screen_suite_menu_list); screen_form_entry.xml +
#     FormNavigationUI.java -> id/nav_btn_next; strings.xml ->
#     quit_form_title="Exit Form?", do_not_save="EXIT WITHOUT SAVING".
- tapOn: "Start"
- tapOn: "${FORM_NAME}"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 5000
- assertVisible:
    text: "(?i).*registration date.*"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- assertVisible:
    text: "(?i).*\\bage\\b.*"
- assertNotVisible:
    text: "(?i).*unexpected error.*"
- assertNotVisible:
    text: "(?i).*commcare will now restart.*"
- back
- tapOn:
    text: "(?i).*exit without saving.*"
    optional: true
- back
- extendedWaitUntil:
    visible:
      text: "Start"
    timeout: 5000
