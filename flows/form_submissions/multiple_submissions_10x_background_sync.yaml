appId: org.commcare.dalvik
tags:
  - form_submissions
  - automatable
---
# Master Mobile Plan (2026) > Form Submissions > "Multiple Submissions" -
# Basic Form Tests -> Basic Form, submit ~10 times in a loop, background the
# app, verify forms sync.
#
# Form structure verified against the real CCZ (read-only reference, not
# committed): resources/qateam - [Master] Basic Tests - v1141.ccz, unzipped
# and inspected -
#   en/app_strings.txt: forms.m0f0=Basic Form.
#   modules-0/forms-0.xml: just two questions - /data/enter_a_name (text,
#     relevant only when "./question-name=2" - effectively always true in
#     practice, not required) and a trailing minimal-appearance
#     Pragma-Form-Descriptor trigger - a genuinely tiny 1-2-screen form,
#     well suited to a submit-10x loop.
#
# BACKGROUNDING (NOT a caveat - fully automatable): Maestro's `pressKey`
# command supports a "home" key value that backgrounds the current
# foreground app WITHOUT stopping its process (confirmed against Maestro's
# published command reference,
# https://docs.maestro.dev/reference/commands-available/presskey) - this
# repo already relies on exactly this mechanism in
# flows/common/login_and_background.yaml (see that file's own BACKGROUNDING
# comment for the full citation). `launchApp` with `stopApp: false`
# afterward brings CommCare back to the foreground without restarting it or
# losing the queued-but-unsent forms, the same pattern
# flows/externalapp_tests/external_app_02_start_commcare_submit_form.yaml
# documents for returning to an already-running CommCare.
#
# SYNC VERIFICATION: the CommCare home screen shows a live "Unsent Forms: N"
# indicator under the Sync button (android_translatable_strings.txt:65,
# home.unsent.forms.indicator="Unsent Forms: ${0}"; wired up in
# app/src/org/commcare/utils/SyncDetailCalculations.java's
# updateUsentFormsUI()) - a real, visible, checkable sync-count indicator,
# not a manual/visual-only judgment call. This flow taps
# "Sync with Server" (android_translatable_strings.txt:64, home.sync) and
# waits for that indicator to read "Unsent Forms: 0". NOTE: since this is a
# QA/BrowserStack environment, whether the sync round-trip actually succeeds
# depends on real network connectivity and a real HQ submission endpoint
# accepting these forms - if the sync itself fails for environmental reasons
# (not a defect in the on-device flow below), the final wait will time out;
# this flow only automates driving the sync action and reading its own
# on-screen result, it cannot guarantee the server side succeeds.
#
# nav_btn_next/nav_btn_finish ids and form.entry.complete.save.success="Form
# successfully completed" (android_translatable_strings.txt:169) verified
# against commcare-android source (read-only reference, never modified),
# same regex-assertion convention as
# flows/recovery_measures/point_release_flow.yaml. Home-screen container id
# org.commcare.dalvik:id/nsv_home_screen per
# flows/common/login_and_background.yaml's own citation.
#
# UPDATE, confirmed live (real BrowserStack failure, reproduced on both the
# main attempt and its --retry-failed re-run - NOT flaky - build
# fcff4c622a197b5e216b810db331791689b8573e): this flow failed on its very
# FIRST nsv_home_screen wait below, immediately after ../common/login.yaml
# returned - i.e. before any submit-loop or backgrounding ever ran, so this
# was NOT a backgrounding-timing issue. The build's own screenshot at the
# timeout showed the device still on a post-login "Communicating with
# Server" / "Contacting server for sync..." data-pull dialog. Root cause
# and fix landed in the SHARED flows/common/login.yaml (see that file's own
# UPDATE comment for the full citation) rather than here, since every flow
# using that subflow was equally exposed and the repo's own convention is
# to keep post-login waits centralized there, not duplicated per caller.
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a
# fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nsv_home_screen"
    timeout: 10000

# Submit the "Basic Form" 10 times in a row.
# UPDATE (4th correction, 2026-08-17): per direct user guidance, restructured
# after watching the build's own recording - a completed "Basic Form"
# submission returns straight to the "Basic Form Tests" module list it was
# launched from (confirmed via the 3rd correction's own hierarchy dump
# below), NOT all the way back to the true home screen. The PRIOR fix
# (back-until-"Start" visible, then re-entering Start -> Basic Form Tests
# EVERY iteration) fought that behavior instead of using it - each
# iteration wasted a full trip back to home and back in just to land on
# the exact same module list it started from, which is why the whole flow
# was taking 15-20 minutes. Navigate into "Basic Form Tests" ONCE, then
# each iteration just re-taps "Basic Form" directly from the list it's
# already sitting on afterward.
#
# Also per direct user request: the submitted text now includes the loop
# iteration number (via assets/increment_loop_counter.js, since Maestro's
# `repeat` has no built-in iteration index) - "Maestro loop submission 7"
# - so the number of loop iterations that actually completed is visible
# in the submitted data itself, not just inferred from the overall
# pass/fail result.
- tapOn: "Start"
- tapOn: "Basic Form Tests"
- repeat:
    times: 10
    commands:
      # UPDATE (8th correction, 2026-08-18), per direct user guidance:
      # dropped the nav_btn_next existence wait that used to sit here -
      # tapOn "Basic Form" already only returns once that tap actually
      # lands, and the very next inputText will simply fail loudly if the
      # form genuinely hasn't loaded yet, same as letting Maestro's own
      # default retry on the tap below handle it rather than paying for a
      # separate up-front check every iteration.
      # UPDATE (10th correction, 2026-08-18), per direct user guidance: both
      # taps below now set waitToSettleTimeoutMs: 0 (a real, documented
      # Maestro tapOn property - https://docs.maestro.dev/reference/commands-available/tapon)
      # to skip Maestro's own post-tap "wait for the screen to settle"
      # delay, since the user wants zero dwell time anywhere in this loop.
      # REAL TRADEOFF, not a free win: this tells Maestro to move on
      # immediately without confirming the UI actually finished
      # transitioning - if a screen is genuinely still loading, the next
      # command could fire too early. Flagged here rather than silently
      # applied; watch for new flakiness this introduces vs. the time it
      # saves.
      - tapOn:
          text: "Basic Form"
          waitToSettleTimeoutMs: 0
      - runScript:
          file: assets/increment_loop_counter.js
      # Per direct user request: just the bare iteration number - shorter
      # to type than a full "Maestro loop submission N" sentence, and
      # every character typed adds real per-iteration time across 10
      # rapid-fire submissions.
      - inputText: "${output.loopCount}"
      # UPDATE (9th correction, 2026-08-18), per direct user guidance/real
      # Android 16 failure: dropped hideKeyboard - nav_btn_next lives in
      # the top toolbar, never covered by an open keyboard, and
      # hideKeyboard falls back to a real back-press once the keyboard's
      # already auto-dismissed (device/OS-dependent timing), popping an
      # unwanted "Exit Form?" dialog instead. Same fix already confirmed
      # live on flows/case_filters/fuzzy_search_01_03.yaml.
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
          waitToSettleTimeoutMs: 0
      # UPDATE (7th correction, 2026-08-17), per direct user guidance: this
      # form's own repeated real-run evidence (2026-08-08 through today)
      # consistently shows it auto-advances past nav_btn_finish before any
      # check for it even runs - every prior fix here (raising the wait
      # timeout, then making it optional, then dropping the wait but
      # keeping the tap) was still spending real per-iteration time on a
      # step that's essentially never needed, confirmed by a user-supplied
      # video showing a real multi-second gap per iteration even with the
      # wait removed (Maestro's own default tap retry still waits before
      # giving up on a target that isn't there). Removed the nav_btn_finish
      # tap entirely - the loop just submits via nav_btn_next and moves on;
      # if a future run shows this form genuinely stopping at an
      # un-auto-advanced finish screen, that's new evidence to act on then,
      # not a risk worth guessing against here.

# Backgrounding below assumes the true home screen, but the loop above
# always ends back on "Basic Form Tests" - back-until-"Start"-visible
# rather than assuming an exact press count (see the file's own git
# history for why a bare single `back` isn't safe to assume here either).
- repeat:
    times: 2
    while:
      notVisible: "Start"
    commands:
      - back

# Background CommCare (Home key) without logging out or killing the app -
# see BACKGROUNDING citation above.
- pressKey: "home"
- launchApp:
    appId: org.commcare.dalvik
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nsv_home_screen"
    timeout: 10000

# Verify forms sync - see SYNC VERIFICATION citation above.
# UPDATE (2nd correction, 2026-08-17): per direct user guidance - this app
# auto-syncs queued forms in the background without needing an explicit
# "Sync with Server" tap (already confirmed live earlier in this same
# engagement: a single submission's own auto-sync showed a real "1 form
# sent to server!" toast with no manual sync action taken). Dropped the
# manual tapOn "Sync with Server" and the "Sync Successful" wait (which
# also raced against BrowserStack's own diagnostic-capture delay, per the
# prior UPDATE) in favor of waiting, from the home screen we're already
# back on, for the auto-sync completion signal.
# UPDATE (3rd correction, 2026-08-17): confirmed live - "10 forms sent to
# server" never appeared within 60s, but the failure hierarchy dump
# showed "You last synced with the server: 16:41:47" on the Sync tile -
# proof the sync genuinely completed. The "N forms sent to server!" toast
# is just as transient as every other toast this session has had to stop
# chasing (Toast.LENGTH_LONG, a few seconds, easily missed) - waiting on
# it directly is racy regardless of exact wording/count. "You last synced
# with the server" itself isn't a safe substitute either - it could
# already be true from an earlier sync (e.g. at login) and wouldn't prove
# THESE 10 forms specifically synced. Instead wait for "Unsent Forms: N"
# (visible right after relaunch, before this sync completes, per
# SyncDetailCalculations.java's own N>0-only rendering cited above) to
# stop being shown - that transition only happens once the count
# genuinely drops to 0.
- extendedWaitUntil:
    notVisible:
      text: "(?i)unsent forms"
    timeout: 60000
# UPDATE (4th correction, 2026-08-17), per direct user request: the above
# only proves the count reached 0, not that it was specifically 10 - add
# back a real, explicit check for the literal "10 forms sent to server"
# text. Placed AFTER the "unsent forms" wait rather than instead of it -
# a real user-supplied recording confirmed this same card_subtext can
# persist on screen (not just a fleeting Toast) once sync completes, so
# checking it right after the count-reached-0 gate (rather than racing it
# from the very start) gives it a real chance to still be showing.
- extendedWaitUntil:
    visible:
      text: "(?i)10 forms sent to server"
    timeout: 30000
- assertNotVisible:
    text: "(?i).*unexpected error.*"
- assertNotVisible:
    text: "(?i).*commcare will now restart.*"
