appId: org.commcare.dalvik
tags:
  - form_submissions
  - partial
---
# Master Mobile Plan (2026) > Form Submissions > "Geoservice 2" - "Auto
# Capture Location". The sheet's actual verification step is "submit any
# form, then go to Submit History > View Form > Raw XML" on CommCareHQ's
# web UI to confirm a location got captured into the submission's metadata -
# that half is a desktop-browser HQ report inspection, out of scope for this
# device-only Maestro harness (same class of gap as every other
# "HQ Submit History ..." row already marked Not automatable elsewhere in
# coverage_matrix.csv, e.g. Multimedia's "Image Resize 27/28", "Media 4").
#
# This flow automates ONLY the ON-DEVICE half - since the location capture
# itself (if the CommCare build/app has "Auto Capture Location" enabled)
# happens transparently as part of any ordinary form submission, with no
# distinct on-screen UI of its own to interact with or assert against; the
# only way to actually confirm the capture succeeded is the HQ-side raw XML
# inspection this flow deliberately does NOT attempt - see
# scripts/verify_submission.py --require-location for that half.
#
# UPDATE (2026-09-15), per direct user instruction: switched the submitted
# form from "Basic Form Tests" > "Basic Form" to "[Master] Basic Tests" >
# "Geoservices" > "Register Case" - reuses the exact same proven navigation
# as flows/case_filters/geoservices_01_register_case.yaml (see that file's
# own header for the full ground-truth citation and the 3 rounds of live
# fixes already baked into the location-capture wait below). IMPORTANT
# DISTINCTION: Register Case's own site_location is an EXPLICIT geopoint
# QUESTION on this specific form (lands in <details>/<n0:case><n0:update>,
# confirmed live via a real raw-XML submission) - a completely different
# mechanism from the "Auto Capture Location (all forms)" row this flow is
# actually testing, which (if enabled) would inject a location into the
# submission's <meta> block regardless of which form is submitted. Register
# Case was picked over a location-question-free form anyway per direct user
# instruction, not because its own question is the thing being verified -
# scripts/verify_submission.py's --require-location check reads the
# metadata-tab location field (sourced from <meta>, not <details>/<case>),
# so it isn't fooled by this form's own real geopoint answer either way.
#
# CONFIRMED LIVE (2026-09-15), strongest evidence yet that "Auto Capture
# Location (all forms)" is genuinely off, not a device/GPS problem: a real
# run against Register Case obtained an ACTUAL GPS fix for its own
# site_location question (site_location="19.1081114 73.0238931 -9.9
# 15.05", a real device location) - yet the submission's <meta> block still
# had no location field at all, and HQ's own Form Metadata tab still read
# the empty "---" placeholder for location. This rules out "the device
# never got a location fix this run" as an alternative explanation - GPS
# demonstrably worked, the automatic all-forms metadata capture still
# didn't fire. Stays Partial/No, held back from CI, pending someone with
# commcare-hq source access tracing which app/domain setting actually
# controls this feature.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000

# Unique site name per run, same mechanism as geoservices_01_register_case.yaml
# (a run-suffix generated on the test-runner side, not device-derived).
- runScript:
    file: assets/generate_run_suffix.js

- tapOn: "Start"
- tapOn: "Geoservices"
- tapOn: "Register Case"
- inputText: "Geoservice 2 Auto Capture Location ${output.runSuffix}"
- tapOn: "Record Location"
- extendedWaitUntil:
    visible: "Location Found!"
    timeout: 65000
- tapOn: "Record Location"
- extendedWaitUntil:
    visible: "(?s).*Latitude.*"
    timeout: 15000
- tapOn: "FINISH"

- assertVisible: "Geoservices"
- assertVisible: "Register Case"
- assertVisible: "Rate Case"
