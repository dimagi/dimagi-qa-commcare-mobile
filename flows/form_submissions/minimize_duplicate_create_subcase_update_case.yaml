appId: org.commcare.dalvik
tags:
  - form_submissions
  - partial
---
# FIXED 2026-08-08: this whole flow was failing every CI build with a
# BROWSERSTACK_TESTSUITE_PARSE_ERROR ("No Tests Ran", no failed_step/video
# ever captured, since Maestro never even started the flow) - reproduced
# locally both live against BrowserStack (run_suite.py, build
# be51920b8e3aee9e4c5fc505b2373585588969ac) and offline via `maestro
# check-syntax flows/form_submissions/minimize_duplicate_create_subcase_update_case.yaml`,
# which pinpointed the exact defect: "Invalid Command Format: tapOn" at the
# two `- tapOn: "Start"` / `- tapOn: "Minimize Duplicates"` steps that had
# `optional: true` written as a FLAT sibling key (`- tapOn: "Start"` then
# `  optional: true` on the next line) instead of Maestro's required nested
# form (`- tapOn: {text: ..., optional: true}`) - every other tapOn+optional
# pair in this same file already used the correct nested form, so this was a
# one-off typo, not a systemic pattern. A flat sibling key IS valid plain
# YAML (it just makes `{tapOn: "Start", optional: true}`), which is exactly
# why `python -c "import yaml..."` reported this file as parsing fine while
# Maestro's own command-schema validation rejected it - plain pyyaml only
# checks YAML syntax, not Maestro's per-command schema. Fixed by nesting
# `optional: true` under `tapOn:` like every other instance in this file.
#
# Master Mobile Plan (2026) > Form Submissions > "Minimize Duplicate" -
# Basic Tests app > Menu "Minimize Duplicates": create a case, submit a
# followup "Create a Sub Case" form, verify the sub case appears under
# "View Case's Sub Case", update the case, verify parent case properties
# update.
#
# PARTIAL: the sheet's last step, "verify parent case properties update",
# needs opening a case-list/case-detail REPORT to visually confirm updated
# property values against expectations - this app's case-list detail
# columns (m3_case_short/m6_case_short in suite.xml) show whatever this app
# was configured to display, which could not be verified against any source
# in this repo (no live device access), so asserting the EXACT updated
# property text on a case-list row is not scripted here and stays a
# documented gap. Everything else reachable on-device (create the case,
# create the sub case, confirm it's selectable under "View Case's Sub
# Case", and actually submit the case-update form) IS automated below.
#
# APP/MENU STRUCTURE - verified against the real CCZ (read-only reference,
# not committed): resources/qateam - [Master] Basic Tests - v1141.ccz,
# unzipped and inspected -
#   en/app_strings.txt: modules.m6=Minimize Duplicates, modules.m7=View
#     Case's Sub Case, modules.m3=Case Tests, forms.m6f0=Close a Case,
#     forms.m6f1=Create a Sub Case, forms.m3f0=Create a Case,
#     forms.m3f1=Update a Case, case_list_form.m6=Create a Case.
#   suite.xml: module m6's menu lists three items (m6-f0 "Close a Case",
#     m6-f1 "Create a Sub Case", m6-case-list "Case List") plus a nested
#     child menu `<menu root="m6" id="m7">` ("View Case's Sub Case"). All of
#     m6-f0/m6-f1/m6-case-list select an open case of type "coverage_basic"
#     (same case type as module m3's "Case Tests" forms - Create/Update/
#     Close a Case all operate on this one shared case type). m3-f0
#     ("Create a Case")'s own <entry><stack> has a conditional
#     `<create if=".../return_to = 'm6' ...">` that jumps straight back into
#     m6 with the newly-created case selected once registered - this is
#     exactly the mechanism behind case_list_form.m6="Create a Case": when
#     m6's own case-selection screen has no open coverage_basic case yet, it
#     offers a "Create a Case" register button that launches this same
#     m3-f0 form and returns to m6 afterward. This flow relies on that
#     "Create a Case" button appearing on first entry into "Create a Sub
#     Case" (m6-f1) on a fresh install (no cases exist yet).
#   modules-3/forms-0.xml ("Create a Case"): required /data/casename (text)
#     and /data/confirm (select1, values confirm/cancel, label "Are you sure
#     you want to create a new case?").
#   modules-6/forms-1.xml ("Create a Sub Case"): required
#     /data/sub_case_name (text); /data/confirm_creation (select1, values
#     confirm/cancel) is NOT required by its own bind but must be answered
#     "confirm" for the sub_case_0 case-create block to become relevant
#     (bind: relevant="/data/confirm_creation = 'confirm'") - otherwise no
#     sub case is actually created.
#   modules-7/forms-0.xml ("Close Case", m7-f0, the ONLY form under "View
#     Case's Sub Case"): selects the parent coverage_basic case, then a
#     sub_case_one filtered to that parent via
#     `[index/parent=.../case_id]` - reaching its case-selection screen and
#     seeing the exact sub-case NAME this flow itself typed in during
#     "Create a Sub Case" IS the concrete, checkable version of "verify the
#     sub case appears" (rather than an unverifiable guess at real case-list
#     column text, since we control the name we typed).
#   modules-3/forms-1.xml ("Update a Case"): the only required field is
#     /data/intval (int) - answered below; every other field pre-fills from
#     the existing case (setvalue ref=.../xforms-ready pulling from
#     instance('casedb')) and is left as-is.
#
# KNOWN-VALUE TEST DATA: this flow types one fixed, distinctive string
# ("MaestroSubCase" for the sub case name) so later screens can assert on
# it by exact text, rather than guessing at real case-list column
# formatting. UPDATE (2026-08-17): the parent case does NOT get a
# controlled name via the real path this flow uses (see the "Create a
# Case + Create a Sub Case" section below) - CommCare auto-generates it,
# so there is no "MaestroBasicCase" to search or select by anywhere in
# this flow; only the sub case's name is ever actually typed.
#
# UNVERIFIED SCREEN-TRANSITION CAVEAT: the exact screen returned to
# immediately after "Create a Case" submits (back at m6's own menu vs.
# straight back into "Create a Sub Case" form entry with the case
# pre-selected) could not be confirmed without live device access - the
# `tapOn: "Create a Sub Case"` step below is marked `optional: true` for
# this reason (a no-op if that menu item isn't the screen currently shown,
# e.g. if the stack redirect already dropped us into the form itself).
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a
# fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Minimize Duplicates"

# --- Create a Case + Create a Sub Case, in one combined step. ---
# UPDATE (2nd correction, 2026-08-17): confirmed live via a user-supplied
# recording that this entire section's assumed structure was wrong - not
# a missing/misordered screen, a genuinely different app behavior.
# Tapping "Minimize Duplicates" does NOT show a 3-item text menu ("Close a
# Case"/"Create a Sub Case"/"Case List") at all - it goes STRAIGHT to
# m6's own case-selection list (the "Minimize Duplicates" screen IS that
# list: a "Name" column of existing coverage_basic cases plus a "CREATE A
# CASE" register button), confirmed via a real screen recording. Tapping
# "CREATE A CASE" from there launches the "Create a Sub Case" form (m6-f1)
# DIRECTLY - registering the parent case AND the sub case in one
# combined form submission, not two separate ones. That form itself is
# exactly two screens (confirmed live): "Enter a name for your sub case:"
# (plain text, blank) then a confirm/cancel radio ("Do you want to create
# the sub case?", Confirm pre-selected) with FINISH already reachable.
# There is no separate parent-case-name field anywhere in this path - the
# parent case gets an auto-generated name CommCare picks itself, not
# something this flow controls, so "MaestroBasicCase" was never actually
# typed anywhere real; only "MaestroSubCase" is a name this flow controls
# and can reliably search/assert on later.
#
# UPDATE (3rd correction, 2026-08-17): confirmed live via the actual
# BrowserStack build video (form-submissions-fix-retry #1) - "CREATE A
# CASE" IS really there, just below the fold: this shared qateam domain
# has accumulated many real coverage_basic cases from repeated past runs,
# and a bare tapOn never scrolls. "CREATE A CASE" is the list's own fixed
# trailing register row (case_list_form), so unlike a specific case name
# search (see geoservices_02_rate_case.yaml's own reasoning for why a
# bigger scrollUntilVisible timeout isn't enough for an unbounded target),
# it's always just however-many-more scrolls past the last real case row -
# scrollUntilVisible handles that regardless of how large the list grows.
#
# UPDATE (4th correction, 2026-08-17): scrollUntilVisible itself then
# failed live ("No visible element found: CREATE A CASE") - the failure
# hierarchy dump showed a case list packed with dozens of "Christy" rows
# (this shared domain's own fuzzy_search_01_03.yaml test data), meaning
# this list has grown large enough that scrolling to the bottom no longer
# reliably finishes inside any bounded attempt. Same
# unbounded-list-defeats-scrolling problem already fixed for
# geoservices_02_rate_case.yaml/conditional_id_mapping's own Test One/Two
# lookups - fixed the same way: this screen is the same EntityListView
# core chrome as the Followup lists (search_action_bar), so filtering to a
# query that matches no real case name leaves "CREATE A CASE" - the list's
# own always-present trailing register row, unaffected by the case-name
# filter - as the only visible row, reachable with no scrolling at all
# regardless of how large the case list grows.
#
# UPDATE (5th correction, 2026-08-17): confirmed live via the actual
# failure hierarchy dump - "CREATE A CASE" genuinely launches "Create a
# Case" (m3-f0: casename text + confirm/cancel radio, "Are you sure you
# want to create a new case?"), exactly as this file's ORIGINAL
# CCZ-sourced header analysis said, NOT the combined "Create a Sub Case"
# form the 2nd/3rd correction UPDATE comments above claimed from a
# misread recording. Reverted to the original two-step design: answer
# "Create a Case" first (this is where "MaestroBasicCase" - the parent
# case name - actually gets typed for real), then separately reach
# "Create a Sub Case" for the sub case. Per the header's own
# UNVERIFIED SCREEN-TRANSITION CAVEAT, exactly what's on screen right
# after "Create a Case" submits (back at a menu vs. straight into "Create
# a Sub Case" with the new case pre-selected) still isn't confirmed, so
# every step below stays optional/defensive rather than assuming one
# specific landing screen.
- tapOn:
    id: "org.commcare.dalvik:id/search_action_bar"
- inputText: "zzz_no_such_case_zzz"
- tapOn:
    text: "CREATE A CASE"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 10000
# UPDATE, confirmed live (2026-08-18, Android 16): dropped hideKeyboard -
# see flows/case_filters/fuzzy_search_01_03.yaml's own UPDATE for the full
# citation of this exact bug (nav_btn_next lives in the top toolbar,
# never covered by an open keyboard; hideKeyboard falls back to a real
# back-press once the keyboard's already auto-dismissed).
- inputText: "MaestroBasicCase"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- tapOn:
    text: "Confirm - Please create this case."
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
    optional: true
- extendedWaitUntil:
    visible: "Minimize Duplicates"
    timeout: 15000

# --- Create a Sub Case (m6-f1), now that a parent case exists. ---
# Defensive/optional throughout - covers landing back on a menu (tap
# "Create a Sub Case", then select the parent case) as well as landing
# straight inside the sub-case form already (both taps below no-op if
# their target isn't on screen, and the nav_btn_next wait is the real,
# non-optional gate confirming we actually reached the form either way).
- tapOn:
    text: "Create a Sub Case"
    optional: true
- tapOn:
    text: "MaestroBasicCase"
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 10000
- inputText: "MaestroSubCase"
# UPDATE (2nd correction, 2026-08-18, Android 16): the hideKeyboard that
# used to sit here (plus a defensive "STAY IN FORM" dismiss for the
# "Exit Form?" dialog it could accidentally trigger) is dropped entirely
# now that the root cause is understood and fixed the same way
# everywhere else in this repo - nav_btn_next lives in the top toolbar,
# never covered by an open keyboard, so hideKeyboard was never actually
# needed here to begin with (see
# flows/case_filters/fuzzy_search_01_03.yaml's own UPDATE for the full
# citation).
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
# UPDATE (2nd correction, 2026-08-17): confirmed live - nav_btn_finish
# never appeared after this, and the failure hierarchy dump showed we'd
# landed BACK on "Enter a name for your sub case:". Guessed this meant
# the confirm/cancel radio ("Do you want to create the sub case?") isn't
# actually pre-selected and added an explicit confirm tap + extra
# nav_btn_next - WRONG per the real BrowserStack recording the user then
# supplied: it shows "Confirm - Please create <name>." genuinely
# pre-selected (filled radio) with FINISH already reachable in the
# toolbar, exactly as this file's ORIGINAL header always said. Reverted
# to the simple name -> next -> finish sequence; the confirm-tap/extra-next
# guess is removed.
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
    optional: true
- extendedWaitUntil:
    visible: "Minimize Duplicates"
    timeout: 15000

# --- Verify the sub case appears under "View Case's Sub Case" (m7). ---
- tapOn: "Start"
- tapOn: "Minimize Duplicates"
- tapOn: "View Case's Sub Case"
- tapOn:
    text: "MaestroBasicCase"
    optional: true
- assertVisible: "MaestroSubCase"
- back
- back

# --- Update the case (Case Tests module -> Update a Case). ---
- tapOn: "Start"
- tapOn: "Case Tests"
- tapOn: "Update a Case"
- tapOn:
    text: "MaestroBasicCase"
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 10000
# UPDATE, confirmed live (2026-08-18, Android 16): dropped both
# hideKeyboard calls below - see this file's own earlier UPDATE for the
# full citation of this exact bug.
- inputText: "Maestro updated text"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
# singleselect, multiselect, phone_number - all optional per
# modules-3/forms-1.xml's binds, skipped.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
# /data/intval - the form's only required field.
- inputText: "99"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
# geodata, dateval, new_data (trailing info trigger) - optional, skipped.
- repeat:
    times: 3
    while:
      visible:
        id: "org.commcare.dalvik:id/nav_btn_next"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- assertVisible:
    text: "(?i).*form.*success.*completed.*"
- assertNotVisible:
    text: "(?i).*unexpected error.*"
- assertNotVisible:
    text: "(?i).*commcare will now restart.*"
