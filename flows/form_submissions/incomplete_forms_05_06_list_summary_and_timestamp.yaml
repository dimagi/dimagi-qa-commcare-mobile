appId: org.commcare.dalvik
tags:
  - form_submissions
  - partial
---
# Master Mobile Plan (2026) > Form Submissions > "Incomplete Forms 5" and "6"
# - the same save-incomplete/resume/submit narrative as
# flows/form_submissions/incomplete_forms_01_03_save_resume_submit.yaml (see
# that file's header for the full source-citation list this one reuses),
# but additionally checking that the "Incomplete Forms" list entry shows a
# form-summary text and a timestamp underneath the form name, not just the
# name itself. Both sheet rows describe the identical extra on-screen check,
# so one file covers both (same convention as pin_01/fuzzy_search_01_03/
# incomplete_forms_01_03 above).
#
# PARTIAL / automates-what's-assertable: IncompleteFormRecordView.java shows
# three pieces of text per row - formrecord_txt_main (form name),
# formrecord_txt_btm (a "dataTitle" summary string), formrecord_txt_right
# (a formatted last-modified timestamp, via
# android.text.format.DateUtils.formatSameDayTime()). This flow asserts
# both formrecord_txt_btm and formrecord_txt_right are VISIBLE (i.e. "a
# summary text + timestamp appears below the entry", exactly what the sheet
# asks to confirm) without asserting their exact live content: the
# timestamp is a moving target (matches this repo's date_widgets convention
# of not hardcoding a moving value - see date_04_05_standard_widget.yaml's
# own comment), and the summary string's real content for THIS specific
# form could not be confirmed from any source in this repo -
# IncompleteFormListAdapter.java populates it from a per-record
# "searchCache" entry whose ultimate source trace (FormMetaIndicatorUtil /
# a form's own "Pragma-Form-Descriptor" trigger, as seen used for case-name
# display in modules-3/forms-0.xml's "Create a Case" form) does NOT exist in
# "Question Types" (modules-0/forms-1.xml has no Pragma-Form-Descriptor
# trigger at all, confirmed by grep), so its rendered value for this form is
# unknown/likely blank-ish rather than a fixed guessable string - asserting
# only that the view IS PRESENT is the honest "automate what's assertable"
# reading of this row, per this task's own instruction.
#
# Verified against commcare-android source (read-only reference, not
# modified) - same citations as incomplete_forms_01_03_save_resume_submit.yaml,
# plus:
#   IncompleteFormRecordView.java setParams(): mLowerTextView (id
#     formrecord_txt_btm) <- dataTitle param; mRightTextView (id
#     formrecord_txt_right) <- DateUtils.formatSameDayTime(timestamp, ...)
#     (or "Never" if timestamp == 0, not applicable here since the record
#     was just saved).
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a
# fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: "test1"
      PASSWORD: "123"
- assertVisible: "Start"

# --- Answer 2 of ~20+ questions, save incomplete. ---
- tapOn: "Start"
- tapOn: "Basic Form Tests"
- tapOn: "Question Types"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- inputText: "MaestroIncompleteText2"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- inputText: "7"
- hideKeyboard
- back
- assertVisible: "Exit Form?"
- tapOn: "SAVE INCOMPLETE"
- assertVisible: "Start"

# --- Incomplete Forms 5/6: list entry shows a summary text + timestamp
# below the form name, not just the name. ---
- tapOn:
    text: "(?i)incomplete.*"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/screen_entity_select_list"
    timeout: 10000
- assertVisible: "Question Types"
- assertVisible:
    id: "org.commcare.dalvik:id/formrecord_txt_btm"
- assertVisible:
    id: "org.commcare.dalvik:id/formrecord_txt_right"

# --- Resume: verify prior answer persisted, then fully submit. ---
- tapOn: "Question Types"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
    optional: true
- assertVisible: "MaestroIncompleteText2"
- repeat:
    while:
      visible:
        id: "org.commcare.dalvik:id/nav_btn_next"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- assertVisible: "Start"
