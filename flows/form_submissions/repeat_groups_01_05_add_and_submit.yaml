appId: org.commcare.dalvik
tags:
  - form_submissions
  - partial
---
# Master Mobile Plan (2026) > Form Submissions > "Repeat Groups 1" through
# "Repeat Groups 5" - Start -> Basic Form Tests -> Repeats: add repeat-group
# iterations via the "Add Group"/"Do Not Add" dialog, page through the rest
# of the form, submit. All five sheet rows walk the same "Repeats" form (the
# sheet doesn't split them across different forms/screens), so one flow file
# covers all five coverage_matrix.csv rows - same one-file-many-rows
# convention as flows/mobile_pins/pin_01_prompt_shown_on_first_login.yaml.
#
# PARTIAL: the sheet's own verification for this section is largely a
# VISUAL judgment call - it describes a progress bar that should visibly
# shorten/lengthen as repeat groups are added/removed (Repeat Groups 1-3),
# turn GREEN, and show "FINISH" text at the end (Repeat Groups 4). Maestro
# can assert that specific TEXT is visible (done below), but has no API to
# inspect a view's rendered length or color, so that visual judgment stays a
# documented gap (same convention as
# flows/menu_badges/menu_badges_03_04_badge_loads.yaml's own PARTIAL
# header). Repeat Groups 3's own "swipe backwards, verify the bar shortens"
# step is a pure navigation round-trip with no effect on the data
# ultimately submitted (you land back where you started), so it's not
# reproduced here either - only the number-question's own "enter, wait,
# replace with 1" interaction (the one non-visual part of that row) is.
# Repeat Groups 5 (Submit History verification on HQ) is out of scope - a
# browser/HQ check, not an on-device Maestro action.
#
# REWRITTEN 2026-08-12 from a real on-device screen recording the user
# captured after this flow failed four straight rounds of live BrowserStack
# verification (builds 0c5c7ec39fb0738e77e630908ebded5a7bc93057,
# e94ccde418f31755816f72db8ef46ad0329c7334,
# 55a789429ba20da1638af77d88cfcd7455514818, plus a defensive-dismiss guess
# that was never confirmed). The recording revealed the ORIGINAL structure
# below was simply wrong about the form's content, not suffering from a
# timing race as every prior round assumed:
#   - The first user-addable repeat is "Repeat_Group_Multimedia", not a
#     plain text+select repeat. Each iteration has FOUR sub-questions in
#     sequence - Image (Take Picture/Choose Image), Audio (Start
#     recording), Video (Record/Choose/Play Video), then a generic "input
#     group" text field - none required, all safely skippable via
#     nav_btn_next (confirmed live: the recording never interacts with any
#     of the capture buttons, just advances).
#   - The text-input + "Choose an option: One/Two" pair this file used to
#     put inside that first repeat actually belongs to a SEPARATE, later,
#     fixed-count (not user-addable) "Fixed Repeat Group" section that
#     always runs exactly 3 times with no Add/Do Not Add dialog at all.
#   - This explains the previously mysterious "Exit Form?" dialog stealing
#     every nav_btn_next tap right after `hideKeyboard`: this flow's old
#     code was typing text and dismissing a keyboard on what is actually an
#     Image/Audio/Video capture screen with NO text field and thus no
#     keyboard open - `hideKeyboard` appears to fall back to a hardware
#     back-key press when there's no keyboard to dismiss, and pressing back
#     mid-form is exactly what opens "Exit Form?". Root cause confirmed via
#     recording, not just inferred.
#   - Past the two repeats, the real form continues into a numeric question
#     ("Enter a number here, then wait a couple seconds. Then, replace it
#     with '1' and proceed." - reproduced below via eraseText, matching
#     Repeat Groups 3's own literal instruction), a repeat-count-of-1 driven
#     by that number, a "This is a repeat" text field, and finally a
#     cascading county/city multi-select before FINISH.
#
# This form's nav_btn_next/nav_btn_finish ids back the same top-progress-bar
# chevron on every single-question screen in this form (confirmed live -
# there is no separate bottom nav button here, unlike
# flows/form_submissions/question_types_01_03_answer_and_submit.yaml's
# form), and choice_dialog_panel_2/3 are the same fixed,
# content-independent "Add.../Do Not Add" ids already used elsewhere in
# this file's own history and in
# flows/mobile_pins/setup_03_enable_developer_options.yaml's dialog.
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a
# fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Basic Form Tests"
- tapOn: "Repeats"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 10000
# new_intro trigger -> lands on the empty repeat's "Add Group" prompt.
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# === Repeat Groups 1: add Repeat_Group_Multimedia twice ===
# UPDATE (confirmed live 2026-08-12, 3rd BrowserStack round, build
# dd86855a64ce9459a850883a4388389f3efbeca1): a 2nd-round guess that each
# iteration was only 3 sub-questions (Image/Audio/Video) was wrong - the
# failure screenshot showed iteration 1 still sitting on its 4th question
# ("input group", keyboard open) when the flow tried to tap
# choice_dialog_panel_2 for the 2nd add. Reverted to 4 taps/iteration
# (matching the original recording-based read). Also confirmed live
# (previous round): after the 3rd prompt's "Do Not Add", a SECOND, separate
# "Do Not Add" prompt immediately follows - both are required to fully
# leave this repeat.
# The 4th sub-question ("input group") auto-focuses a text field and opens
# the keyboard (confirmed live via its own failure screenshot) - CommCare's
# adjustResize layout can squeeze the top action bar (where nav_btn_next
# lives here) out of reach while that keyboard is up, so hideKeyboard is
# called ONLY here, right before that specific tap, where a keyboard is
# actually guaranteed open. (Calling it on the prior Image/Audio/Video
# taps, where no keyboard is ever open, is exactly what caused the
# "Exit Form?" mis-tap bug this whole rewrite fixed - hideKeyboard appears
# to fall back to a hardware back-press when there's no keyboard to
# dismiss.)
# --- Iteration 1: Image / Audio / Video / input group. ---
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_2"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# --- Iteration 2: same four sub-questions. ---
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_2"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# === Repeat Groups 2: on the 3rd prompt, Do Not Add - twice. ===
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_3"
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_3"
    optional: true

# "You should see three repeat groups with a fixed count." info trigger.
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# === Fixed Repeat Group - always exactly 3 iterations, no Add dialog. ===
# Each iteration: an optional free-text question (skipped on iteration 1,
# labelled "Enter anything here for repeat N" on iterations 2-3), Full
# Address, Street, Zip Code (all optional text, skipped), then a required-
# feeling "Choose an option: One/Two" select answered for real to avoid
# risking the "not enough repeats" validation seen live further down.
#
# UPDATE (confirmed live 2026-08-12, build
# fb871028871052e25245e8b4755cbe18b9c04d07): a blind fixed count of
# nav_btn_next taps per iteration desynced, because iteration 1 has ONE
# FEWER leading question than iterations 2-3 (no "Enter anything..." text
# field on the very first iteration) - the whole sequence shifted and only
# 1 of 3 real Fixed Repeat Group iterations completed before the "not
# enough repeats" hard validation trap further down blocked all progress.
# Switched to looping nav_btn_next until "Choose an option:" itself is
# visible - resilient to however many optional questions precede it on a
# given iteration - matching the generic-navigate-until-target convention
# already used in flows/multimedia/image_resize_25_photo_taken.yaml and
# image_resize_26_photo_chosen.yaml.
- repeat:
    times: 3
    commands:
      - repeat:
          times: 6
          while:
            notVisible: "Choose an option:"
          commands:
            - tapOn:
                id: "org.commcare.dalvik:id/nav_btn_next"
      - tapOn: "One"
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"

# UPDATE (confirmed live in the recording): a "You have not created enough
# repeats. Please go back and create more." validation trigger can appear
# here - defensively acknowledge it (its own "OK. Please continue."
# checkbox) and advance if it shows, otherwise this is a silent no-op.
- tapOn:
    text: "OK. Please continue."
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
    optional: true

# === Repeat Groups 3: numeric question - enter a number, wait, replace
# with "1", proceed (the one non-visual part of this row - see header). ===
- inputText: "6"
- hideKeyboard
- extendedWaitUntil:
    notVisible: "___maestro_fixed_pause_sentinel___"
    timeout: 2500
- eraseText
- inputText: "1"
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# UPDATE (confirmed live 2026-08-12, build
# 03082c405496d292052629fca7caad4ef922013a): the "not enough repeats" trap
# and the "Add a new Outer Repeat?" dialog (see below) both sit behind this
# exact nav_btn_next tap, and in THIS order - dismissing the trap first is
# what actually reveals the Outer Repeat dialog underneath it. The reverse
# order (Outer Repeat dialog checked first) silently no-ops both optional
# taps and fails one step later. Order matters here.
- tapOn:
    text: "OK. Please continue."
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
    optional: true

# UPDATE (confirmed live 2026-08-12, build
# 86ed211399ff353f9990883eba0f1c8fe0962deb): the number entered above
# drives a THIRD user-addable repeat, "Outer Repeat" - not an automatic
# count-driven repeat as the question's own text implies. It shows the
# same "Add a new Outer Repeat?" dialog convention as the earlier repeats
# in this form. Since "1" was entered, exactly one Add is needed; the
# second (immediately following) prompt gets Do Not Add.
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_2"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_3"
    optional: true

# UPDATE (confirmed live 2026-08-12, build
# e6cf61d52529ff51d3d0b042b45082999e1009de): the "Outer Repeat" driven by
# the number entered above turned out to ALSO contain its own nested
# "Inner Repeat" ("Outer Repeat (1) > Inner Repeat (2)", a text field
# "This question is inside the inner repeat.") - already 2 iterations deep
# by the time this was discovered, with its own keyboard-open state and
# presumably its own Add/Do Not Add cycle. Enumerating every dialog this
# form can produce one live failure at a time has hit diminishing returns.
# Replaced the rest of this section with a generic recovery loop: on each
# pass, dismiss the "not enough repeats" trap if present, dismiss any
# Add/Do Not Add dialog with Do Not Add (stop growing repeats - only the
# earlier, deliberately-counted ones should exist), then tap nav_btn_next -
# repeating until the county multi-select ("Suffolk") is reached. This
# trades precise step-by-step documentation for resilience against however
# many more nested repeats or validation traps this form still has past
# this point. Deliberately does NOT call hideKeyboard here (unlike the
# Repeat_Group_Multimedia section above, where it's called only right
# before the one tap known to have a keyboard open) - blindly calling it
# on every pass of a generic loop like this one, including on screens with
# no keyboard open at all, is exactly the mistake that caused the
# "Exit Form?" mis-tap bug this whole rewrite fixed in the first place.
- repeat:
    times: 15
    while:
      notVisible: "Suffolk"
    commands:
      - tapOn:
          text: "OK. Please continue."
          optional: true
      - tapOn:
          id: "org.commcare.dalvik:id/choice_dialog_panel_3"
          optional: true
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
          optional: true

# County multi-select - "De-select exactly one of the options below, and
# remember which options remain checked" (Suffolk/Middlesex/Essex, all
# checked by default).
- tapOn: "Essex"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# === Repeat Groups 4: cascading city multi-select, then FINISH. ===
- tapOn:
    text: "Boston"
    optional: true
- assertVisible: "FINISH"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- assertVisible:
    text: "(?i).*form.*success.*completed.*"
- assertNotVisible:
    text: "(?i).*unexpected error.*"
- assertNotVisible:
    text: "(?i).*commcare will now restart.*"
