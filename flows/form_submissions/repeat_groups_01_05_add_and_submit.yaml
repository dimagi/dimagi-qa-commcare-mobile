appId: org.commcare.dalvik
tags:
  - form_submissions
  - partial
---
# Master Mobile Plan (2026) > Form Submissions > "Repeat Groups 1" through
# "Repeat Groups 5" - Start -> Basic Form Tests -> Repeats: add repeat-group
# iterations via the "Add Group"/"Do Not Add" dialog, page through the rest
# of the form, submit. All five sheet rows walk the same "Repeats" form (the
# sheet doesn't split them across different forms/screens), so one flow file
# covers all five coverage_matrix.csv rows - same one-file-many-rows
# convention as flows/mobile_pins/pin_01_prompt_shown_on_first_login.yaml.
#
# PARTIAL: the sheet's own verification for this section is largely a
# VISUAL judgment call - it describes a progress bar that should visibly
# shorten/lengthen as repeat groups are added/removed, turn GREEN, and show
# "FINISH" text at the end. Maestro can assert that specific TEXT is visible
# (done below: this flow asserts "FINISH" appears on nav_btn_finish once the
# form's last screen is reached), but it has no API to inspect a view's
# rendered length or color - judging whether a progress bar visually
# shortened/lengthened or turned the correct shade of green is a human visual
# check with no text/accessibility-tree equivalent, so that specific part of
# "Repeat Groups 1-5" is NOT automated here and stays a documented gap
# (same convention as flows/menu_badges/menu_badges_03_04_badge_loads.yaml's
# own PARTIAL header, which flags an analogous "legible/not fuzzy" visual-only
# check as out of scope while still automating everything else on that
# screen). Everything ELSE checkable - creating repeat-group iterations via
# the real "Add Group"/"Do Not Add" dialog buttons, and submitting - is fully
# automated below.
#
# Form structure verified against the real CCZ (read-only reference, not
# committed): resources/qateam - [Master] Basic Tests - v1141.ccz, unzipped
# and inspected -
#   en/app_strings.txt: forms.m0f2=Repeats.
#   modules-0/forms-2.xml: the real question order/appearances/binds. Its
#     intro text literally instructs "Please create two, and enter values
#     for them" for the first (user-addable) repeat group
#     (/data/question1, itext id new_intro-label) - this flow creates
#     exactly two.
#   /data/question1/question3 (bind required="true()") and
#     /data/question1/question2 (bind required="true()", a select1 with
#     choices One/Two) are the only required fields inside that
#     user-addable repeat - answered below for both iterations so
#     navigation isn't blocked by a validation error. Every other question
#     in the form (the fixed-count 3x repeat, the nested 2x3 outer/inner
#     repeat, num_repeats and its own repeat, the County/City lookup
#     selects) has NO required bind, so those sections are paged through
#     via a generic next-loop without answering, per this repo's
#     established generic-navigation convention (see
#     flows/common/navigate_form_no_errors.yaml).
#
# UPDATE, confirmed live (2026-08-08, real BrowserStack failure + user
# screenshot): the ORIGINAL text-based taps below ("Add Group" / "(?i)do not
# add.*") were wrong - the real on-screen button text is NOT the generic
# repeat.dialog.add/leave/exit localization strings this header originally
# (incorrectly) cited. FormEntryActivityUIController.createRepeatDialog()
# builds addAnotherText from `repeatCaptionPrompt.getRepeatText(...)`, which
# pulls the FORM's OWN itext binding for that specific question (e.g. "Add a
# new This is a repeat group: Add a few iterations and enter a number each
# time.?" or "Add a new Repeat_Group_Multimedia?" on a different form) - a
# per-question, form-authored string, not a fixed app string at all.
# Matching on literal text here was never going to work reliably.
#
# Fix: HorizontalPaneledChoiceDialog.setupThreePanelView() (read-only
# reference, verified against source) wires this 3-button dialog to FIXED,
# content-independent ids regardless of the dynamic caption text:
#   R.id.choice_dialog_panel_1 = "Go Back"
#   R.id.choice_dialog_panel_2 = "Add Another" (repeat.dialog.add/add-empty)
#   R.id.choice_dialog_panel_3 = "Skip" (repeat.dialog.leave/exit)
# Tapping by these ids works regardless of which form or which specific
# repeat-group label is showing.
#
# form.entry.finish.button="FINISH"
# (android_translatable_strings.txt:173) backs the literal "FINISH" text
# assertion. nav_btn_next/nav_btn_finish ids and
# form.entry.complete.save.success="Form successfully completed"
# (android_translatable_strings.txt:169) verified the same way, same
# regex-assertion convention as
# flows/recovery_measures/point_release_flow.yaml.
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a
# fresh BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
#
# UPDATE, confirmed live 2026-08-11 (CI run 31476507436, build
# 0c5c7ec39fb0738e77e630908ebded5a7bc93057): the very first "Tap on
# nav_btn_next" (below) failed immediately after the preceding
# extendedWaitUntil had already confirmed it visible - the failure
# screenshot showed the app's own "Exit Form?" dialog open over this same
# intro screen instead. This form's entry transition (list item tap ->
# form-entry screen sliding in) was still mid-animation when the tap's
# coordinates were captured, so the tap landed on the still-shifting "X"
# cancel icon instead of nav_btn_next. Added waitForAnimationToEnd to let
# the transition settle before tapping.
#
# UPDATE (2nd correction), confirmed live 2026-08-11 (build
# e94ccde418f31755816f72db8ef46ad0329c7334): fixing that first tap exposed
# the SAME race one step later - the tap right after `hideKeyboard` (once
# "Repeat one"/"Repeat two" is typed) failed the exact same way, for the
# exact same reason (the keyboard-dismiss layout transition hadn't settled
# either). Added waitForAnimationToEnd after both hideKeyboard calls below
# too.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- tapOn: "Start"
- tapOn: "Basic Form Tests"
- tapOn: "Repeats"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_next"
    timeout: 10000
- waitForAnimationToEnd
# new_intro trigger -> lands on the empty repeat's "Add Group" prompt.
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# --- Repeat iteration 1 ---
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_2"
- inputText: "Repeat one"
- hideKeyboard
- waitForAnimationToEnd
# UPDATE (3rd correction): waitForAnimationToEnd alone didn't fix it - the
# failure recurred with the SAME "Exit Form?" mis-tap even after it
# reported completed, suggesting real device lag outlasting Maestro's own
# animation-settled signal (this session ran 30+ consecutive BrowserStack
# builds). Added a fixed 2s buffer on top, via the extendedWaitUntil-on-an-
# impossible-condition idiom (Maestro has no plain "wait N seconds"
# command - check-syntax rejects a bare `wait:` block).
- extendedWaitUntil:
    notVisible: "___maestro_fixed_pause_sentinel___"
    timeout: 2000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
# full_address / street / zip_code - optional, skipped.
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
# required select1 question2 (label "Choose an option:", choices One/Two).
- tapOn: "One"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# --- Repeat iteration 2 ---
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_2"
- inputText: "Repeat two"
- hideKeyboard
- waitForAnimationToEnd
# UPDATE (3rd correction): waitForAnimationToEnd alone didn't fix it - the
# failure recurred with the SAME "Exit Form?" mis-tap even after it
# reported completed, suggesting real device lag outlasting Maestro's own
# animation-settled signal (this session ran 30+ consecutive BrowserStack
# builds). Added a fixed 2s buffer on top, via the extendedWaitUntil-on-an-
# impossible-condition idiom (Maestro has no plain "wait N seconds"
# command - check-syntax rejects a bare `wait:` block).
- extendedWaitUntil:
    notVisible: "___maestro_fixed_pause_sentinel___"
    timeout: 2000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- tapOn: "Two"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# Stop at exactly two iterations - panel_3 is the "Skip" choice regardless
# of whether its dynamic label reads "Do Not Add" or "Do Not Add. I'm
# Finished." (that variance is exactly why this uses the fixed id, not text).
- tapOn:
    id: "org.commcare.dalvik:id/choice_dialog_panel_3"

# Rest of the form (fixed 3x repeat, "toofew"/"repeat_total" info triggers,
# nested 2x3 outer/inner repeat, num_repeats + its own repeat, intro_label,
# County/City lookup selects) - all optional per header CAVEAT, paged
# through generically. times: 40 is a generous upper bound; the `while`
# condition stops the loop as soon as nav_btn_next disappears (i.e. the last
# screen, with nav_btn_finish instead, is reached).
# UPDATE, confirmed live (2026-08-08, real BrowserStack failure + user
# screenshot, on question_types_01_03's identical dialog): the rest of this
# form has its OWN additional repeat groups (nested outer/inner repeat,
# num_repeats + its own repeat) beyond the one already handled above - each
# can show the SAME "Add a new...?" dialog, and it doesn't only appear at a
# single predictable point. Defensively dismiss it (Do Not Add) before every
# generic Next tap, not just the one explicit handling point above.
- repeat:
    times: 40
    while:
      visible:
        id: "org.commcare.dalvik:id/nav_btn_next"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/choice_dialog_panel_3"
          optional: true
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"

# PARTIAL boundary: this confirms the literal "FINISH" text is present (the
# one sub-part of the progress-bar/FINISH-state check Maestro CAN verify -
# see header comment) - it does NOT judge the progress bar's color/length.
- assertVisible: "FINISH"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- assertVisible:
    text: "(?i).*form.*success.*completed.*"
- assertNotVisible:
    text: "(?i).*unexpected error.*"
- assertNotVisible:
    text: "(?i).*commcare will now restart.*"
