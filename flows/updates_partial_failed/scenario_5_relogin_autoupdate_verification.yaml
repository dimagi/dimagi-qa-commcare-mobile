appId: org.commcare.dalvik
tags:
  - updates_partial_failed
  - partial
---
# Master Mobile Plan (2026) > Updates (partial and failed) > Test Case ID: 5.
# App under test: "Mobile Updates Test 4/5 Master" (per the tab's own "Apps"
# note), same master/linked-app pair as Test Case ID 4.
#
# Preceding rows explicitly OUT of scope for this flow, per this task's scope
# and coverage_matrix.csv:
#   - Setup (Partial): "Install old CommCare version - 2.45" - needs a
#     specific historical APK provisioned externally.
#   - Update 16 (Not automatable): "Stage update to V6, interrupt with
#     CommCare update mid-flow" - timing-critical interleaved binary update,
#     same category as Test Case 1/2's Setup rows.
#     CONFIRMED 2026-08-18 (not just assumed): see
#     flows/updates_partial_failed/scenario_1_staged_update_auto_apply.yaml's
#     own "REMAINING GAP" note for the full citation - neither Maestro nor
#     BrowserStack App Automate/App Live expose any API to install a
#     new/updated APK mid-session, which is exactly what this row would
#     require.
#     UPDATE (2026-08-19): see that same file's 2026-08-19 UPDATE - BrowserStack's
#     Appium sessions (not Maestro) do support this via midSessionInstallApps/
#     `mobile: installApp`. scripts/appium_scenarios.py's run_scenario_5() now
#     exercises Update 16's real precondition (stage the V6 CCZ update,
#     interrupt with a binary swap mid-stream) end-to-end as CI's "group-d"
#     job, in addition to (not instead of) this Maestro flow's own
#     verification-only coverage below.
#
# This flow covers the remaining "Automatable" steps that follow those:
#   - Installation 1: install the linked app pinned to "Version V2".
#   - Update 17: re-login.
#   - "Update verification": confirm the app auto-updated to "Version V6".
#   - Update 18: Form A verification (Registration Date + Age questions).
#   - Update 19: Form B verification (photo-upload question).
#
# UPDATE (2026-08-21), per direct user correction with the real app link
# (https://www.commcarehq.org/a/let-sdoit/apps/view/07f49277d22d6c77ecc2df0489a80aae/):
# this flow's own HQ_MOBILE_WORKER_USERNAME/HQ_DOMAIN vars point at qateam,
# but this app lives under "let-sdoit" - the SAME domain mismatch already
# found and fixed for scenario_4's own copy of this install step, never
# applied here until now. Also, "See Apps for My User" always installs
# whatever's the app's CURRENT top release (confirmed live: that's already
# "Version V6"), not "Version V2" specifically, which would skip the
# update-verification steps below entirely. Switched to installing by
# app-code, pinned to "Version V2" (see scripts/app_registry.py's
# LINKED_APP_TEST45 entry for the full citation, including why no extra HQ
# step is needed for "Version V6" - it's already the current top release)
# - bootstraps a fresh CommCare install AND lands on the right version in
# one step, same pattern as every other scenario fixed today.
#
# GENERIC/BEST-EFFORT: see flows/common/verify_form_a_questions.yaml and
# flows/common/verify_form_b_photo_question.yaml for the caveats on
# "Form A"/"Form B" naming and question order/wording in this pre-provisioned
# QA app.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_LINKED_APP_TEST45}

# --- Update 17: re-login. ---
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000

# --- "Update verification": update to V6 and confirm it completed. ---
# UPDATE (2026-08-21), confirmed live via a real failure (Form A's "Age"
# question missing - it's only "ADDED in Form A" as of "Version V6" per
# that build's own comment, see scripts/app_registry.py's
# LINKED_APP_TEST45 citation): this step never actually triggered an
# update at all, relying on Update 16's staged-CCZ auto-apply, which only
# the Appium-orchestrated path (scripts/appium_scenarios.py's
# run_scenario_5) genuinely stages - the device was staying on "Version
# V2" (the pinned install) forever. Same "Update App" menu proxy every
# other Maestro-only scenario uses instead of the out-of-scope
# interrupted-staging precondition.
- runFlow: ../common/update_app_via_menu.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
# UPDATE (2026-08-19), per direct user instruction: dropped EXPECTED_VERSION
# - see check_app_version_via_about.yaml's own UPDATE comment for the full
# citation (HQ build version drift, not a real regression signal).
- runFlow: ../common/check_app_version_via_about.yaml

# --- Update 18: Form A verification (contains Registration Date + Age). ---
- runFlow:
    file: ../common/verify_form_a_questions.yaml
    env:
      FORM_NAME: "Form A"

# --- Update 19: Form B verification (contains photo-upload question). ---
- runFlow:
    file: ../common/verify_form_b_photo_question.yaml
    env:
      FORM_NAME: "Form B"
