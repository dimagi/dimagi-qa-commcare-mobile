appId: org.commcare.dalvik
tags:
  - recovery_measures
  - partial
---
# Master Mobile Plan (2026) > Recovery Measures > Recovery: Reinstall and
# Update App (Reinstall/Update 1, 5, 6, 9, 10 - the on-device portions).
#
# UNVERIFIED TEXT WARNING: unlike most other flows in this repo, the
# "needs to be reinstalled" message and the "Reinstall Using CCZ" / "Online
# Install" button labels are NOT found anywhere in
# app/assets/locales/android_translatable_strings.txt - the Recovery Measures
# feature is configured per-app on the HQ recovery page, so this message text
# may be admin-configurable rather than a fixed app string. The assertions
# below use case-insensitive regex on the sheet's literal wording as a
# best-effort match; confirm against your actual QA recovery-page config and
# tighten these once verified.
#
# Run hq_setup/recovery_measures/reinstall_update_app_flow.json's HQ action
# (mark Test Two released) BETWEEN the two halves of this flow, i.e. split
# this into two Maestro runs in practice, or extend run_suite.py to pause here.
# UPDATE, confirmed live (run 31276111657): this flow's very first step
# used to be a bare `runFlow: ../common/login.yaml` with no app ever
# installed first - it assumed some "Test One"/"Test Two"/"Test Three" app
# was already on the device from an earlier, undocumented step. That's
# never true when this flow runs on its own (this repo's "each flow
# runnable in isolation" convention, docs/FRAMEWORK.md), so it failed
# outright stuck on the pre-install "Welcome to CommCare!" screen -
# `login.yaml` could never find edit_username there.
# RESOLVED (2026-08-09): per Master Mobile Plan (2026) > Recovery: Reinstall
# and Update App > Setup 1's own linked HQ Releases URL (user-supplied):
# https://www.commcarehq.org/a/qateam/apps/view/c49c34a1d74297ecb6ecef7a7c5d3f88/releases/
# "Test One"/"Test Two"/"Test Three" are this ONE app's own sequential
# release labels (per that row's own summary: "This will become the new
# Test One... repeat for version two and three"), not separate apps - see
# scripts/app_registry.py's RECOVERY_MEASURES entry. Installing its current
# build here is enough to reach the login screen this flow actually needs.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_RECOVERY_MEASURES}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# Reinstall/Update 1 - pre-update sanity: no forced update on Test One.
# UPDATE, confirmed live (run 31327848567): this bare `assertNotVisible`
# ALWAYS fails - the failure screenshot showed a completely normal home
# screen (Start/Sync with Server/Log out), but the app's own display name
# is literally "Recovery: Reinstall and Update App", always shown in the
# toolbar - the bare substring "reinstall" matches that title on every
# screen in this app, forced-dialog or not, so this assertion could never
# have passed regardless of actual state. Tightened to require the kind of
# forced-action phrasing a real dialog would use ("needs to be
# reinstalled"/"must be reinstalled") that the app's own title doesn't
# happen to contain - still a best-effort guess per this file's own
# UNVERIFIED TEXT WARNING above, since the real message was never
# confirmed, but no longer guaranteed to fail unconditionally.
- assertNotVisible:
    text: "(?i).*(needs? to be|must be) reinstalled.*"
- assertNotVisible:
    text: "(?i).*update.*required.*"
# --- HQ pre-step runs here in a real execution: mark Test Two released ---
- runFlow: ../common/update_app_via_menu.yaml
- runFlow: ../common/logout.yaml
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# Reinstall/Update 5 - reinstall-needed message should now appear.
- assertVisible:
    text: "(?i).*reinstall.*"
- assertVisible:
    text: "(?i).*Reinstall.*CCZ.*"
- assertVisible:
    text: "(?i).*Online.*"
# Reinstall/Update 6 - reinstall via CCZ, expect auto-logout afterward.
- tapOn:
    text: "(?i).*Reinstall.*CCZ.*"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/edit_username"
    timeout: 30000
