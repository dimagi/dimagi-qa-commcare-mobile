appId: org.commcare.dalvik
tags:
  - recovery_measures
  - automatable
---
# Master Mobile Plan (2026) > Recovery Measures > Recovery: Reinstall and
# Update App > "Reinstall and update 3" - "Return to mobile, update CommCare
# to Test Two". Written as its own standalone flow file rather than an
# extension of reinstall_update_app_flow.yaml (that file already covers
# Reinstall/Update 1, 5, 6 and is described as an existing template - keeping
# it untouched avoids colliding with anything already built around it) - this
# flow is the natural bridge step between it and
# hq_setup/recovery_measures/reinstall_update_2_mark_test_two.json /
# reinstall_update_4_mark_test_three.json.
#
# ORDER OF OPERATIONS for a real run of this section:
#   1. reinstall_update_app_flow.yaml's "Reinstall/Update 1" portion (login,
#      assert no forced update on Test One)
#   2. hq_setup/recovery_measures/reinstall_update_2_mark_test_two.json
#      (mark Test Two released, cut Test Three in-test)
#   3. THIS FLOW ("Reinstall and update 3" - update to Test Two)
#   4. hq_setup/recovery_measures/reinstall_update_4_mark_test_three.json
#      (mark Test Three released)
#   5. reinstall_update_app_flow.yaml's "Reinstall/Update 5, 6" portion
#      (assert reinstall message, tap "Reinstall Using CCZ")
#
# Reuses flows/common/update_app_via_menu.yaml verbatim (same subflow
# reinstall_update_app_flow.yaml itself uses to move Test One -> Test Two) -
# see that file's header for its own selector/string citations
# (home.menu.update = "Update App", ccz.update.available.title, etc., all
# from android_translatable_strings.txt). Since AppUtils.notOnLatestAppVersion()
# is what a normal CCZ-update banner reacts to (MEASURE_TYPE_APP_UPDATE's own
# code path, distinct from the reinstall chooser) and Test Two was just
# marked released in the HQ pre-step above, "Update App" from the overflow
# menu is expected to offer the CCZ update to Test Two here in the ordinary
# (non-recovery-measure) way.
# UPDATE, confirmed live (run 31276111657): this flow's very first step
# used to be a bare `runFlow: ../common/login.yaml` with no app ever
# installed first - it assumed some "Test One"/"Test Two"/"Test Three" app
# was already on the device from an earlier, undocumented step. That's
# never true when this flow runs on its own (this repo's "each flow
# runnable in isolation" convention, docs/FRAMEWORK.md), so it failed
# outright stuck on the pre-install "Welcome to CommCare!" screen -
# `login.yaml` could never find edit_username there.
# RESOLVED (2026-08-09): per Master Mobile Plan (2026) > Recovery: Reinstall
# and Update App > Setup 1's own linked HQ Releases URL (user-supplied):
# https://www.commcarehq.org/a/qateam/apps/view/c49c34a1d74297ecb6ecef7a7c5d3f88/releases/
# "Test One"/"Test Two"/"Test Three" are this ONE app's own sequential
# release labels (per that row's own summary: "This will become the new
# Test One... repeat for version two and three"), not separate apps - see
# scripts/app_registry.py's RECOVERY_MEASURES entry. Installing its current
# build here is enough to reach the login screen this flow actually needs.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_RECOVERY_MEASURES}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# "Reinstall and update 3" - update CommCare app to Test Two via the normal
# "Update App" menu path (not the recovery-measures forced flow).
- runFlow: ../common/update_app_via_menu.yaml
- runFlow: ../common/logout.yaml
# Confirm the update actually landed before handing back to the HQ pre-step
# that marks Test Three released (reinstall_update_4_mark_test_three.json).
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# ASSUMPTION (not verifiable from commcare-android source, which has no
# knowledge of this QA cycle's specific build numbering): "Test Two" maps to
# profile version "2" per the sheet's own "Version N" naming pattern (Test
# One=1, Test Two=2, Test Three=3), consistent with how
# check_app_version_via_about.yaml's docstring describes its EXPECTED_VERSION
# param. Confirm against your actual QA build's real profile version before
# relying on this assertion, and adjust if this cycle's builds are numbered
# differently.
- runFlow:
    file: ../common/check_app_version_via_about.yaml
    env:
      EXPECTED_VERSION: "2"
- runFlow: ../common/logout.yaml
