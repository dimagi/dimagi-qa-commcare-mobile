appId: org.commcare.dalvik
tags:
  - recovery_measures
  - automatable
---
# Master Mobile Plan (2026) > Recovery Measures > CC Update Needed.
# NOTE ON IDs: the source sheet reuses the exact same "CC Reinstall Needed
# 3/4/5" label for this different section - confirmed against the sheet by
# the orchestrating task, not a mistake made in this repo. Kept literal here
# since it is just a row label, never asserted on-screen. Covers Test Case
# IDs "CC Reinstall Needed 3", "CC Reinstall Needed 4", "CC Reinstall
# Needed 5" (as labeled under "CC Update Needed step" in
# coverage_matrix.csv) - the Automatable rows. "CC Reinstall Needed 1" and
# "2" (under the same "CC Update Needed step" summary) are out of scope here
# per task instructions - they need a specific historical CommCare APK
# and/or an HQ mark-released + raised recovery Max Version call to get the
# device into a below-minimum-CC-version state. This flow assumes that
# precondition (device on an old CommCare/"CC" binary version, with a
# MEASURE_TYPE_CC_UPDATE recovery measure pending on the currently-seated
# app) has already been established by that out-of-scope setup before this
# flow runs.
#
# UNVERIFIED TEXT WARNING: per docs/FRAMEWORK.md's "Known gaps" item 4 and
# reinstall_update_app_flow.yaml's header (this repo's convention for
# Recovery Measures), assertions below use best-effort case-insensitive
# regex rather than exact strings even though (see next paragraph) most of
# this particular screen's text was actually found hardcoded.
#
# Verified against commcare-android source (read-only reference, never
# modified by this repo): RecoveryMeasure.MEASURE_TYPE_CC_UPDATE, handled in
# ExecuteRecoveryMeasuresPresenter.executeMeasure(), launches
# PromptApkUpdateActivity (app/src/org/commcare/activities/
# PromptApkUpdateActivity.java) in forced mode:
#   - title (forced): Localization.get("apk.update.required.title",
#     clientName) = "New version of ${0} is Required"
#     (android_translatable_strings.txt:28; e.g. "New version of CommCare is
#     Required")
#   - action button: Localization.get("apk.update.action", clientName) =
#     "Update ${0} via the Play Store" (android_translatable_strings.txt:36)
#   - help text: "update.prompt.help.text" = "If you have issues updating
#     CommCare, please contact your Helpdesk" (android_translatable_strings.txt:31)
# PromptActivity.inForceMode() makes back-press a no-op and hides the
# "do later" button for this measure, so the prompt is expected to block
# the home screen entirely.
#
# CAVEAT: PromptApkUpdateActivity.onCreate(), when toPrompt.isForced() is
# true, ALSO immediately starts an AppUpdateController.startUpdate() (the
# Play Core in-app-update API) alongside setting up the action button -
# meaning the OS's own Play-Store-managed update UI may appear on top of
# (or instead of) this app's own prompt, independent of whether the action
# button is tapped. Like cc_reinstall_needed_flow.yaml's Play Store
# dependency, this is not reliably scriptable on a BrowserStack device that
# may lack a signed-in, functional Play Store - this flow only asserts the
# forced-update prompt appears and that tapping its action button navigates
# away from it; it does not attempt to drive the Play Store / Play Core
# update UI itself. The negative check below (final ID in this file) is
# only meaningful once a real CC update has happened by some out-of-band
# means between the tap and the final login.
# UPDATE, confirmed live (run 31276111657): this flow's very first step
# used to be a bare `runFlow: ../common/login.yaml` with no app ever
# installed first - it assumed some "Test One"/"Test Two"/"Test Three" app
# was already on the device from an earlier, undocumented step. That's
# never true when this flow runs on its own (this repo's "each flow
# runnable in isolation" convention, docs/FRAMEWORK.md), so it failed
# outright stuck on the pre-install "Welcome to CommCare!" screen -
# `login.yaml` could never find edit_username there.
# RESOLVED (2026-08-09): per Master Mobile Plan (2026) > Recovery: Reinstall
# and Update App > Setup 1's own linked HQ Releases URL (user-supplied):
# https://www.commcarehq.org/a/qateam/apps/view/c49c34a1d74297ecb6ecef7a7c5d3f88/releases/
# "Test One"/"Test Two"/"Test Three" are this ONE app's own sequential
# release labels (per that row's own summary: "This will become the new
# Test One... repeat for version two and three"), not separate apps - see
# scripts/app_registry.py's RECOVERY_MEASURES entry. Installing its current
# build here is enough to reach the login screen this flow actually needs.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_RECOVERY_MEASURES}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# "CC Reinstall Needed 3" (CC Update Needed step) - the forced
# "CommCare needs to be updated" message.
- assertVisible:
    text: "(?i).*update.*required.*"
- assertVisible:
    text: "(?i).*play store.*"
# "CC Reinstall Needed 4" (CC Update Needed step) - update: tap the action
# button. See CAVEAT above for what happens (and doesn't happen) after this
# tap.
- tapOn:
    text: "(?i).*update.*play store.*"
# "CC Reinstall Needed 5" (CC Update Needed step) - negative check: once a
# real update has happened (see CAVEAT above), relaunch and confirm the
# prompt no longer blocks login.
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- assertVisible: "Start"
- assertNotVisible:
    text: "(?i).*update.*required.*"
