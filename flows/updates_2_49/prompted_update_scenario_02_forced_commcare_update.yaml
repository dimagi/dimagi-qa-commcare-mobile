appId: org.commcare.dalvik
tags:
  - updates_2_49
  - partial
---
# Master Mobile Plan (2026) > Updates > "Prompted Update Scenario 2" (2.49
# grab-bag section). NOTE: this is a distinct row from the "Prompted Update
# Scenario 2" in the Prompted Updates tab (that one is about the *CCZ/app*
# forced-update blocker; this row is about the CommCare *binary (APK)*
# forced-update blocker screen - see
# hq_setup/updates_2_49/prompted_update_scenario_02_forced.json's comment).
#
# ASSUMES hq_setup/updates_2_49/prompted_update_scenario_02_forced.json has
# already run (apk_prompt=forced on HQ) and a released version newer than
# the one installed on the device is available, analogous to how
# flows/updates_2_49/prompted_update_scenario_01_ill_update_later.yaml
# assumes an *optional* APK update is pending. Only the on-device
# login -> forced-blocker-screen portion is scripted below; per this task,
# the flow stops right where a real Play Store interaction would be
# required, and that remainder is flagged out of scope - the same
# Not-automatable reasoning coverage_matrix.csv already uses for this same
# tab's "In-App Update 1-10" rows ("Depends on real Google Play
# internal-tester/app-sharing infrastructure that cloud device farms don't
# reliably support").
#
# Selectors/strings verified against commcare-android source (read-only
# reference, never modified by this repo):
#   app/src/org/commcare/activities/PromptActivity.java:
#     setupUI() unconditionally calls setUpTypeSpecificUIComponents() (so the
#     title/action-button text below are populated regardless of forced
#     state) and then updateVisibilities(), which hides doLaterButton
#     (R.id.do_later_button) whenever inForceMode() is true (toPrompt.isForced()
#     == true) - this is the on-screen signal that distinguishes the forced
#     blocker from the optional "I'll update later" prompt exercised by
#     prompted_update_scenario_01_ill_update_later.yaml. onBackPressed()/
#     isBackEnabled() also disable the back button in force mode, so the
#     screen cannot be dismissed without acting.
#   app/src/org/commcare/activities/PromptApkUpdateActivity.java
#     setUpTypeSpecificUIComponents(): promptTitle text =
#     Localization.get("apk.update.required.title", clientName) when
#     inForceMode(); actionButton text =
#     Localization.get("apk.update.action", clientName), with its
#     onClickListener wired to launchCurrentAppOnPlayStore() (PromptActivity)
#     - the real Play Store hand-off this flow does NOT execute.
#   app/build.gradle line ~292 (defaultConfig, applicationId
#     'org.commcare.dalvik' - matches this flow's appId): `def
#     applicationName = 'CommCare'` -> resValue 'application_name' ->
#     PromptActivity.getCurrentClientName() -> the "${0}" substituted into
#     both strings below is literally "CommCare" for this build flavor.
#   app/assets/locales/android_translatable_strings.txt:
#     apk.update.required.title = "New version of ${0} is Required" (line 28)
#       -> "New version of CommCare is Required"
#     apk.update.action = "Update ${0} via the Play Store" (line 36) ->
#       "Update CommCare via the Play Store"
#     home.start = "Start" (line 59) - deliberately NOT asserted here, since
#       a forced blocker screen should be the only thing on screen after
#       login, not the home screen.
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null. Same "Basic Tests" default as
# prompted_update_scenario_01_ill_update_later.yaml (this row's own header
# says it's "analogous to" that one).
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}

# --- Forced CommCare (APK) update blocker screen appears ---
- extendedWaitUntil:
    visible: "New version of CommCare is Required"
    timeout: 20000
- assertVisible: "New version of CommCare is Required"
- assertVisible: "Update CommCare via the Play Store"

# --- Confirm it's a genuine blocker: no "I'll update later" escape hatch ---
- assertNotVisible: "I'll update later"

# === Out of scope beyond this point ============================================
# Tapping "Update CommCare via the Play Store" launches a real market://
# / play.google.com/store Intent (PromptActivity.launchCurrentAppOnPlayStore())
# and, for the forced case, PromptApkUpdateActivity.onCreate() also kicks off
# Google Play Core's "immediate" in-app-update flow automatically - both
# require actual Play Store/Play Core infrastructure BrowserStack's device
# farm doesn't reliably provide (same reasoning as coverage_matrix.csv's
# "In-App Update 1-10" rows on this tab). Not scripted here.
