appId: org.commcare.dalvik
tags:
  - updates_2_49
  - automatable
---
# Master Mobile Plan (2026) > Updates > "Rate limit 2/3/4" (2.49 grab-bag
# section), run as one sequential flow since the sheet's rows are clearly a
# single narrative - submit, dismiss popup; submit again, don't-show-again;
# submit again, check the toast - mirroring how
# flows/mobile_pins/pin_03_no_dont_ask_again.yaml composes a sequence.
#
# ASSUMES the "Rate limit 1" pre-provisioned "Rate Limiting" test app is
# already installed and logged into on the device (that provisioning is
# PARTIAL per coverage_matrix.csv - HQ/BrowserStack-side setup, out of scope
# here). Only the on-device interaction below is scripted, which needs no
# HQ pre-step itself, hence Automatable.
#
# Selectors/strings verified against commcare-android source (read-only
# reference, not modified):
#   app/src/org/commcare/activities/SyncCapableCommCareActivity.java
#     showRateLimitError(userTriggered) - the popup (title+message+2 buttons)
#     only appears when userTriggered=true (i.e. the user tapped the "Sync
#     with Server" button - see StandardHomeActivity.syncButtonPressed()'s
#     doc comment "Triggered by a user manually clicking the sync button")
#     AND the popup hasn't been disabled via "Don't show again" yet. Once
#     disabled (or for any non-user-triggered send attempt), the same
#     RATE_LIMITED result instead falls through to updateUiForFormUploadResult,
#     which displayToast()s the toast string as an actual Android Toast.
#   app/assets/locales/android_translatable_strings.txt:
#     home.sync = "Sync with Server" (line 64)
#     form.send.rate.limit.error.title = "You've reached your form
#       submission rate limit" (line 142)
#     form.send.rate.limit.error.message = "Form submissions will be saved
#       locally on your phone until rate limiting expires. Not to worry, all
#       forms will be auto-synced to the server later. Contact your CommCare
#       admin for more information." (line 143)
#     rate.limit.error.dialog.do.not.show = "Don't show again" (curly
#       apostrophe U+2019 in source - matched below via regex) (line 144)
#     rate.limit.error.dialog.close = "Close" (line 145)
#     form.send.rate.limit.error.toast = "Form submission rate limit
#       reached. Your forms are being saved locally and will be submitted to
#       the server later." (line 141) - shown via Toast.makeText(..,
#       LENGTH_LONG), so it self-dismisses after a few seconds.
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}

# --- Rate limit 2: submit, popup appears, tap "Close" ---
- runFlow: ../common/submit_only_form.yaml
- tapOn: "Sync with Server"
- extendedWaitUntil:
    visible:
      text: "(?i)You.ve reached your form submission rate limit"
    timeout: 20000
- assertVisible:
    text: "(?i)Form submissions will be saved locally on your phone until rate limiting expires"
- assertVisible:
    text: "(?i)Don.t show again"
- assertVisible: "Close"
- tapOn: "Close"

# --- Rate limit 3: submit again, popup appears again, tap "Don't show again" ---
- runFlow: ../common/submit_only_form.yaml
- tapOn: "Sync with Server"
- extendedWaitUntil:
    visible:
      text: "(?i)You.ve reached your form submission rate limit"
    timeout: 20000
- assertVisible:
    text: "(?i)Form submissions will be saved locally on your phone until rate limiting expires"
- assertVisible:
    text: "(?i)Don.t show again"
- assertVisible: "Close"
- tapOn:
    text: "(?i)Don.t show again"

# --- Rate limit 4: submit again, no popup this time, just a bottom info toast ---
- runFlow: ../common/submit_only_form.yaml
- tapOn: "Sync with Server"
- assertNotVisible:
    text: "(?i)You.ve reached your form submission rate limit"
- extendedWaitUntil:
    visible:
      text: "(?i)Form submission rate limit reached\\. Your forms are being saved locally"
    timeout: 20000
- assertVisible:
    text: "(?i)Form submission rate limit reached\\. Your forms are being saved locally and will be submitted to the server later\\."
# Toast.LENGTH_LONG is ~3.5-4s; wait past that, then confirm it's gone.
- extendedWaitUntil:
    notVisible:
      text: "(?i)Form submission rate limit reached\\. Your forms are being saved locally"
    timeout: 8000
