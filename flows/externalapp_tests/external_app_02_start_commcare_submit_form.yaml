appId: ${EXTAPP_APP_ID}
tags:
  - externalapp_tests
  - partial
env:
  # CONFIRMED (2026-08-09) against the real companion APK - see
  # external_app_01_launch_and_verify_buttons.yaml's env block for the full
  # aapt citation.
  EXTAPP_APP_ID: "com.dimagi.test.external"
  # Button text copied verbatim from the sheet's "External App 2" row, step 1.
  EXTAPP_BTN_START_COMMCARE: "Start CommCare"
  # Value typed into the Basic Form's answer field (step 3, "Enter a value") - the sheet
  # doesn't specify a concrete value, any accepted string/number satisfies "enter a value".
  EXTAPP_FORM_ANSWER_VALUE: "42"
  # Same "sansar" domain login Setup 3 uses - see setup_03_login_and_background.yaml.
  EXTAPP_QA_USERNAME: "qa_user"
  EXTAPP_QA_PASSWORD: "123"
---
# Master Mobile Plan (2026) > ExternalApp Tests > "External App 2" (Start CommCare):
#   1. In the ExternalApp, select Start CommCare
#   2. Verify the Basic Form launches
#   3. Enter a value and submit
#   4. Ensure you're able to successfully submit
#
# Re-establishes CommCare logged-in-and-backgrounded state itself (see External App 1's
# comment for why) - the companion app must already be installed via `--other-app` before
# this flow runs (flows/externalapp_tests/README.md).
- runFlow:
    file: ../common/login_and_background.yaml
    env:
      USERNAME: ${EXTAPP_QA_USERNAME}
      PASSWORD: ${EXTAPP_QA_PASSWORD}
- launchApp:
    appId: ${EXTAPP_APP_ID}
- tapOn: "${EXTAPP_BTN_START_COMMCARE}"

# CROSS-APP CONTEXT SWITCH - approach used and why:
# Tapping "Start CommCare" in the companion app is expected to fire an Android Intent that
# brings CommCare's own form-entry Activity to the foreground (that's the whole point of the
# CaseDataContentProvider/FixtureDataContentProvider-style external-API surface this suite is
# testing - confirmed present in commcare-android's AndroidManifest.xml, though no dedicated
# "launch a form" intent-filter/Activity was found in source to cite by name). Once that
# happens, Maestro keeps driving whatever's now in the foreground - `tapOn`/`assertVisible`/
# `inputText` all act on the current on-screen accessibility tree regardless of which app
# owns it; only `launchApp` itself cares about appId. We deliberately do NOT add an explicit
# `launchApp: appId: org.commcare.dalvik` here, because:
#   (a) we don't know exactly what Activity "Start CommCare" launches, so forcing an explicit
#       launchApp (which restarts the target app unless stopApp:false is passed) risks racing
#       or clobbering the specific screen the companion app's Intent just opened instead of
#       landing on the Basic Form it's supposed to trigger; and
#   (b) plain `assertVisible: {id: "org.commcare.dalvik:id/nav_btn_next"}` below is a
#       sufficient, source-verified way to confirm CommCare's form-entry screen did launch,
#       without needing to force-foreground CommCare ourselves.
# If this "auto-follow" assumption doesn't hold against the real companion app (e.g. it needs
# an explicit foreground nudge), add
# `- launchApp: {appId: org.commcare.dalvik, stopApp: false}` right after the tapOn above -
# stopApp:false brings an already-running/backgrounded app forward without restarting it
# (confirmed via Maestro's launchApp docs), which matters here since CommCare is already
# logged in and must stay that way.

# Form-entry screen: nav_btn_next/nav_btn_finish ids verified against
# app/res/layout/screen_form_entry.xml + app/src/org/commcare/activities/components/
# FormNavigationUI.java (same citation flows/common/submit_only_form.yaml uses) - matched via
# a single regex `id` selector since either one being visible confirms the Basic Form
# launched (single-question forms show nav_btn_finish directly, multi-question ones show
# nav_btn_next first).
#
# UPDATE (2026-08-17): confirmed live via a user-supplied recording - the
# "auto-follow" cross-app assumption above is correct (CommCare genuinely
# does come to the foreground and the form genuinely does launch and
# submit successfully), but tapping "Start CommCare" can trigger a real
# "Logging in / Contacting Server" round-trip first (a full re-auth+sync
# cycle, not an instant hand-off) before form-entry ever appears - the
# same real-server-round-trip timing this repo already gives a generous
# wait elsewhere (flows/common/login.yaml's dialog_cancel_button wait uses
# 120s). 15s was never going to reliably cover that. Raised to match.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_(next|finish)"
    timeout: 120000

# ENTER A VALUE: the Basic Form's exact question/field is specific to the "External App
# Fixture Tests" HQ app (fixture-only, not in commcare-android source - UNVERIFIED), so this
# can't be targeted by a question-specific id or label text. It CAN be targeted generically
# though: commcare-android/app/res/layout/edit_text_question_widget.xml (the layout every
# text-entry question uses, per StringWidget.java's getAnswerLayout()) declares its EditText
# with no android:id at all, but app/src/org/commcare/views/QuestionsView.java's
# setFocus(context, indexOfLastChangedWidget) auto-focuses widgets.get(0) - the FIRST question
# widget on screen - whenever a screen is freshly navigated to (indexOfLastChangedWidget==-1,
# per FormEntryActivityUIController.java's initial createView() call), and StringWidget's own
# setFocus() override both requestFocus()s that EditText AND opens the soft keyboard. So on a
# single-question "Basic Form" screen, the answer field already has focus with no tap needed -
# `inputText` below types directly into it.
# UPDATE, confirmed live (LOCAL-VERIFY-fixes-aug09): the real "Basic Form"
# question here turned out to be a SELECT-ONE/lookup-table question
# ("Select the answer from lookup table", radio choices) rather than the
# plain text field this step assumed - `inputText` had no focused EditText
# to type into (StringWidget's EditText has no android:id per this file's
# own citation above, so there's no reliable way to detect "is this a text
# field" and branch on it). The old unconditional `hideKeyboard` right
# after almost certainly issued a fallback BACK key press since no keyboard
# was ever open, which is what actually opened the unexpected "Exit Form?"
# dialog the failure screenshot showed (a dialog on top makes the
# underlying nav_btn_finish inaccessible to Maestro's query even though
# it's still pixel-visible behind it - explaining why the later
# assertVisible on it failed despite the screenshot showing it). Fixed by
# dropping the unconditional hideKeyboard (nav_btn_next/nav_btn_finish live
# in the top nav bar per screen_form_entry.xml, above the question content,
# so an open keyboard covering the bottom doesn't block them - hiding it
# was never actually necessary for navigation) and adding a defensive
# "Exit Form?" dismiss as a safety net in case this ever recurs from some
# other cause.
- inputText: "${EXTAPP_FORM_ANSWER_VALUE}"
- tapOn:
    text: "STAY IN FORM"
    optional: true
- repeat:
    while:
      visible:
        id: "org.commcare.dalvik:id/nav_btn_next"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
# UPDATE (2026-08-17): confirmed live via BrowserStack's own hierarchy
# dump (build 8d2334866d9f9580091421ecbef01be36657a0e7) - this hard wait
# +tap failed with the device ALREADY back on ExternalApp's own "Hello
# World, ExternalAppActivity!" screen (every one of its buttons visible) -
# the SAME already-advanced-past-Finish race hardened throughout this
# repo: the form submitted and control returned to the companion app
# FASTER than this assertion's poll window. Made optional, with the real
# end state (back on ExternalApp) asserted afterward instead.
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
    optional: true
- extendedWaitUntil:
    visible: "${EXTAPP_BTN_START_COMMCARE}"
    timeout: 15000
    optional: true

# "Ensure you're able to successfully submit" - no fixed success-toast text could be verified
# for this fixture app (UNVERIFIED), so this asserts the ABSENCE of CommCare's generic/
# unrecoverable-error text instead (same citation as flows/common/navigate_form_no_errors.yaml:
# app/src/org/commcare/activities/UnrecoverableErrorActivity.java +
# android_translatable_strings.txt's activity.task.error.generic / app.handled.error.explanation)
# - a submit that neither errors nor leaves the form-entry screen open is the best generic
# proxy available for "successfully submit" without a confirmed success string to assert on.
- assertNotVisible:
    text: "(?i).*unexpected error.*"
- assertNotVisible:
    text: "(?i).*commcare will now restart.*"
# UPDATE, confirmed live (video review, LOCAL-VERIFY-fixes build): the tap
# on nav_btn_finish genuinely worked - the question here has no required
# answer, so submitting blank is valid, and the companion app later shows
# a real "Form successfully completed" toast. But this plain
# `assertNotVisible` fired its one instant check too soon: the activity
# transition back out of form-entry after a real submit takes a moment,
# and nav_btn_finish can still be structurally present for that brief
# window even though the tap already registered and the submit is already
# in flight - failing the test right as the device was about to finish
# tearing the form-entry screen down on its own. Fixed with a bounded wait
# for its absence instead of a single instant check.
- extendedWaitUntil:
    notVisible:
      id: "org.commcare.dalvik:id/nav_btn_finish"
    timeout: 10000
