appId: org.commcare.dalvik
tags:
  - externalapp_tests
  - partial
env:
  # qa_user/123 is the "sansar" domain's own mobile-worker login used specifically by this
  # fixture app - distinct from CC_TEST_USERNAME (test1/123, per .env.example) and
  # CC_TEST2_USERNAME (test2/123) used elsewhere in this repo, so it gets its own env vars
  # (defaulted here to the sheet's literal wording) rather than reusing those.
  EXTAPP_QA_USERNAME: "qa_user"
  EXTAPP_QA_PASSWORD: "123"
---
# Master Mobile Plan (2026) > ExternalApp Tests > "Setup 3" (Deploy Basic Tests):
#   1. Navigate to External App Fixture Tests
#   2. Deploy External App Fixture Tests
#   3. Login with qa_user/123
#   4. Minimize CommCare but leave it running the background
#
# Steps 1-2 are an HQ-side action, not on-device - see
# hq_setup/externalapp_tests/setup_03_deploy_fixture_app.json (run that first, e.g.
# `python scripts/run_suite.py --hq-setup hq_setup/externalapp_tests/setup_03_deploy_fixture_app.json
# --other-app <path-to-mobile-api-testing-app.apk> --tag externalapp_tests`).
# Steps 3-4 are this flow, via the reusable flows/common/login_and_background.yaml subflow
# (see that file for the login-selector and pressKey/backgrounding citations).
#
# PROVISIONING NOTE (Setup 1, "Download ExternalApp"): that row has no Maestro flow of its
# own - it's "download the companion app from Jenkins and install it", which is out-of-band
# provisioning (fetching from https://jenkins.dimagi.com/job/Mobile%20API%20Testing%20App/,
# not reachable from a Maestro flow), not an on-device script. See
# flows/externalapp_tests/README.md for exactly how the resulting APK gets into this same
# BrowserStack session (`scripts/run_suite.py --other-app <path>`), which is what every
# External App N flow in this suite depends on to find the companion app already installed
# before it can `launchApp` it.
#
# DOMAIN CAVEAT: per the sheet's own Notes column on this row, "Apps on qadomain will crash
# since it contains fixtures > 1MB" - this fixture app is intentionally deployed on the
# "sansar" domain (see the ExternalApp Tests tab's Domain row:
# https://www.commcarehq.org/a/sansar/apps/view/e45245362793f25c9692791c58d10b15/), not the
# "qateam" domain most other flows/hq_setup in this repo default to - see
# hq_setup/externalapp_tests/setup_03_deploy_fixture_app.json's own _comment for how to point
# hq_client.py at it.
- runFlow:
    file: ../common/login_and_background.yaml
    env:
      USERNAME: ${EXTAPP_QA_USERNAME}
      PASSWORD: ${EXTAPP_QA_PASSWORD}
