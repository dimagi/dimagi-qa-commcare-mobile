appId: org.commcare.dalvik
tags:
  - other_error_tests
  - partial
---
# Master Mobile Plan (2026) > Other - Error Tests > "Keyboard Navigation" -
# Start > Interface > Keyboard Tests, verify the IME action key (Next/Done/
# etc.) changes appropriately per question, then save and exit.
#
# PARTIAL: the IME action-key symbol/label is rendered by the on-device
# keyboard app itself (Gboard, etc.), not by org.commcare.dalvik's own view
# hierarchy - Maestro has no reliable cross-app way to assert its exact
# appearance changes per question, so this flow only exercises paging
# through the form and completing it, not the visual IME-key verification
# itself.
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Other") - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null. Same "Other" app as xform_error_01_04.yaml - see that file's header
# for the real-vs-instrumentation-test app-name citation.
#
# Verified against commcare-android source (read-only reference, not modified):
#   The CCZ's own default/app_strings.txt (extracted read-only from
#     resources/qateam - Other - v42.ccz, never committed/modified):
#     modules.m0="Interface" containing forms.m0f3="Keyboard Tests" -
#     matches this tab's own "Start -> Interface -> Keyboard Tests"
#     navigation exactly.
#
# UPDATE, confirmed live 2026-08-12: the strict "extendedWaitUntil
# nav_btn_finish visible" below failed outright, but the failure
# screenshot showed the device already back on the home screen ("1 form
# sent to server!") - the form genuinely completed successfully, this
# button just didn't stay on screen long enough for a single poll window
# to catch it (same race already fixed in
# flows/login/commcare_odk_01_login.yaml and
# flows/form_submissions/question_types_01_03_answer_and_submit.yaml).
# Made the finish tap optional and asserted the real end state (Start)
# instead.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_OTHER}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: "test1"
      PASSWORD: "123"
- assertVisible: "Start"
- tapOn: "Start"
- tapOn: "Interface"
- tapOn: "Keyboard Tests"
- repeat:
    while:
      visible:
        id: "org.commcare.dalvik:id/nav_btn_next"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
    optional: true
- extendedWaitUntil:
    visible: "Start"
    timeout: 15000
