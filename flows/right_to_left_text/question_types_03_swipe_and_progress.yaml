appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - automatable
---
# Master Mobile Plan (2026) > Right to Left Text > "Question Types 3" -
# Progress and Swiping: ensure swiping between questions is inverted (left
# to right); ensure the progress bar loads right to left when proceeding.
#
# REAL check for the swipe half: under LTR, a leftward swipe (finger
# gesture: right edge -> left edge) advances to the NEXT question (mirrors
# reading direction); the sheet's claim is this inverts under RTL, so a
# RIGHTWARD swipe (left edge -> right edge) should be what advances instead.
# Verified by asserting a state change actually consistent with "advanced" -
# org.commcare.dalvik:id/nav_btn_prev only becomes meaningfully enabled once
# past the first question (screen_form_entry.xml, FormEntryActivity) - so
# swiping right from question 1 and then finding nav_btn_prev active is
# real evidence the inverted-swipe direction navigated forward.
# GAP: the progress bar's own fill DIRECTION (right-to-left) during that
# transition is a rendering-over-time property with no Maestro assertion
# primitive (see home_03's header) - only presence is confirmed.
- runFlow: switch_to_arabic.yaml
- tapOn: "Start"
- tapOn:
    id: "org.commcare.dalvik:id/row_txt"
    index: 0
- assertVisible:
    id: "org.commcare.dalvik:id/nav_prog_bar"
- swipe:
    start: "20%, 50%"
    end: "80%, 50%"
- assertVisible:
    id: "org.commcare.dalvik:id/nav_btn_prev"
