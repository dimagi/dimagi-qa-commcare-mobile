appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - automatable
---
# Master Mobile Plan (2026) > Right to Left Text > "Login 3" - Login: type
# into username/password fields, verify text populates right-to-left, log in.
#
# GAP: the actual claim (does typed text visually grow from the right edge
# as you type) is a rendering-over-time property Maestro cannot observe -
# there is no frame-by-frame text-position API. The real, testable proxy
# built here instead: org.commcare.dalvik:id/show_password (the
# reveal-password icon, `visibility="invisible"` until text is entered - see
# app/src/org/commcare/activities/LoginActivityUIController.java) sits at the
# field's "end" in its layout - under RTL, "end" mirrors to the visual LEFT,
# so once visible it should render leftOf edit_password rather than at its
# normal LTR position on the right. This is a real element-to-element
# position check, not a guess.
- runFlow: switch_to_arabic.yaml
- runFlow: ../common/logout.yaml
# Sheet's own illustrative creds are "test1/123" (not real for this app's
# domain) - uses the real CC_TEST_USERNAME/PASSWORD instead so this flow can
# also complete a genuine login, matching the row's own final step.
- tapOn:
    id: "org.commcare.dalvik:id/edit_username"
- inputText: "${CC_TEST_USERNAME}"
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- inputText: "${CC_TEST_PASSWORD}"
- assertVisible:
    id: "org.commcare.dalvik:id/show_password"
    leftOf:
      id: "org.commcare.dalvik:id/edit_password"
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/login_button"
- assertVisible:
    id: "org.commcare.dalvik:id/home_gridview_buttons"
