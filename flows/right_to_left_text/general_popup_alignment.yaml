appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - partial
---
# Master Mobile Plan (2026) > Right to Left Text > "General" - Exploratory:
# popups have right-aligned text; popups with progress bars load right to
# left; the sync popup's loading icon spins counterclockwise.
#
# GAP: popup TEXT alignment and progress-bar fill direction are the same
# intra-widget/over-time properties flagged throughout this tab as
# non-automatable via Maestro (see login_02 and home_03's headers).
# The spinner ROTATION DIRECTION claim is a harder, distinct gap: Maestro has
# no primitive for angular/rotation-direction assertions at all (clockwise
# vs counterclockwise), regardless of whether the element has a stable id -
# this is a genuine tool-capability ceiling, not a research gap. This flow
# can only confirm the sync progress dialog appears at all.
# Real ids (app/src/org/commcare/views/dialogs/CustomProgressDialog.java):
# determinate dialog (used for sync, LoginActivity.generateProgressDialog()
# calling addProgressBar() for DATA_PULL_TASK_ID) ->
# progress_dialog_determinate.xml -> org.commcare.dalvik:id/
# progress_bar_horizontal; indeterminate (update/key-exchange) ->
# progress_dialog_indeterminate.xml -> org.commcare.dalvik:id/progress_bar.
- runFlow: switch_to_arabic.yaml
- tapOn: "(?i)sync.*"
- assertVisible:
    id: "org.commcare.dalvik:id/progress_bar_horizontal"
    optional: true
- assertVisible:
    id: "org.commcare.dalvik:id/progress_bar"
    optional: true
- extendedWaitUntil:
    visible:
      text: "(?i)sync successful"
    timeout: 30000
