appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - automatable
---
# Master Mobile Plan (2026) > Right to Left Text > "Question Types 1" -
# Form/Menu alignment: ensure the list of forms/menus is right aligned with
# the icons on the right.
#
# REAL check: app/res/layout/menu_list_item_modern.xml's root LinearLayout
# has no layoutDirection lock, so under RTL its children mirror visually -
# row_img (icon, declared FIRST in the layout) should render to the RIGHT of
# row_txt (title, declared second) once mirrored - a genuine
# element-to-element position claim, not intra-widget text alignment (the
# text's own right-alignment inside row_txt itself remains unverifiable, per
# every other row in this tab).
- runFlow: switch_to_arabic.yaml
- tapOn: "Start"
- assertVisible:
    id: "org.commcare.dalvik:id/row_img"
    index: 0
    rightOf:
      id: "org.commcare.dalvik:id/row_txt"
      index: 0
