appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - partial
---
# Master Mobile Plan (2026) > Right to Left Text > "Question Types 4" - No
# white space images: first question shows a dog image + right-aligned
# Arabic text with no significant gap between them; select the checkbox and
# proceed.
#
# GAP: pixel-gap measurement between an image and text is not observable via
# Maestro (no bounds-distance assertion primitive) - only presence and
# interaction are verified. FormEntryActivity's question widgets render
# generically (question text + optional media + the answer widget) without
# stable custom ids for the image itself (confirmed no ImageView id exists
# on QuestionWidget's base rendering - it's built from the form definition,
# not a fixed layout resource), so this proceeds by nav button rather than a
# specific checkbox id (SelectMultiWidget assigns checkbox ids at RUNTIME
# from a hash of the question index - not a stable id to hardcode, see
# question_types_05's header for the same pattern).
- runFlow: switch_to_arabic.yaml
- tapOn: "Start"
- tapOn:
    id: "org.commcare.dalvik:id/row_txt"
    index: 0
- assertVisible:
    id: "org.commcare.dalvik:id/nav_prog_bar"
- tapOn:
    point: "50%, 40%"
    optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
