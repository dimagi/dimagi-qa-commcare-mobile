appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - partial
---
# Master Mobile Plan (2026) > Right to Left Text > "Login 1" - Header: verify
# the app name is on the right, verify the "three dots" options button is in
# the right corner.
#
# GENUINE SELECTOR GAP (confirmed via commcare-android source, not guessed):
# the toolbar (app/res/layout/appbar_layout.xml, org.commcare.dalvik:id/toolbar)
# renders its title via the platform ActionBar/Toolbar - LoginActivity never
# sets a custom title view or resource id, and Localization.get("app.display.
# name") falls back to a per-flavor `application_name` Gradle resValue, not a
# literal string in this repo. The overflow ("three dots") button has NO
# custom resource id either - grepped `setOverflowIcon` across app/src, zero
# hits, so it's the stock AppCompat ActionMenuView overflow button, whose
# accessible name is androidx's own bundled "More options" string - real
# Android library string tables generally DO ship a proper Arabic
# translation for this (unlike this app's own possibly-partial translations,
# which the sheet's own Note (row 5) explicitly says are allowed to still
# show English) - so once Setup 3's in-app switch to Arabic is active, this
# text is likely to actually render in Arabic, not "More options".
#
# Given neither element has a resource id, and the title text is a
# build-flavor value while the overflow text may render in a locale this
# repo has no confirmed transliteration for, there is no reliable Maestro
# selector (text or id) to anchor a genuine "is it on the left half or right
# half of the screen" assertion for either element - this is a real, not
# invented, automatability gap distinct from the 20 other "Not automatable"
# rows in this tab, which at least have identifiable anchors elsewhere.
#
# BEST-EFFORT PROXY implemented here: tap the physical top-right toolbar zone
# (where a mirrored/RTL overflow button would be if it stayed in the visual
# "corner" position the sheet describes) and confirm SOME options list
# appears (i.e. an interactive control genuinely exists there, rather than
# empty toolbar space) - this proves an overflow control is reachable from
# that corner, but does NOT prove the app name's own left/right position,
# which remains unverified by this flow. Coordinates approximate a toolbar's
# usual top-right icon position on a 1080x2400-class device (same
# measurement convention as setup_03_change_language_to_arabic.yaml's own
# coordinate tap).
- runFlow: switch_to_arabic.yaml
- runFlow: ../common/logout.yaml
- assertVisible:
    id: "org.commcare.dalvik:id/toolbar"
- tapOn:
    point: "94%, 4%"
# Login's own menu items are added via plain `Menu.add()` int ids (not
# R.id.* constants - confirmed via source), so there is no id to anchor an
# assertion on; fall back to any of the known English menu strings, accepting
# per this file's header that a fully-localized Arabic build may render none
# of them and this assertion may need loosening once verified live.
- assertVisible:
    text: "(?i).*(about commcare|go to app manager|acquire required permissions|enter practice mode).*"
    optional: true
- back
