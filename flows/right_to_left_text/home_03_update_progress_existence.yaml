appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - partial
---
# Master Mobile Plan (2026) > Right to Left Text > "Home Screen 3" - Update
# page: select "Update App" from options, verify the progress bar loads
# right to left.
#
# GAP: fill DIRECTION of a determinate ProgressBar over time is a rendering
# property Maestro cannot sample frame-by-frame (no rotation/fill-direction
# assertion primitive exists) - this can only confirm the progress control
# itself appears during an update check, not which direction it fills.
# CustomProgressDialog's determinate layout (app/res/layout/
# progress_dialog_determinate.xml) uses org.commcare.dalvik:id/
# progress_bar_horizontal; the indeterminate one (progress_dialog_
# indeterminate.xml, used for the "no update available" / install-check
# path) uses org.commcare.dalvik:id/progress_bar - checking for either
# covers both possible dialogs UpdateActivity may show.
- runFlow: switch_to_arabic.yaml
- tapOn: "More options"
- tapOn:
    id: "org.commcare.dalvik:id/action_update"
- assertVisible:
    id: "org.commcare.dalvik:id/progress_bar_horizontal"
    optional: true
- assertVisible:
    id: "org.commcare.dalvik:id/progress_bar"
    optional: true
- assertVisible:
    text: "(?i).*(app is up to date|no update)"
    optional: true
- back
