appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - partial
---
# Master Mobile Plan (2026) > Right to Left Text > "Home Screen 6" -
# Multi-choice buttons in settings: open Auto Update Frequency, ensure the
# single-select choice buttons are right aligned.
#
# GAP: this is a standard AndroidX ListPreference, which opens a PLATFORM
# AlertDialog.setSingleChoiceItems() dialog (app/res/xml/main_preferences.xml
# android:key="cc-autoup-freq") - the rows use the OS's own
# select_dialog_singlechoice_material layout, not anything in this repo, and
# the framework's own row id (android.R.id.text1) is not something Maestro
# can target as a per-row identity distinct from its sibling rows. Choice
# labels come from arrays frequency_vals_labels (app/res/values/strings.xml)
# - only presence of the dialog and its choices is verified below, not
# alignment.
- runFlow: switch_to_arabic.yaml
- tapOn: "More options"
- tapOn:
    id: "org.commcare.dalvik:id/action_preferences"
- tapOn: "Auto Update Frequency"
- assertVisible: "(?i).*(never|daily|weekly).*"
- back
- back
