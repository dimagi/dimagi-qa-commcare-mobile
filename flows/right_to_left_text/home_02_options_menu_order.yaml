appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - partial
---
# Master Mobile Plan (2026) > Right to Left Text > "Home Screen 2" - Items
# within options: select the options button, ensure the items are right
# aligned.
#
# GAP: right-alignment of each row's own text is intra-widget, not testable
# via Maestro (see login_02's header for the general explanation). What IS
# real and testable: each item's resource id (app/res/menu/menu_app_home.xml,
# StandardHomeActivity.java) and their declared top-to-bottom order, which
# this asserts via `above`/`below` chaining - a weaker check than the sheet's
# own claim, but a genuine one (not fabricated).
- runFlow: switch_to_arabic.yaml
- tapOn: "More options"
- assertVisible:
    id: "org.commcare.dalvik:id/action_update"
- assertVisible:
    id: "org.commcare.dalvik:id/action_saved_forms"
    below:
      id: "org.commcare.dalvik:id/action_update"
- assertVisible:
    id: "org.commcare.dalvik:id/action_change_language"
    below:
      id: "org.commcare.dalvik:id/action_saved_forms"
- back
