appId: org.commcare.dalvik
tags:
  - right_to_left_text
  - automatable
---
# Master Mobile Plan (2026) > Right to Left Text > "Home Screen 4" - Offline
# install: from Update App, open its own options menu and choose the only
# option (offline install); verify the text input runs right to left (type
# any characters to review).
#
# CONFIRMED via source (not the Home screen's own menu - a SEPARATE overflow
# menu inside UpdateActivity itself, app/src/org/commcare/activities/
# UpdateActivity.java onCreateOptionsMenu()/onPrepareOptionsMenu()): three
# possible items - MENU_UPDATE_TARGET_OPTIONS ("menu.update.options"="Update
# Options", hidden unless a dev-preference flag is set),
# MENU_UPDATE_FROM_CCZ ("menu.update.from.ccz"="Offline Update", visible
# unless launched from App Manager), MENU_UPDATE_FROM_HUB
# ("menu.update.from.hub"="Update from Local Hub", hidden unless a hub app
# record exists). With the first and third normally hidden, "Offline Update"
# is genuinely "the only option" the sheet describes. Tapping it opens
# InstallArchiveActivity (app/src/org/commcare/activities/
# InstallArchiveActivity.java), whose path-entry field is a real, confirmed
# id: org.commcare.dalvik:id/screen_multimedia_inflater_location.
# GAP: as with every other field in this tab, RTL text-DIRECTION during
# typing isn't observable via Maestro - only that the field exists and
# accepts input is verified here.
- runFlow: switch_to_arabic.yaml
- tapOn: "More options"
- tapOn:
    id: "org.commcare.dalvik:id/action_update"
- tapOn: "More options"
- tapOn: "Offline Update"
- assertVisible:
    id: "org.commcare.dalvik:id/screen_multimedia_inflater_location"
- tapOn:
    id: "org.commcare.dalvik:id/screen_multimedia_inflater_location"
- inputText: "test-input-١٢٣"
- hideKeyboard
- back
- back
