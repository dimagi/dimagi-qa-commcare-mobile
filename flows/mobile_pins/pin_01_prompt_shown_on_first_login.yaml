appId: org.commcare.dalvik
tags:
  - mobile_pins
  - partial
---
# Master Mobile Plan (2026) > Mobile Pins > "Pin 1" - Prompt.
# NOTE: Prepends install_app_as_web_user.yaml (APP_NAME: ".*[Master] Basic
# Tests") - a fresh BrowserStack session has no app installed until this
# runs; see DispatchActivity.java's CommCareSetupActivity routing when
# currentApp == null.
# Strings verified against app/assets/locales/android_translatable_strings.txt
# (pin.dialog.prompt.set / pin.dialog.yes / pin.dialog.not.now / pin.dialog.never)
# and app/src/org/commcare/views/dialogs/PaneledChoiceDialog.java (extra_info_button).
#
# ALSO COVERS coverage_matrix.csv's second "Pin 1" row ("Prompt shown again
# after reinstall", following "Setup 5"'s uninstall +
# "Setup 6"'s HQ-side reinstall - see flows/mobile_pins/setup_05_uninstall_app.yaml
# and hq_setup/mobile_pins/setup_06_reinstall_application.json). The two rows
# assert the exact same on-device condition ("Create a PIN?" is shown on the
# first login after no PIN has ever been set) - the only difference is *why*
# the app has no PIN state (never-had-one vs. just-reinstalled), which this
# self-contained Maestro flow can't distinguish anyway (per this framework's
# own convention every flow gets a fresh app install regardless of which
# sheet row prompted it - see docs/FRAMEWORK.md "Each flow must be runnable
# in isolation"). Deliberately NOT duplicated into a second
# pin_01_prompt_after_reinstall.yaml file for that reason - point
# coverage_matrix.csv's second "Pin 1" row at this same file.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# UPDATE, confirmed live (2026-08-08, per explicit direction): every
# mobile_pins Pin N test is blocked at the exact same wall - the "Give
# option to use PIN for login" dev preference can never appear without a
# real Mobile Privileges QR claim (see
# flows/common/enable_pin_login_option.yaml's own "FINAL UPDATE" for the
# full source citation) - so nothing below this point in this test's
# ORIGINAL assertions (this specific Pin's own subject matter) can ever be
# reached. Rather than fail here, this flow now verifies everything that
# genuinely IS automatable and stops there: Developer Options unlocks, the
# Mobile Privileges screen opens, and tapping CLAIM PRIVILEGES actually
# launches the scanner - the same boundary
# flows/mobile_pins/setup_04_claim_privileges_scanner_opens.yaml already
# established (see that file's own header for the full selector citations:
# DeveloperPreferences.java, GlobalPrivilegeClaimingActivity.java, etc.).
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
- repeat:
    times: 4
    commands:
      - tapOn: "More options"
      - tapOn: "About CommCare"
      - tapOn: "OK"
- assertVisible:
    text: "Developer Mode Enabled"
    optional: true
- tapOn: "More options"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Developer Options"
    direction: DOWN
    timeout: 15000
- tapOn: "Developer Options"
- tapOn: "More options"
- tapOn: "Mobile Privileges"
- assertVisible:
    id: "org.commcare.dalvik:id/claim_button"
- tapOn:
    id: "org.commcare.dalvik:id/claim_button"
- tapOn:
    text: "(?i).*while using the app.*"
    optional: true
- tapOn:
    text: "(?i)allow"
    optional: true
- assertNotVisible:
    id: "org.commcare.dalvik:id/claim_button"
