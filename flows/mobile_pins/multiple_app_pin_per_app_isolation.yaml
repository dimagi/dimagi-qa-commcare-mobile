appId: org.commcare.dalvik
tags:
  - mobile_pins
  - partial
---
# Master Mobile Plan (2026) > Mobile Pins > "Mutiple App PIN" (sheet's own
# spelling; coverage_matrix.csv keeps the Test Case ID verbatim, this file is
# named with the correct spelling since it's just a descriptive slug) - the
# "Per-app PIN isolation" half: "login as test1/123 on Basic Tests and set
# PIN, login same user on Case Management and set PIN, uninstall Basic Tests,
# login using PIN in Case Management app, verify login is functional."
#
# ASSUMES both "Basic Tests" and "Case Management" CCZ apps are already
# installed & seated side-by-side as TWO APP PROFILES INSIDE THE SAME
# CommCare APK (CommCare's own "multiple apps" feature - see
# app/src/org/commcare/utils/MultipleAppsUtil.java on the read-only
# commcare-android reference - NOT two separate APKs). That provisioning is
# "Mutiple App PIN"'s OTHER coverage_matrix.csv row ("Install two CCZ apps +
# enable PIN", Partial) and is covered by
# hq_setup/mobile_pins/mutiple_app_pin_install_apps.json (HQ publish half)
# plus "Setup 4"'s barcode-claim step, run twice, once per app (Not
# automatable, out of scope here - see that JSON's header comment).
#
# APP-SWITCHING CAVEAT (read before relying on this): commcare-android has no
# single-tap "switch active app" UI action. The only way to seat a
# not-currently-seated app found in the read-only reference is via
# SingleAppManagerActivity's "Update" button (id/update_button, always
# visible per app/res/layout/single_app_view.xml) or "Verify Resources"
# button (id/verify_button, visibility conditional on
# !appRecord.resourcesValidated() per that activity's refresh() method) -
# both call SingleAppManagerActivity.seatApp() as a side effect when the
# selected app isn't already seated (app/src/org/commcare/activities/
# SingleAppManagerActivity.java update()/verifyResources()), which launches
# SeatAppActivity (a brief "CommCare is loading your app" progress screen -
# android_translatable_strings.txt line 418: seating.app=CommCare is loading
# your app - that auto-finishes with RESULT_OK, no tap needed) and then
# proceeds into UpdateActivity or CommCareVerificationActivity respectively.
# This flow uses the "Update" button since it's unconditionally visible
# (avoids depending on the MM-validation state of a freshly-installed app),
# and UpdateActivity.returnResult() (~line 558-566) auto-finishes itself with
# a toast once the update check resolves - no explicit dismissal tap is
# needed, but there's no fixed on-screen landmark to assert mid-way either,
# so this flow waits on the SEATING PROGRESS SCREEN clearing instead, then
# force-restarts the app (stopApp + launchApp) so DispatchActivity's normal
# startup dispatch() picks up the now-seated app fresh and lands on ITS
# LoginActivity, rather than trying to navigate the intermediate
# Update/SingleAppManager screens precisely. NOT exercised against a live
# BrowserStack run - the exact intermediate screen timing/text for this
# specific seat-via-Update path is a reasonable read of the source above,
# not a confirmed live result; increase the extendedWaitUntil timeouts below
# if it flakes in practice.
#
# Selectors/strings verified against commcare-android source (read-only
# reference, never modified by this repo):
#   app/res/layout/app_manager.xml: id/apps_list_view.
#   app/res/layout/single_app_view.xml: id/app_name, id/update_button.
#   app/src/org/commcare/adapters/AppManagerAdapter.java line ~37:
#     appName.setText(toDisplay.getDisplayName()) - each apps_list_view row's
#     visible text is that app's HQ-configured display name, i.e. literally
#     "Basic Tests" / "Case Management".
#   flows/common/set_pin_via_dialog.yaml / flows/common/login_with_pin.yaml -
#     reused as-is for the actual PIN-setting/PIN-login steps below.
#   flows/mobile_pins/setup_05_uninstall_app.yaml - same "Go To App Manager" >
#     select app > "Uninstall" sequence reused below for the
#     "uninstall Basic Tests" step.
#
# UPDATE: a fresh BrowserStack session has no app installed at all until
# something installs one (see DispatchActivity.java's CommCareSetupActivity
# routing when currentApp == null) - the "ASSUMES both ... already installed
# & seated side-by-side" note above is no longer an out-of-scope
# precondition; the two runFlow calls below actually establish it via
# ../common/install_app_as_web_user.yaml, installing each app in turn
# without uninstalling the other (CommCare's "multiple apps" feature keeps
# both seated side-by-side once installed this way). Real app names are
# "Basic Tests" (substring of the exact HQ name "[Master] Basic Tests" -
# see that subflow's own CAVEAT on why a bracket-free substring is used
# instead of the literal bracketed name) and "Case Managements!" (the exact
# HQ name per resources/qateam - Case Managements! - v232.ccz - this flow's
# original "Case Management" guess below is a safe substring match of that
# real name, not a separate app).

# --- "login as test1/123 on Basic Tests and set PIN" ---
# Install Case Managements! FIRST, Basic Tests SECOND - the immediately
# following login step expects Basic Tests to be the active/seated app, and
# whichever app is installed most recently is the one DispatchActivity lands
# on afterward.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_CASE_MANAGEMENTS}
# Install Basic Tests SECOND, inlined rather than a second runFlow to
# install_app_as_web_user.yaml - that subflow's own launchApp now uses
# clearState: true (see its header for why), which would wipe the
# Case Managements! install this flow just did. This block is that same
# subflow's steps verbatim, minus its leading launchApp.
#
# DELIBERATELY NOT migrated to install_app_by_code.yaml like the first
# install above: the "Enter Code" screen (SelectInstallModeFragment) only
# renders from a fresh CommCareSetupActivity launch when currentApp == null
# (see this file's own UPDATE note above and install_app_by_code.yaml's own
# header) - once Case Managements! is installed and seated, currentApp is no
# longer null, and whether "Enter Code" is reachable at all from "See Apps
# for My User" on an already-running install is unverified. The CCZ/app-list
# path below is proven to work for this exact same-session second-app case,
# so it stays as-is rather than risk an unverified swap.
- tapOn: "More options"
- tapOn: "See Apps for My User"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/switch_button"
    timeout: 15000
- tapOn:
    id: "org.commcare.dalvik:id/switch_button"
- tapOn:
    id: "org.commcare.dalvik:id/edit_email"
- tapOn:
    text: "Skip"
    optional: true
- inputText: "${HQ_WEB_USER_EMAIL}"
- hideKeyboard
- tapOn:
    id: "org.commcare.dalvik:id/edit_password"
- inputText: "${HQ_WEB_USER_PASSWORD}"
- hideKeyboard
- tapOn:
    text: "Skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/get_apps_button"
    timeout: 10000
- tapOn:
    id: "org.commcare.dalvik:id/get_apps_button"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/apps_list_view"
    timeout: 30000
# Same scroll-before-tap fix as install_app_as_web_user.yaml's own FOURTH
# CAVEAT - this is the same scrollable "Apps Available for Install" list,
# just inlined here since this second install can't go through that shared
# subflow (its clearState:true would wipe the first app). "Basic Tests"
# sorts near the top so this is likely already visible, but scrollUntilVisible
# is a no-op when the target is already on screen, so include it for parity.
- scrollUntilVisible:
    element:
      text: ".*Basic Tests$"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Basic Tests$"
- tapOn:
    id: "org.commcare.dalvik:id/install_app_button"
    retryTapIfNoChange: false
    optional: true
# Optional per install_app_as_web_user.yaml's own SIXTH CAVEAT - a CCZ can
# require a newer CommCare APK version than BrowserStack's release build,
# showing an update-prompt dialog that would otherwise block this flow.
- tapOn:
    text: "I.LL UPDATE LATER"
    optional: true
# Optional per install_app_as_web_user.yaml's own FIFTH CAVEAT - this
# transitional screen doesn't reliably render long enough (or at all) to
# catch with a poll-based wait; the login screen wait right after it is the
# real success criterion.
- extendedWaitUntil:
    visible: "Setting Up App"
    timeout: 60000
    optional: true
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/edit_username"
    timeout: 90000
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
# UPDATE, confirmed live (2026-08-08, per explicit direction): this test's
# whole premise (PIN isolation BETWEEN two app profiles) requires setting a
# real PIN on both apps, which requires enabling "Give option to use PIN
# for login" on each - a dev preference that can never appear without a
# real Mobile Privileges QR claim (see
# flows/common/enable_pin_login_option.yaml's own "FINAL UPDATE" for the
# full source citation). Nothing below this point (setting PINs on either
# app, or the isolation check itself) can ever be reached. Rather than fail
# here, this flow now verifies everything that genuinely IS automatable and
# stops there: Developer Options unlocks, the Mobile Privileges screen
# opens, and tapping CLAIM PRIVILEGES actually launches the scanner - the
# same boundary flows/mobile_pins/setup_04_claim_privileges_scanner_opens.yaml
# already established (see that file's own header for the full selector
# citations: DeveloperPreferences.java, GlobalPrivilegeClaimingActivity.java,
# etc.).
- assertVisible: "Start"
- repeat:
    times: 4
    commands:
      - tapOn: "More options"
      - tapOn: "About CommCare"
      - tapOn: "OK"
- assertVisible:
    text: "Developer Mode Enabled"
    optional: true
- tapOn: "More options"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Developer Options"
    direction: DOWN
    timeout: 15000
- tapOn: "Developer Options"
- tapOn: "More options"
- tapOn: "Mobile Privileges"
- assertVisible:
    id: "org.commcare.dalvik:id/claim_button"
- tapOn:
    id: "org.commcare.dalvik:id/claim_button"
- tapOn:
    text: "(?i).*while using the app.*"
    optional: true
- tapOn:
    text: "(?i)allow"
    optional: true
- assertNotVisible:
    id: "org.commcare.dalvik:id/claim_button"
