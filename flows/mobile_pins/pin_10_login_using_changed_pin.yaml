appId: org.commcare.dalvik
tags:
  - mobile_pins
  - automatable
---
# Master Mobile Plan (2026) > Mobile Pins > "Pin 10" - Login using changed PIN 1.
# NOTE: Prepends install_app_as_web_user.yaml (APP_NAME: ".*[Master] Basic
# Tests") - a fresh BrowserStack session has no app installed until this
# runs; see DispatchActivity.java's CommCareSetupActivity routing when
# currentApp == null.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_BASIC_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- runFlow: ../common/enable_pin_login_option.yaml
- runFlow:
    file: ../common/set_pin_via_dialog.yaml
    env:
      PIN: "1234"
- runFlow:
    file: ../common/change_pin_via_menu.yaml
    env:
      CURRENT_PIN: "1234"
      NEW_PIN: "5678"
- runFlow: ../common/logout.yaml
- runFlow:
    file: ../common/login_with_pin.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PIN: "5678"
- assertVisible: "Start"
