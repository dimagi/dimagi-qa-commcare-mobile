appId: org.commcare.dalvik
tags:
  - mobile_pins
  - automatable
---
# Master Mobile Plan (2026) > Mobile Pins > "Pin 2" - Information.
# NOTE: Prepends install_app_as_web_user.yaml (APP_NAME: ".*[Master] Basic
# Tests") - a fresh BrowserStack session has no app installed until this
# runs; see DispatchActivity.java's CommCareSetupActivity routing when
# currentApp == null.
# The grey 'i' is R.id.extra_info_button; its text panel is R.id.extra_info_content,
# toggled visible/gone by PaneledChoiceDialog.toggleExtraInfoVisibility().
- runFlow:
    file: ../common/install_app_as_web_user.yaml
    env:
      APP_NAME: ".*Basic Tests$"
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- assertVisible: "Create a PIN?"
- tapOn:
    id: "org.commcare.dalvik:id/extra_info_button"
- assertVisible:
    id: "org.commcare.dalvik:id/extra_info_content"
- tapOn:
    id: "org.commcare.dalvik:id/extra_info_button"
- assertNotVisible:
    id: "org.commcare.dalvik:id/extra_info_content"
