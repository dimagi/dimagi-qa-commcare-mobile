appId: org.commcare.dalvik
tags:
  - case_filters
  - partial
---
# Master Mobile Plan (2026) > Case Filters > "Fuzzy Search 1" (enable Fuzzy
# Search Matches in Settings), "2" (locate exact match by typing letters
# incrementally, highlighted green), "3" (locate a fuzzy/misspelled match).
#
# PARTIAL: assumes a case named "Christy" already exists in this app (the
# sheet's own prerequisite note: "in order to complete this test you will
# have to have one case with the associated name 'Christy'") - no case-
# creation step for that specific name exists elsewhere in this repo, so
# this is a real, undischarged test-data dependency, not something this
# flow creates itself. Also needs HQ web-user install
# (install_app_as_web_user.yaml).
#
# Prepends install_app_as_web_user.yaml (APP_NAME: ".*Basic Tests$") - a fresh
# BrowserStack session has no app installed until this runs; see
# DispatchActivity.java's CommCareSetupActivity routing when currentApp ==
# null.
#
# Verified against commcare-android source (read-only reference, not modified):
#   The CCZ's own en/app_strings.txt (extracted read-only from resources/
#     qateam - [Master] Basic Tests - v1141.ccz, never committed/modified):
#     modules.m3="Case Tests", forms.m3f1="Update a Case" - matches this
#     tab's own "Case Tests -> Update a Case" navigation exactly.
#   CaseListSearchTest.kt (a DIFFERENT dedicated search-test app, "Test:
#     List Searching", not this tab's "Basic Test" app - but the search
#     WIDGET mechanics it exercises are core CommCare chrome, not app-
#     specific content, same reasoning as this repo's Support Menus flows):
#     R.id.search_action_bar (opens the search box), the SearchAutoComplete
#     view class for typed input, "$matched of $totalSize results for your
#     search: \"$searchText\"" as the live-count text pattern (used below
#     as a substring match since the exact counts depend on this app's real
#     case data, not the 4-case fixture CaseListSearchTest.kt controls).
#   The sheet's own "Settings -> Fuzzy Search Matches -> Enabled" step: the
#     settings-menu labels ("Settings", "Auto Update Frequency" etc.) are
#     confirmed via MenuTests.kt's homeMenuItems/checkStringExists (a
#     different dedicated app, but again core CommCare Settings-screen
#     chrome) - "Fuzzy Search Matches" itself is this flow's own best-effort
#     tap-by-text, not independently source-confirmed.
- runFlow:
    file: ../common/install_app_as_web_user.yaml
    env:
      APP_NAME: ".*Basic Tests$"
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- assertVisible: "Start"

# --- Fuzzy Search 1: enable Fuzzy Search Matches in Settings. ---
# UPDATE, found via a real BrowserStack failure: this used to `back` twice.
# "Fuzzy Search Matches" is a ListPreference-style row - tapping "Enabled"
# selects the value and auto-dismisses its own dialog (same mechanic as
# DeveloperPreferences' ListPreference rows, e.g. cc-offer-pin-for-login -
# see flows/common/enable_pin_login_option.yaml), so only ONE screen (the
# Settings activity itself) is actually open by this point. The failing
# run's hierarchyRoot dump showed the SAMSUNG HOME LAUNCHER on screen right
# after this block - the second `back` had nothing left to close inside the
# app and fell through to real OS back-navigation, exiting CommCare
# entirely (same class of bug as install_app_as_web_user.yaml's earlier
# hideKeyboard-repeat caveat).
- tapOn: "More options"
- tapOn: "Settings"
- assertVisible: "CommCare > Settings"
- tapOn: "Fuzzy Search Matches"
- tapOn: "Enabled"
- back

# --- Fuzzy Search 2: incremental exact-match search, highlighted. ---
- tapOn: "Start"
- tapOn: "Case Tests"
- tapOn: "Update a Case"
- tapOn:
    id: "org.commcare.dalvik:id/search_action_bar"
- inputText: "c"
- assertVisible:
    text: "(?i).*results for your search.*"
- inputText: "h"
- assertVisible: "Christy"

# --- Fuzzy Search 3: fuzzy/misspelled match. ---
- tapOn:
    id: "org.commcare.dalvik:id/search_action_bar"
    optional: true
- eraseText
- inputText: "Krist"
- assertVisible: "Christy"
