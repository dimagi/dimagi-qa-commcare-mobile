appId: org.commcare.dalvik
---
# Non-core helper: from the Graphing module's form list, open "View Cases &
# Graphs" (case_lists.m0 in the app's app_strings.txt) and the case detail
# of CASE_NAME. Ends on the detail's first tab ("Graph0", the XY graph).
# That list is view-only, so its detail button is "DONE", not "Continue"
# (confirmed live 2026-10-02).
- tapOn: "View Cases & Graphs"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/screen_entity_select_list"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "${CASE_NAME}"
    direction: DOWN
    timeout: 20000
- tapOn: "${CASE_NAME}"
- extendedWaitUntil:
    visible: "(?i)done"
    timeout: 15000
- assertVisible: "XY Graph"
