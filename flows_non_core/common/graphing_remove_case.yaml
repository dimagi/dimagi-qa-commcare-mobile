appId: org.commcare.dalvik
---
# Non-core helper (Graphing > Graphing 19, and cleanup): from the Graphing
# module's form list, close the case named CASE_NAME via "Remove Case"
# (a single "Navigate to the end of the form to remove this case." label, per
# the app's CCZ). Ends on the home screen.
- tapOn: "Remove Case"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/screen_entity_select_list"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "${CASE_NAME}"
    direction: DOWN
    timeout: 20000
- tapOn: "${CASE_NAME}"
- tapOn: "Continue"
- repeat:
    times: 3
    while:
      notVisible:
        id: "org.commcare.dalvik:id/nav_btn_finish"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
          optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
# Confirmed live (2026-10-02): submitting Remove Case lands on the HOME
# screen ("1 form sent to server!"), not back on the form list.
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
