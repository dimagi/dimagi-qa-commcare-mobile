appId: org.commcare.dalvik
tags:
  - case_list_optimization
  - automatable
env:
  # Loud-failure ceiling only - the sheet records times but sets no limit.
  # Replace with the owner's agreed budget once there is one.
  LOAD_BUDGET_MS: "60000"
---
# Master Mobile Plan (2026) > Case List Optimization and Cache > Load time-1.
# Times Start > "case list optimization disabled" > Followup until the case list shows (menu/form names
# from the "Case List - optimization" app's released CCZ). The value is
# logged as "TIMING Load time-1 elapsed_ms=..." - compare across the five
# Load time-1..5 flows to see the cache / lazy-load effect.
- runFlow:
    file: ../common/login_case_list_opt.yaml
- runFlow:
    file: ../common/open_case_list_menu.yaml
    env:
      MENU: "case list optimization disabled"
      FORM: "Followup"
# Timed steps stay top-level so their timestamps land in the command log
# (see open_case_list_menu.yaml); scripts/extract_flow_timings.py reports
# the start_timer -> stop_timer gap under the assertTrue label below.
- runScript:
    file: ../common/assets/start_timer.js
- tapOn: "Followup"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/screen_entity_select_list"
    timeout: 180000
- runScript:
    file: ../common/assets/stop_timer.js
- assertTrue:
    condition: ${output.elapsedMs < Number(LOAD_BUDGET_MS)}
    label: "TIMING Load time-1"
- runFlow:
    file: ../common/back_to_home.yaml
