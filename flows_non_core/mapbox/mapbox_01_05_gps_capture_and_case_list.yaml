appId: org.commcare.dalvik
tags:
  - mapbox
  - partial
---
# Master Mobile Plan (2026) > Mapbox > Mapbox 1, (2), 5.
# "Mapbox Tests" app > Capture Location > Registration Form (from its
# released CCZ): name (required), record_a_boundary / walk_a_boundary
# (intent callouts, optional - skipped), gps ("GPS Normal", plain geopoint),
# gps_mapbox ("GPS Mapbox", appearance="maps"), is_the_person_healthy.
#
# Mapbox 2 no longer applies to the current client: commcare-android
# removed Mapbox in 2.59.0 (commits 4607202fb / e6d3972c6, "Remove
# Mapbox-dependent activities/features"), so appearance="maps" now opens the
# Google-map GeoPointMapActivity (accept_location = "Record Location",
# app/res/values/strings.xml). This flow still captures that question, so
# the "maps" path is covered - just not as a Mapbox-style map.
#
# GPS Normal uses the same "Record Location" -> "Location Found!" ->
# "Record Location" -> "Latitude" sequence the core suite's
# flows/case_filters/geoservices_01_register_case.yaml proved on BrowserStack.
# Partial: "Google map is used" / map style are visual checks.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_MAPBOX_TESTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
- runScript:
    file: assets/generate_run_suffix.js
- tapOn: "Start"
- tapOn: "Capture Location"
- tapOn: "Registration Form"
- extendedWaitUntil:
    visible: "Name"
    timeout: 15000
- inputText: "Maestro Map ${output.runSuffix}"
- repeat:
    times: 4
    while:
      notVisible: "GPS Normal"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"

# Mapbox 1 - GPS Normal.
- tapOn: "Record Location"
- tapOn:
    text: "(?i).*while using the app.*"
    optional: true
- tapOn:
    text: "(?i)allow"
    optional: true
- extendedWaitUntil:
    visible: "Location Found!"
    timeout: 65000
- tapOn: "Record Location"
- extendedWaitUntil:
    visible: "(?s).*Latitude.*"
    timeout: 15000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

# GPS Mapbox question (appearance="maps") - now the Google-map picker.
- extendedWaitUntil:
    visible: "GPS Mapbox"
    timeout: 10000
- tapOn: "Record Location"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/accept_location"
    timeout: 65000
- tapOn:
    id: "org.commcare.dalvik:id/accept_location"
- extendedWaitUntil:
    visible: "(?s).*Latitude.*"
    timeout: 15000
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"

- extendedWaitUntil:
    visible: "Is the person healthy ?"
    timeout: 10000
- tapOn: "Yes"
- repeat:
    times: 3
    while:
      notVisible:
        id: "org.commcare.dalvik:id/nav_btn_finish"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
          optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
# Confirmed live (2026-10-02): this app returns to the HOME screen after a
# submit ("1 form sent to server!"), not to the module's form list.
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000

# Mapbox 5 - the new case shows up in the Followup Form's case list.
- tapOn: "Start"
- tapOn: "Capture Location"
- tapOn: "Followup Form"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/screen_entity_select_list"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Maestro Map ${output.runSuffix}"
    direction: DOWN
    timeout: 20000
