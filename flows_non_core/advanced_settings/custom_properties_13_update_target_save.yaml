# Master Mobile Plan (2026) > Advanced Settings > Custom Properties 13.
# cc-update-target = "save": the update must go to the latest SAVED (unbuilt) state - HQ auto-generates that build when the phone asks.
# Run ONLY via scripts/run_targeted_updates_check.py --scenario cp13: it
# prepares the Targeted Updates App on HQ, passes APP_CODE_TARGETED_BASE /
# EXPECTED_UPDATE / EXPECTED_VERSION, and restores the app afterwards (see
# ../common/targeted_update_check.yaml). Excluded from plain tag runs by the
# needs_dedicated_runner tag.
- runFlow:
    file: ../common/targeted_update_check.yaml
