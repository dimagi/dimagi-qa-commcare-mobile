appId: org.commcare.dalvik
tags:
  - graphing
  - partial
---
# Runs on "Graphing - Maestro Reports [DO NOT DELETE]" (APP_CODE_GRAPHING_
# REPORTS, see scripts/app_registry.py), not the Graphing app itself: the
# original's report graphs read the removed v1 report fixture and fail with
# "Unable to find lookup table jr://fixture/commcare:reports" (confirmed
# live 2026-10-02; diagnosed 2026-10-27 - custom series data paths on
# instance('reports')). The copy points them at the v2 fixtures.
# Master Mobile Plan (2026) > Graphing > Graphing 20 and 22 (partial).
# Graphing 20: User Info > Add Details (name required, age, weight - from
# the Graphing app's CCZ), then User Info Reports > "User Info Graph [DO NOT
# DELETE OR EDIT]" shows a stacked bar graph whose legend has Age, and
# axis titles Name / Details (m3.6bcb8f49...graph.* in app_strings.txt).
# Graphing 22: the "No Axes Graph" report renders.
# Reports come from HQ's UCR data at last sync, so the bar for the user
# added here may only appear after HQ processes it - the checks are on the
# graph itself (legend / titles), not on that new bar.
# Partial: "stacked", "no grid", label placement, "no axes" and rotation are
# visual and stay manual.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_GRAPHING_REPORTS}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
- runScript:
    file: assets/generate_run_suffix.js

# Graphing 20 step 1 - add a user with an age and weight.
- tapOn: "Start"
- tapOn: "User Info"
- tapOn: "Add Details"
- extendedWaitUntil:
    visible: "Name"
    timeout: 15000
- tapOn:
    below:
      text: "Name"
    index: 0
- inputText: "Maestro User ${output.runSuffix}"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- extendedWaitUntil:
    visible:
      text: "Age.*"
    timeout: 10000
- tapOn:
    below:
      text: "Age.*"
    index: 0
- inputText: "30"
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_next"
- extendedWaitUntil:
    visible:
      text: "Weight.*"
    timeout: 10000
- tapOn:
    below:
      text: "Weight.*"
    index: 0
- inputText: "60"
- repeat:
    times: 3
    while:
      notVisible:
        id: "org.commcare.dalvik:id/nav_btn_finish"
    commands:
      - tapOn:
          id: "org.commcare.dalvik:id/nav_btn_next"
          optional: true
- tapOn:
    id: "org.commcare.dalvik:id/nav_btn_finish"
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000

# Graphing 20 steps 2-6 - the stacked report graph.
- tapOn: "Start"
- tapOn: "User Info Reports"
- extendedWaitUntil:
    visible:
      text: "User Info Graph.*"
    timeout: 20000
- tapOn:
    text: "User Info Graph.*"
# Step 6: the legend shows Age only - the Weight series is configured with
# is-data false() (out of the legend), as the sheet's step 6 describes.
- extendedWaitUntil:
    visible: "Age"
    timeout: 20000
- assertVisible: "Name"
- assertVisible: "Details"

# Graphing 22 - the no-axes report graph renders.
# Back to the report list (one or two backs depending on whether the report
# opened straight to its detail) - stop as soon as the list shows.
- repeat:
    times: 2
    while:
      notVisible: "No Axes Graph"
    commands:
      - back
- extendedWaitUntil:
    visible: "No Axes Graph"
    timeout: 15000
- tapOn: "No Axes Graph"
- extendedWaitUntil:
    visible: "(?i)done|continue"
    timeout: 20000
