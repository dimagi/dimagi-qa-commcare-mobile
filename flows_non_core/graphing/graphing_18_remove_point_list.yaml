appId: org.commcare.dalvik
tags:
  - graphing
  - partial
---
# Master Mobile Plan (2026) > Graphing > Graphing 18 (steps 1-2, partial).
# Graphing > "Remove a Point" lists every point (child cases of the
# graphing cases) with X / Y / Radius columns (m1.case_short.* headers in
# the Graphing app's app_strings.txt). This flow adds its own point first,
# so the list is never empty, then checks the list and its column headers.
# Partial: steps 3-6 (pick YOUR point and check it's gone from the graphs)
# need a point that's unique on screen; points are named by their x value
# (0-10), so several look identical in this shared list - not done yet.
# Cleans up its case afterwards (Remove Case closes it).
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_GRAPHING}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
- runScript:
    file: assets/generate_run_suffix.js
- runFlow:
    file: ../common/graphing_create_case_with_point.yaml
    env:
      CASE_NAME: "Maestro Point ${output.runSuffix}"
- runFlow:
    file: ../common/back_to_home.yaml
# "Remove point" is a child module shown inside Graphing's own list, not on
# the top-level menu (confirmed live 2026-10-02).
- tapOn: "Start"
- tapOn: "Graphing"
- tapOn: "Remove a Point"
- extendedWaitUntil:
    visible:
      id: "org.commcare.dalvik:id/screen_entity_select_list"
    timeout: 15000
- assertVisible: "X"
- assertVisible: "Y"
- assertVisible: "Radius"
- runFlow:
    file: ../common/back_to_home.yaml
- tapOn: "Start"
- tapOn: "Graphing"
- runFlow:
    file: ../common/graphing_remove_case.yaml
    env:
      CASE_NAME: "Maestro Point ${output.runSuffix}"
