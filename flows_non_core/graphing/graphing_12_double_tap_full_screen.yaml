appId: org.commcare.dalvik
tags:
  - graphing
  - partial
---
# Master Mobile Plan (2026) > Graphing > Graphing 12 (step 1 and 6-7, partial).
# Double-tapping a graph in the case detail opens it full screen in
# CommCareGraphActivity (EntityDetailView.java onDoubleTap -> graphIntent,
# commcare-android read-only). Checked for the Fill graph ("Pan & Zoom"
# annotation inside it, app_strings.txt) and the XY graph: after the double
# tap the detail's tab strip is gone and the graph's own text is still
# there. Partial: zoom in/out, drag and pinch "without distortion" are
# visual checks and stay manual.
- runFlow:
    file: ../common/install_app_by_code.yaml
    env:
      APP_CODE: ${APP_CODE_GRAPHING}
- runFlow:
    file: ../common/login.yaml
    env:
      USERNAME: ${CC_TEST_USERNAME}
      PASSWORD: ${CC_TEST_PASSWORD}
- extendedWaitUntil:
    visible: "Start"
    timeout: 20000
- runScript:
    file: assets/generate_run_suffix.js
- runFlow:
    file: ../common/graphing_create_case_with_point.yaml
    env:
      CASE_NAME: "Maestro Zoom ${output.runSuffix}"
- runFlow:
    file: ../common/graphing_open_case_detail.yaml
    env:
      CASE_NAME: "Maestro Zoom ${output.runSuffix}"

# XY graph (Graph0 tab) full screen.
- extendedWaitUntil:
    visible: "BOTTOM"
    timeout: 15000
- doubleTapOn: "BOTTOM"
- extendedWaitUntil:
    notVisible: "Graph 1"
    timeout: 15000
- assertVisible: "BOTTOM"
- back
- extendedWaitUntil:
    visible: "Graph 1"
    timeout: 15000

# Fill graph (Graph 2 tab) full screen.
- tapOn: "Graph 2"
- scrollUntilVisible:
    element:
      text: "Pan & Zoom"
    direction: DOWN
    timeout: 15000
- doubleTapOn: "Pan & Zoom"
- extendedWaitUntil:
    notVisible: "Graph 1"
    timeout: 15000
- assertVisible: "Pan & Zoom"
- back

- runFlow:
    file: ../common/back_to_home.yaml
- tapOn: "Start"
- tapOn: "Graphing"
- runFlow:
    file: ../common/graphing_remove_case.yaml
    env:
      CASE_NAME: "Maestro Zoom ${output.runSuffix}"
