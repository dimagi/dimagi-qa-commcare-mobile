name: Maestro BrowserStack QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Run only flows carrying this tag. Pick All to run everything (splits across 2 parallel jobs)."
        required: false
        type: choice
        default: "All"
        options:
          - "All"
          - case_filters
          - conditional_enum_in_case_list
          - date_widgets
          - externalapp_tests
          - form_submissions
          - install
          - login
          - menu_badges
          - mobile_pins
          - multimedia
          - other_error_tests
          - prompted_updates
          - recovery_measures
          - right_to_left_text
          - session_expiration
          - support_menus
          - trigger_device_logs
          - update
          - updates_2_49
          - updates_partial_failed
      release_tag:
        description: "commcare-android GitHub release tag to test (e.g. commcare_2.63.4). Leave blank for latest. Ignored unless apk_source below is left as 'GitHub Releases'."
        required: false
        default: ""
      apk_source:
        description: "APK to test. 'GitHub Releases' uses release_tag above (or latest if blank) - the normal path. Any other option tests that committed resources/*.apk file directly instead (e.g. a build not yet published as a release). NOTE: this list is a static snapshot - a newly-added resources/*.apk needs a matching option added here by hand, workflow_dispatch choices can't be generated from the repo at trigger time."
        required: false
        type: choice
        default: "GitHub Releases"
        options:
          - "GitHub Releases"
          - "resources/app-commcare-release-Android16.apk"
          - "resources/commcare_2.45_release.apk"
          - "resources/Mobile API Testing App-release.apk"
      android_version:
        description: "Android version to test on (maps to a Samsung Galaxy flagship BrowserStack has real devices for at that version). Ignored if 'devices' below is also set."
        required: false
        type: choice
        default: "16.0"
        options:
          - "16.0"
          - "15.0"
          - "14.0"
          - "13.0"
          - "12.0"
          - "11.0"
          - "10.0"
      devices:
        description: "Comma-separated BrowserStack device names - overrides android_version above when set (e.g. to pick a specific non-Samsung device)."
        required: false
        default: ""
      hq_setup:
        description: "Path to an hq_setup/*.json pre-step file to run first (optional)."
        required: false
        default: ""
  schedule:
    # Nightly at 03:00 UTC against whatever the latest commcare-android release is.
    - cron: "0 3 * * *"

jobs:
  # Computes the matrix maestro-tests fans out over. A specific --tag pick
  # (or nothing typed in, which never happens via the dropdown but covers any
  # future non-choice trigger) runs as a single matrix entry - no parallelism
  # needed for one tag. "All" (the dropdown's default, and what the nightly
  # schedule trigger implies since it has no inputs at all) splits into 2
  # roughly-balanced groups so the full suite doesn't have to run serially -
  # see the tag lists below for why they're split this way.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      start_epoch: ${{ steps.set-matrix.outputs.start_epoch }}
    steps:
      - id: set-matrix
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "All" ]; then
            # 3-way split (was 2) to further cut per-runner wall-clock time.
            # UPDATE, confirmed live (2026-08-08): the original split above
            # grouped tags by rough conceptual similarity, not actual flow
            # FILE COUNT per tag - it ended up wildly unbalanced (group-a
            # alone carried multimedia(27) + mobile_pins(17) + install(5) +
            # login(3) + date_widgets(3) + case_filters(1) +
            # conditional_enum_in_case_list(1) = 57 files vs group-c's 17),
            # which is exactly why group-a was still running 2+ hours after
            # group-b had already finished in a real run. Rebalanced here by
            # greedily bin-packing each tag's actual file count (computed via
            # `doc.get("tags")` the same way scripts/run_suite.py's own
            # select_flow_files() resolves them - every flow file carries
            # exactly one of these 20 module tags, no overlaps) into 3 groups
            # of the most equal total size possible: 41/41/40 flow files
            # (not counting flows/common/*.yaml's 19 files, which
            # select_flow_files() always adds to every group's run
            # regardless of tags).
            MATRIX='{"include":[
              {"name":"group-a","tags":"multimedia install updates_2_49 other_error_tests support_menus trigger_device_logs"},
              {"name":"group-b","tags":"mobile_pins prompted_updates externalapp_tests updates_partial_failed login case_filters conditional_enum_in_case_list update"},
              {"name":"group-c","tags":"form_submissions recovery_measures right_to_left_text date_widgets session_expiration menu_badges"}
            ]}'
          else
            MATRIX="{\"include\":[{\"name\":\"single\",\"tags\":\"$TAG\"}]}"
          fi
          echo "matrix=$(echo "$MATRIX" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  maestro-tests:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Maestro suite on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          CC_TEST2_USERNAME: ${{ secrets.CC_TEST2_USERNAME }}
          CC_TEST2_PASSWORD: ${{ secrets.CC_TEST2_PASSWORD }}
          HQ_MOBILE_WORKER_USERNAME: ${{ secrets.HQ_MOBILE_WORKER_USERNAME }}
          HQ_MOBILE_WORKER_PASSWORD: ${{ secrets.HQ_MOBILE_WORKER_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          # BrowserStack ties each Android version to specific real devices
          # (not a version you can pick independently of hardware) - this
          # maps android_version to the Samsung Galaxy flagship BrowserStack
          # actually has at that version (confirmed against
          # api-cloud.browserstack.com/app-automate/devices.json), same
          # device family/tier convention as the S20/Android 10 default this
          # replaces. Only used when `devices` is left blank - set `devices`
          # directly to override with a specific/non-Samsung device.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          # --retry-failed: re-triggers a second build with just the flows
          # that failed a real assertion, and reports a pass-on-retry as
          # "rerun" (flaky) instead of "failed" - previously only used in
          # ad-hoc local dispatches, never wired into CI itself, so a
          # genuinely flaky test had no chance to recheck here before today.
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}" --retry-failed)
          for T in ${{ matrix.tags }}; do ARGS+=(--tag "$T"); done
          # apk_source picks between the normal GitHub-release path and a
          # committed resources/*.apk (e.g. a build not yet published as a
          # release) - matches scripts/run_suite.py's own --apk-over-
          # --release-tag precedence.
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          if [ -n "${{ github.event.inputs.hq_setup }}" ]; then ARGS+=(--hq-setup "${{ github.event.inputs.hq_setup }}"); fi
          # externalapp_tests needs its companion app pre-installed alongside the main app -
          # see flows/externalapp_tests/README.md. Only pass it for jobs actually running that
          # tag, so the other matrix groups don't pay for an upload they don't need.
          if [[ " ${{ matrix.tags }} " == *" externalapp_tests "* ]]; then
            ARGS+=(--other-app "resources/Mobile API Testing App-release.apk")
          fi
          python scripts/run_suite.py "${ARGS[@]}"

      # Runs the 3 updates_partial_failed scenarios that genuinely need a
      # mid-session CommCare binary swap (Maestro can't do this at all - see
      # scripts/run_appium_suite.py's own module docstring for the full
      # citation) via real Appium sessions against BrowserStack instead of
      # Maestro. Additive to run_suite.py's own (less complete, but still
      # real) coverage of these same 3 flows above - not a replacement.
      # UPDATE (2026-08-19), per direct user question: this used to be its
      # own separate "appium-tests" job/artifact - folded into whichever
      # matrix job's tags already include updates_partial_failed instead,
      # same gating pattern as externalapp_tests' companion-app upload just
      # above, since a whole extra job wasn't actually needed. Runs AFTER
      # run_suite.py in this same job so run_appium_suite.py's own
      # results-merge logic (see its own module docstring) has something to
      # merge into rather than overwrite.
      - name: Run Appium suite on BrowserStack (updates_partial_failed mid-session updates)
        if: contains(matrix.tags, 'updates_partial_failed')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_MOBILE_WORKER_USERNAME: ${{ secrets.HQ_MOBILE_WORKER_USERNAME }}
          HQ_MOBILE_WORKER_PASSWORD: ${{ secrets.HQ_MOBILE_WORKER_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          # Same android_version-to-device mapping as run_suite.py's own
          # step above - kept as a separate copy rather than a shared step/
          # composite action since it's 7 lines.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-appium")
          # Same apk_source precedence as the Maestro step above - the "new"
          # binary in the mid-session update swap.
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_suite.py "${ARGS[@]}"

      # Runs prompted_updates' scenario_1 (optional CCZ update) and
      # scenario_2 (forced CCZ update) - the 2 flows whose HQ pre-step
      # (mark_build_status) must fire BETWEEN an on-device logout and the
      # next login, which a Maestro build has no way to do mid-execution -
      # see scripts/run_appium_prompted_updates_suite.py's own module
      # docstring for the full citation. Same fold-into-the-matrix-job
      # pattern as the updates_partial_failed Appium step above (per the
      # same direct user question that led to that one).
      - name: Run Appium suite on BrowserStack (prompted_updates mid-flow HQ actions)
        if: contains(matrix.tags, 'prompted_updates')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          # Same android_version-to-device mapping and apk_source
          # precedence as the two Appium steps above.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-prompted-updates-appium")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_prompted_updates_suite.py "${ARGS[@]}"

      # No report-history cache restore/save here on purpose: each matrix
      # job's own reports/history.json only reflects ITS slice of tags, not
      # the full logical run, so it isn't meaningful on its own - the
      # merge-reports job below is the only place the real persistent trend
      # history gets read or written, from the properly COMBINED results.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ matrix.name }}
          path: reports/
          retention-days: 30

  merge-reports:
    needs: [prepare, maestro-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same restore/save pattern as before, just moved here - this is now
      # the only job that reads or writes the real trend history, from the
      # single combined result set every matrix job's artifact feeds into.
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: reports/history.json
          key: report-history-${{ github.run_id }}
          restore-keys: report-history-

      - name: Download all matrix job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-report-*
          path: artifacts/

      - name: Merge matrix job reports
        run: python scripts/merge_reports.py artifacts/*/

      - name: Save report history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/history.json
          key: report-history-${{ github.run_id }}

      - name: Upload merged HTML report
        if: always()
        id: upload_report
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: reports/
          retention-days: 30

      # Formats needs.prepare.outputs.start_epoch (captured at the very
      # start of the prepare job, before matrix fan-out) against "now" into
      # "1h 23m" / "45m" - this job runs last, so its own start time is a
      # reasonable proxy for "when the whole run finished".
      - name: Compute run duration
        id: duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ needs.prepare.outputs.start_epoch }} ))
          hours=$(( elapsed / 3600 ))
          minutes=$(( (elapsed % 3600) / 60 ))
          if [ "$hours" -gt 0 ]; then
            echo "text=${hours}h ${minutes}m" >> "$GITHUB_OUTPUT"
          else
            echo "text=${minutes}m" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Slack notification
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          RUN_TAG: ${{ github.event.inputs.tag }}
          RUN_DURATION: ${{ steps.duration.outputs.text }}
          # Reflects the android_version dropdown, not whatever the
          # maestro-tests job's own `devices` override might have used -
          # matches every other RUN_*/env var here in reading the raw
          # workflow input directly rather than a resolved value.
          ANDROID_VERSION: ${{ github.event.inputs.android_version || '16.0' }}
        run: python scripts/slack_notify.py
