name: Maestro BrowserStack QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Run only flows carrying this tag. Pick All to run everything (splits across 2 parallel jobs)."
        required: false
        type: choice
        default: "All"
        options:
          - "All"
          - case_filters
          - conditional_enum_in_case_list
          - date_widgets
          - externalapp_tests
          - form_submissions
          - install
          - login
          - menu_badges
          - mobile_pins
          - multimedia
          - other_error_tests
          - prompted_updates
          - recovery_measures
          - right_to_left_text
          - session_expiration
          - support_menus
          - trigger_device_logs
          - update
          - updates_2_49
          - updates_partial_failed
      release_tag:
        description: "commcare-android GitHub release tag to test (e.g. commcare_2.63.4). Leave blank for latest. Ignored unless apk_source below is left as 'GitHub Releases'."
        required: false
        default: ""
      apk_source:
        description: "APK to test. 'GitHub Releases' uses release_tag above (or latest if blank) - the normal path. Any other option tests that committed resources/*.apk file directly instead (e.g. a build not yet published as a release). NOTE: this list is a static snapshot - a newly-added resources/*.apk needs a matching option added here by hand, workflow_dispatch choices can't be generated from the repo at trigger time."
        required: false
        type: choice
        default: "GitHub Releases"
        options:
          - "GitHub Releases"
          - "resources/app-commcare-release-Android16.apk"
          - "resources/commcare_2.45_release.apk"
          - "resources/Mobile API Testing App-release.apk"
      android_version:
        description: "Android version to test on (maps to a Samsung Galaxy flagship BrowserStack has real devices for at that version). Ignored if 'devices' below is also set."
        required: false
        type: choice
        default: "16.0"
        options:
          - "16.0"
          - "15.0"
          - "14.0"
          - "13.0"
          - "12.0"
          - "11.0"
          - "10.0"
      devices:
        description: "Comma-separated BrowserStack device names - overrides android_version above when set (e.g. to pick a specific non-Samsung device)."
        required: false
        default: ""
      hq_setup:
        description: "Path to an hq_setup/*.json pre-step file to run first (optional)."
        required: false
        default: ""
  schedule:
    # Nightly at 03:00 UTC against whatever the latest commcare-android release is.
    - cron: "0 3 * * *"

jobs:
  # Computes the matrix maestro-tests fans out over. A specific --tag pick
  # (or nothing typed in, which never happens via the dropdown but covers any
  # future non-choice trigger) runs as a single matrix entry - no parallelism
  # needed for one tag. "All" (the dropdown's default, and what the nightly
  # schedule trigger implies since it has no inputs at all) splits into 2
  # roughly-balanced groups so the full suite doesn't have to run serially -
  # see the tag lists below for why they're split this way.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      start_epoch: ${{ steps.set-matrix.outputs.start_epoch }}
    steps:
      - id: set-matrix
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "All" ]; then
            # 3-way split (was 2) to further cut per-runner wall-clock time.
            # UPDATE, confirmed live (2026-08-08): the original split above
            # grouped tags by rough conceptual similarity, not actual flow
            # FILE COUNT per tag - it ended up wildly unbalanced (group-a
            # alone carried multimedia(27) + mobile_pins(17) + install(5) +
            # login(3) + date_widgets(3) + case_filters(1) +
            # conditional_enum_in_case_list(1) = 57 files vs group-c's 17),
            # which is exactly why group-a was still running 2+ hours after
            # group-b had already finished in a real run. Rebalanced by
            # file count into 3 groups of 41/41/40 flow files.
            #
            # UPDATE (2026-09-11), confirmed live (CI run 34477790541, the
            # first fully-clean dispatch): file-count balance still isn't
            # RUNTIME balance - the 3 groups' real wall-clock came in at
            # group-a 3h36m, group-b 3h44m, group-c 3h18m (a 27min spread),
            # because individual flows vary hugely in real duration (e.g.
            # multimedia's 26 flows alone took 105 real minutes, while
            # trigger_device_logs' 2 flows took under 6). Rebalanced here
            # using each tag's REAL measured total duration_ms from that
            # run's own per-group reports/latest_results.json (not file
            # count) - greedily bin-packed (largest-first, always into the
            # currently-lightest group) into 3 groups of ~160-167 real
            # minutes each (down from a 35min spread to under 8min),
            # treating multimedia+updates_2_49 as one inseparable unit (they
            # share the same HQ app_id - see the "Run Maestro suite (Updates
            # tab..." steps' own citation below for why splitting them across
            # groups would reopen a real race) and keeping prompted_updates's
            # scenario_01/02 Appium steps pinned to their existing groups
            # (group-b/group-c respectively, per the explicit instruction
            # cited on those steps below) rather than moving them, since
            # moving either would add a 4th/3rd extra non-chunk BrowserStack
            # build to an already build-heavy group for a <6min gain - not
            # worth the extra per-build overhead (confirmed live: each
            # group's OWN summed flow duration_ms undercounts its real
            # wall-clock by 40-70 real minutes, almost entirely per-build
            # upload/trigger/poll overhead multiplied by how many separate
            # BrowserStack builds - main chunks plus every dedicated step
            # below - that group's job triggers).
            MATRIX='{"include":[
              {"name":"group-a","tags":"multimedia updates_2_49 externalapp_tests install login update session_expiration"},
              {"name":"group-b","tags":"form_submissions updates_partial_failed case_filters right_to_left_text conditional_enum_in_case_list support_menus menu_badges"},
              {"name":"group-c","tags":"recovery_measures mobile_pins prompted_updates date_widgets other_error_tests trigger_device_logs"}
            ]}'
          else
            MATRIX="{\"include\":[{\"name\":\"single\",\"tags\":\"$TAG\"}]}"
          fi
          echo "matrix=$(echo "$MATRIX" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  maestro-tests:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # UPDATE (2026-08-28), confirmed live (CI run 33178278102, group-a):
    # scripts/download_apk.py's own GitHub API calls (resolving/downloading
    # the CommCare release APK, called by every run_suite.py/run_appium_*.py
    # invocation below) were UNAUTHENTICATED - it already supports adding a
    # GITHUB_TOKEN Authorization header if the env var is set (raises
    # GitHub's API rate limit from 60/hour to 5000/hour), but this workflow
    # never actually set it, so every job here shared the same 60/hour
    # unauthenticated ceiling. A real "HTTP Error 403: rate limit exceeded"
    # crashed this exact job (traced directly to download_apk.py's
    # get_release_by_tag call) under today's unusually heavy CI dispatch
    # volume. Set at the job level (not per-step) so every step in this job
    # that might call download_apk.py is covered - GITHUB_TOKEN is provided
    # free by GitHub Actions for every job, no extra secret needed.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Maestro suite on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          CC_TEST2_USERNAME: ${{ secrets.CC_TEST2_USERNAME }}
          CC_TEST2_PASSWORD: ${{ secrets.CC_TEST2_PASSWORD }}
          HQ_MOBILE_WORKER_USERNAME: ${{ secrets.HQ_MOBILE_WORKER_USERNAME }}
          HQ_MOBILE_WORKER_PASSWORD: ${{ secrets.HQ_MOBILE_WORKER_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          # BrowserStack ties each Android version to specific real devices
          # (not a version you can pick independently of hardware) - this
          # maps android_version to the Samsung Galaxy flagship BrowserStack
          # actually has at that version (confirmed against
          # api-cloud.browserstack.com/app-automate/devices.json), same
          # device family/tier convention as the S20/Android 10 default this
          # replaces. Only used when `devices` is left blank - set `devices`
          # directly to override with a specific/non-Samsung device.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          # --retry-failed: re-triggers a second build with just the flows
          # that failed a real assertion, and reports a pass-on-retry as
          # "rerun" (flaky) instead of "failed" - previously only used in
          # ad-hoc local dispatches, never wired into CI itself, so a
          # genuinely flaky test had no chance to recheck here before today.
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}" --retry-failed)
          for T in ${{ matrix.tags }}; do ARGS+=(--tag "$T"); done
          # apk_source picks between the normal GitHub-release path and a
          # committed resources/*.apk (e.g. a build not yet published as a
          # release) - matches scripts/run_suite.py's own --apk-over-
          # --release-tag precedence.
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          if [ -n "${{ github.event.inputs.hq_setup }}" ]; then ARGS+=(--hq-setup "${{ github.event.inputs.hq_setup }}"); fi
          # externalapp_tests needs its companion app pre-installed alongside the main app -
          # see flows/externalapp_tests/README.md. Only pass it for jobs actually running that
          # tag, so the other matrix groups don't pay for an upload they don't need.
          if [[ " ${{ matrix.tags }} " == *" externalapp_tests "* ]]; then
            ARGS+=(--other-app "resources/Mobile API Testing App-release.apk")
          fi
          python scripts/run_suite.py "${ARGS[@]}"

      # Runs the 3 updates_partial_failed scenarios that genuinely need a
      # mid-session CommCare binary swap (Maestro can't do this at all - see
      # scripts/run_appium_suite.py's own module docstring for the full
      # citation) via real Appium sessions against BrowserStack instead of
      # Maestro. Additive to run_suite.py's own (less complete, but still
      # real) coverage of these same 3 flows above - not a replacement.
      # UPDATE (2026-08-19), per direct user question: this used to be its
      # own separate "appium-tests" job/artifact - folded into whichever
      # matrix job's tags already include updates_partial_failed instead,
      # same gating pattern as externalapp_tests' companion-app upload just
      # above, since a whole extra job wasn't actually needed. Runs AFTER
      # run_suite.py in this same job so run_appium_suite.py's own
      # results-merge logic (see its own module docstring) has something to
      # merge into rather than overwrite.
      - name: Run Appium suite on BrowserStack (updates_partial_failed mid-session updates)
        # always() - confirmed live 2026-08-21: this step's own `if:` was
        # implicitly ANDed with success() on the prior "Run Maestro suite"
        # step (GitHub Actions' default when no status-check function is
        # given), so whenever that Maestro step failed for ANY reason - even
        # a totally unrelated flow elsewhere in the same tag list - this
        # step (and the prompted_updates one below) got silently skipped
        # instead of running. Confirmed via this exact CI run's job steps
        # showing both Appium steps as "skipped" after the Maestro step
        # failed. This coverage is additive/independent (a separate
        # BrowserStack session via a different script), so it should run
        # regardless of the Maestro step's outcome.
        if: always() && contains(matrix.tags, 'updates_partial_failed')
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_MOBILE_WORKER_USERNAME: ${{ secrets.HQ_MOBILE_WORKER_USERNAME }}
          HQ_MOBILE_WORKER_PASSWORD: ${{ secrets.HQ_MOBILE_WORKER_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          # Same android_version-to-device mapping as run_suite.py's own
          # step above - kept as a separate copy rather than a shared step/
          # composite action since it's 7 lines.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-appium")
          # Same apk_source precedence as the Maestro step above - the "new"
          # binary in the mid-session update swap.
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_suite.py "${ARGS[@]}"

      # Runs prompted_updates' scenario_01_optional_ccz_update and
      # scenario_02_forced_ccz_update - the 2 scenarios whose HQ pre-step
      # (mark_build_status) must fire BETWEEN an on-device logout and the
      # next login, which a Maestro build has no way to do mid-execution -
      # see scripts/run_appium_prompted_updates_suite.py's own module
      # docstring for the full citation. Same fold-into-the-matrix-job
      # pattern as the updates_partial_failed Appium step above (per the
      # same direct user question that led to that one).
      #
      # UPDATE (2026-08-22), per direct user instruction: split into TWO
      # separate steps/builds (was one step running both scenarios via the
      # script's own "no --scenario given = run all" default) - confirmed
      # live that running scenario_02 right after scenario_01 in the SAME
      # invocation left scenario_02's own "mark latest build Released"
      # mid-flow action as a no-op (scenario_01 already released it as its
      # end-state), so scenario_02 could never detect a real transition no
      # matter how long it waited. appium_scenarios.py's own functions now
      # each re-assert "latest is In Test" as their first action (a real
      # code fix, not just a workaround), but running them as fully
      # separate BrowserStack sessions here too is a cheap extra layer of
      # isolation against this same class of shared-state bug recurring.
      # UPDATE (2nd correction): per direct user instruction, placed in
      # DIFFERENT matrix groups (scenario_01 -> group-b, scenario_02 ->
      # group-c) rather than two steps in the same job - group-c has no
      # 'prompted_updates' Maestro tag today, so this is gated on
      # matrix.name directly for a full "All" dispatch (group-a/b/c),
      # falling back to the tags check for a scoped single-tag dispatch
      # (matrix.name is "single" there, matching neither group-b nor
      # group-c) so `--tag prompted_updates` ad-hoc runs still cover both
      # in that one job, same as before.
      - name: Run Appium suite on BrowserStack (prompted_updates scenario_01_optional_ccz_update)
        if: always() && (matrix.name == 'group-b' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'prompted_updates')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          # Same android_version-to-device mapping and apk_source
          # precedence as the two Appium steps above.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --scenario scenario_01_optional_ccz_update --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-prompted-updates-scenario-01")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_prompted_updates_suite.py "${ARGS[@]}"

      - name: Run Appium suite on BrowserStack (prompted_updates scenario_02_forced_ccz_update)
        if: always() && (matrix.name == 'group-c' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'prompted_updates')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --scenario scenario_02_forced_ccz_update --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-prompted-updates-scenario-02")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_prompted_updates_suite.py "${ARGS[@]}"

      # Runs the Updates(2.49)-tab's OWN "Prompted Update Scenario 1/2" (the
      # CommCare-BINARY/APK forced-vs-optional update prompt - distinct from
      # the CCZ/app-content prompted_updates scenarios above) as two plain
      # Maestro dispatches, each with its own --hq-setup, matching the
      # mutually-exclusive apk_prompt=on-then-forced HQ states these two
      # flows exercise (a single Maestro build only applies one --hq-setup
      # before the whole build starts - there's no mid-build hook to flip
      # HQ state, unlike run_appium_prompted_updates_suite.py's Appium
      # sessions above, which is why this can't just be folded into the
      # scenario_01/02 Appium steps or the main tag-based dispatch instead).
      #
      # UPDATE (2026-08-24), per direct user instruction: scheduled to run
      # LAST in group-a's job (after the main Maestro dispatch and both
      # Appium steps above) rather than interleaved by tag - confirmed live
      # this app_id's Manage Update Settings are a genuinely global,
      # per-app_id HQ setting, so any OTHER flow sharing this app_id
      # (auto_cc_update_03_relogin_sync_latest_version.yaml,
      # capture_01_gather_signature.yaml, capture_02_signature_reset.yaml -
      # all tagged updates_2_49/multimedia, both in group-a) running
      # concurrently with a mutated apk_prompt=on/forced window is a real
      # hazard, not theoretical. Running these two last, within the same
      # job, after everything else that shares the app has already finished,
      # eliminates the overlap entirely without needing precise
      # interleaving - confirmed via a real local dispatch that running
      # auto_cc_update_03 back-to-back with this app's mutated window did
      # NOT actually break it, but "last, in the same job" removes the
      # question altogether rather than relying on that being reliably true
      # under CI's own (possibly different) timing.
      #
      # Gated the same way as the two Appium steps above: matrix.name ==
      # 'group-a' for the normal All/nightly dispatch, or (for a scoped
      # single-tag ad-hoc dispatch) matrix.tags containing the flows' own
      # updates_2_49_apk_prompt tag.
      - name: Run Maestro suite (Updates tab - CommCare APK update prompt, 1/2 optional)
        if: always() && (matrix.name == 'group-a' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'updates_2_49')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --flow flows/updates_2_49/prompted_update_scenario_01_ill_update_later.yaml --hq-setup hq_setup/updates_2_49/setup_02_commcare_version_plus_one.json --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-apk-update-prompt-1-optional")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_suite.py "${ARGS[@]}"

      - name: Run Maestro suite (Updates tab - CommCare APK update prompt, 2/2 forced)
        if: always() && (matrix.name == 'group-a' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'updates_2_49')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --flow flows/updates_2_49/prompted_update_scenario_02_forced_commcare_update.yaml --hq-setup hq_setup/updates_2_49/prompted_update_scenario_02_forced.json --hq-teardown hq_setup/updates_2_49/prompted_update_scenario_teardown.json --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-apk-update-prompt-2-forced")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_suite.py "${ARGS[@]}"

      # Runs cc_reinstall_needed_01/cc_update_needed_01_trigger_on_old_client.yaml
      # (tagged requires_old_client_apk, excluded from the main tag-based
      # dispatch above - see run_suite.py's select_flow_files own citation)
      # as their own dedicated build against the OLD CommCare binary
      # (resources/commcare_2.45_release.apk) their forced-prompt precondition
      # genuinely needs - unlike every other recovery_measures flow, which
      # runs against the normal current-release build via apk_source/
      # release_tag. Always resources/commcare_2.45_release.apk specifically
      # (not the workflow's own apk_source dropdown) since this needs an OLD
      # binary regardless of which current release the rest of the suite is
      # testing. Gated the same way as the updates_2_49 apk-prompt steps
      # above: matrix.name == 'group-c' for the normal All/nightly dispatch,
      # or (for a scoped single-tag ad-hoc dispatch) matrix.tags containing
      # requires_old_client_apk directly.
      - name: Run Maestro suite (CC Reinstall/Update Needed - old CommCare client)
        if: always() && (matrix.name == 'group-c' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'requires_old_client_apk')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          python scripts/run_suite.py --devices "$DEVICES" --tag requires_old_client_apk \
            --apk resources/commcare_2.45_release.apk \
            --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-old-client-recovery-measures"

      # Runs the 4 Recovery Measures scenarios that genuinely need a real
      # .ccz file pushed onto the device's filesystem before the "Select
      # CCZ" system file picker (Storage Access Framework) can find one -
      # Maestro has no file-push mechanism at all (see each of these flows'
      # own "REQUIRED MANUAL/CI PRE-STEP (not run by Maestro)" header:
      # offline_06_select_ccz_via_picker.yaml, offline_08_move_ccz_to_
      # downloads.yaml, offline_reinstall_update_app_flow.yaml,
      # reinstall_update_05_06_chooser_and_ccz.yaml's own "Reinstall Using
      # CCZ" branch). scripts/appium_browserstack_client.py's push_file
      # (confirmed live 2026-08-25) does this via a real Appium session -
      # see scripts/run_appium_offline_ccz_suite.py's own module docstring
      # for the full citation. Additive to the plain Maestro flows above
      # (which still cover everything except this one file-picker step) -
      # same fold-into-the-matrix-job pattern as every other Appium step in
      # this job, gated on group-c (recovery_measures' own group) or a
      # scoped recovery_measures tag dispatch.
      - name: Run Appium suite on BrowserStack (Recovery Measures - CCZ file picker)
        if: always() && (matrix.name == 'group-c' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'recovery_measures')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-appium-offline-ccz")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_offline_ccz_suite.py "${ARGS[@]}"

      # Master Mobile Plan (2026) > Form Submissions > "Markdown" (row 21) +
      # "Incomplete Forms 4" (row 30) - HQ-only Submit-History post-checks on
      # top of the already-automated on-device submit flows (both tagged
      # form_submissions - moved to group-b in the 2026-09-11 runtime
      # rebalance above, was group-c). Built 2026-09-01 but never actually
      # wired into CI until now (caught while building a full
      # workflow-status export) - see
      # scripts/run_form_submission_history_check.py's own module docstring
      # for the full citation.
      #
      # UPDATE (2026-09-11): added Repeat Groups 5 + upload_test_2's own
      # scripts/verify_submission.py checks here too - confirmed live that
      # script was cited as these 2 rows' automation but never actually
      # invoked anywhere in this workflow (only mentioned in comments), a
      # genuinely orphaned check same as this step's own Markdown/Incomplete
      # Forms 4 checks were before 2026-09-01. verify_submission.py itself
      # didn't write to reports/latest_results.json at all until this same
      # update (see its own module docstring) - fixed to match every other
      # check script's read-merge-write pattern first, then wired in here.
      # Geoservice 2 (the script's 3rd cited row) is deliberately NOT wired
      # in yet - confirmed live locally that its own submission genuinely
      # has no captured location (metadata.location == "---"), a real,
      # currently-unresolved app/feature gap, not a broken check - per
      # direct user instruction, holding off until that's investigated
      # separately rather than immediately turning this step red.
      - name: Verify Form Submissions Submit-History checks (Markdown, Incomplete Forms 4, Repeat Groups 5, upload_test_2)
        if: always() && (matrix.name == 'group-b' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'form_submissions')))
        env:
          HQ_DOMAIN: qateam
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          python scripts/run_form_submission_history_check.py \
            --test-name markdown --username test1 --form-path-contains Markdown
          python scripts/run_form_submission_history_check.py \
            --test-name incomplete_forms_4 --username test1 --form-path-contains "Question Types"
          python scripts/verify_submission.py \
            --test-name repeat_groups_5 --username test1 --form-path Repeats
          python scripts/verify_submission.py \
            --test-name upload_test_2 --username test1 --form-path "Upload Tests for specific" --require-multimedia

      # Runs Multimedia's "External File in Forms" - the one Multimedia row
      # blocked by the same class of gap the Recovery Measures CCZ-picker
      # step above already solves (Maestro can't place a file at an
      # arbitrary filesystem path) - see
      # scripts/appium_multimedia_scenarios.py's own module docstring for
      # the full citation. Same fold-into-the-matrix-job pattern as every
      # other Appium step in this job, gated on group-a (multimedia's own
      # group) or a scoped multimedia tag dispatch.
      - name: Run Appium suite on BrowserStack (Multimedia - external file in forms)
        if: always() && (matrix.name == 'group-a' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'multimedia')))
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-${{ matrix.name }}-appium-multimedia")
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_appium_multimedia_suite.py "${ARGS[@]}"

      # Master Mobile Plan (2026) > Multimedia > "Photo Verification" (row
      # 47) + "Image Resize 27/28" (rows 41-42) - HQ-only Submit-History
      # post-checks on top of the already-automated on-device submit flows
      # above (photo_02_can_remove_chosen_photo.yaml,
      # image_resize_25/26_*.yaml, both tagged multimedia/group-a). Zero
      # extra BrowserStack device cost - see
      # scripts/run_multimedia_form_data_check.py's own module docstring for
      # the full citation, including why Image Resize 27/28 only asserts
      # attachment presence/downloadability, not resize-size correctness.
      - name: Verify Multimedia Submit-History checks (Photo Verification, Image Resize 27/28)
        if: always() && (matrix.name == 'group-a' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'multimedia')))
        env:
          HQ_DOMAIN: qateam
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: |
          python scripts/run_multimedia_form_data_check.py --check-type unanswered \
            --test-name photo_verification --username test1 \
            --form-path-contains "Gif/Remove Image" \
            --expect-unanswered "Take a photo" --expect-unanswered "Choose Image"
          python scripts/run_multimedia_form_data_check.py --check-type attachments \
            --test-name image_resize_27_28 --username test1 \
            --form-path-contains "Image Resize" --min-attachments 3

      # Master Mobile Plan (2026) > Support Menus > "Menu 2" (Force Log
      # Submission) - HQ-only precondition verification on top of the
      # already-automated on-device flow (support_menus - moved to group-b
      # in the 2026-09-11 runtime rebalance above, was group-a). Built
      # 2026-09-01 but never actually wired into CI until now (same gap as
      # the Form Submissions checks above) - see
      # scripts/run_support_menus_log_property_check.py's own module
      # docstring for the full citation.
      - name: Verify Support Menus 2 precondition (logenabled)
        if: always() && (matrix.name == 'group-b' || (matrix.name != 'group-a' && matrix.name != 'group-b' && matrix.name != 'group-c' && contains(matrix.tags, 'support_menus')))
        env:
          HQ_DOMAIN: qateam
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: python scripts/run_support_menus_log_property_check.py

      # No report-history cache restore/save here on purpose: each matrix
      # job's own reports/history.json only reflects ITS slice of tags, not
      # the full logical run, so it isn't meaningful on its own - the
      # merge-reports job below is the only place the real persistent trend
      # history gets read or written, from the properly COMBINED results.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ matrix.name }}
          path: reports/
          retention-days: 30

  # Master Mobile Plan (2026) > Update > "Make a change" (row 10) + "Check
  # for new build" (row 13) - both previously Not automatable/N/A. Confirmed
  # live 2026-09-01 (by reading commcare-hq source directly) that neither
  # actually needs a device at all: "make a change" is just HQClient.
  # edit_module_attr() saving the app's draft content, and "check for new
  # build" is CommCareHQ's own autogenerate_build() mechanism, which fires
  # for ANY client (not specifically a phone) that fetches the app's live
  # ODK profile while its draft version is ahead of the latest saved build's
  # version - see scripts/hq_client.py's check_for_phone_triggered_build()
  # and scripts/run_update_content_change_check.py for the full citations.
  # A standalone job (not part of the BrowserStack device matrix above)
  # since it has zero BrowserStack/device cost - two authenticated HQ calls
  # plus real verification of HQ's response. Uploads its own reports/ as
  # maestro-report-update-content-check, matching merge-reports' existing
  # "maestro-report-*" download glob, so no change needed there beyond
  # adding this job to its `needs:` list.
  update-content-check:
    # UPDATE (2026-09-08), confirmed live (CI run 34214747124): this job ran
    # concurrently with maestro-tests (no `needs:` ordering between them),
    # and flows/update/update_target_developer_options_flow.yaml (part of
    # the "update" tag, in maestro-tests' group-b) references
    # ${APP_CODE_UPDATE_TEST_ALTERNATE} - resolved via
    # scripts/hq_client.py:resolve_app_codes(), whose get_app_install_code()
    # call defaults release_first=True, marking the SAME shared "Update Test
    # Alternate" app's current top build Released. This job's own check
    # asserts its freshly-created build stays UNRELEASED (matching the
    # sheet's own "Do NOT star this build" step) - a real race let that
    # other job's release call land on this job's own build, failing the
    # assertion for a reason that has nothing to do with this job's own
    # correctness. `needs: maestro-tests` orders this job strictly after the
    # whole matrix (can't depend on just one matrix leg), removing the race
    # - a small latency cost for a fast, cheap check.
    needs: maestro-tests
    if: always() && (github.event.inputs.tag == '' || github.event.inputs.tag == 'All' || github.event.inputs.tag == 'update')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for phone-triggered build (Update - Make a change / Check for new build)
        env:
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
        run: python scripts/run_update_content_change_check.py

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-update-content-check
          path: reports/
          retention-days: 30

  merge-reports:
    needs: [prepare, maestro-tests, update-content-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same restore/save pattern as before, just moved here - this is now
      # the only job that reads or writes the real trend history, from the
      # single combined result set every matrix job's artifact feeds into.
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: reports/history.json
          key: report-history-${{ github.run_id }}
          restore-keys: report-history-

      - name: Download all matrix job artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-report-*
          path: artifacts/

      - name: Merge matrix job reports
        run: python scripts/merge_reports.py artifacts/*/

      - name: Save report history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/history.json
          key: report-history-${{ github.run_id }}

      - name: Upload merged HTML report
        if: always()
        id: upload_report
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report
          path: reports/
          retention-days: 30

      # Formats needs.prepare.outputs.start_epoch (captured at the very
      # start of the prepare job, before matrix fan-out) against "now" into
      # "1h 23m" / "45m" - this job runs last, so its own start time is a
      # reasonable proxy for "when the whole run finished".
      - name: Compute run duration
        id: duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ needs.prepare.outputs.start_epoch }} ))
          hours=$(( elapsed / 3600 ))
          minutes=$(( (elapsed % 3600) / 60 ))
          if [ "$hours" -gt 0 ]; then
            echo "text=${hours}h ${minutes}m" >> "$GITHUB_OUTPUT"
          else
            echo "text=${minutes}m" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Slack notification
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          RUN_TAG: ${{ github.event.inputs.tag }}
          RUN_DURATION: ${{ steps.duration.outputs.text }}
          # Reflects the android_version dropdown, not whatever the
          # maestro-tests job's own `devices` override might have used -
          # matches every other RUN_*/env var here in reading the raw
          # workflow input directly rather than a resolved value.
          ANDROID_VERSION: ${{ github.event.inputs.android_version || '16.0' }}
        run: python scripts/slack_notify.py
