name: Maestro BrowserStack QA (Non-Core)

# Non-core CommCare Mobile workflows - the Master Mobile Plan tabs on the
# Inventory's "CommCare Mobile - Non-Core" tab, flows in flows_non_core/
# (see flows_non_core/README.md). Same pipeline as maestro-browserstack.yml
# (run_suite.py -> BrowserStack Maestro -> merged HTML report -> Slack), but
# its own workflow, artifacts and report history so core and non-core runs
# never mix. run_suite.py's --flows-root flows_non_core keeps it from ever
# selecting a core flow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Run only non-core flows carrying this tag. All runs every non-core flow."
        required: false
        type: choice
        default: "All"
        options:
          - "All"
          - advanced_settings
          - case_list_optimization
          - developer_options
          - graphing
          - mapbox
          - performance_tests
          - printing
          - sd_card_dump
          - text_to_speech
          - wifi_direct
      release_tag:
        description: "commcare-android GitHub release tag to test (e.g. commcare_2.64.0). Leave blank for latest. Ignored unless apk_source is 'GitHub Releases'."
        required: false
        default: ""
      commcare_android_run:
        description: "OPTIONAL - test an APK built by a dimagi/commcare-android GitHub Actions run (e.g. a customised build): paste the run id or run URL. Overrides apk_source and release_tag when set. Leave blank for the normal path."
        required: false
        default: ""
      commcare_android_branch:
        description: "OPTIONAL, only for apk_source = Internal latest APK: take the newest dev build from this commcare-android branch (e.g. commcare_2.65 or a feature branch). Leave blank for the newest build on ANY branch."
        required: false
        default: ""
      commcare_android_artifact:
        description: "Artifact to take the APK from when commcare_android_run is set (default commcare-release-apk; others: ccc-staging-release-apk, commcare-qaAutomation-release-apk - the latter only exists for manually dispatched PR CI runs and expires after 3 days)."
        required: false
        default: "commcare-release-apk"
      apk_source:
        description: "APK to test. 'GitHub Releases' uses release_tag above (or latest). Any other option tests that committed resources/*.apk directly."
        required: false
        type: choice
        default: "GitHub Releases"
        options:
          - "GitHub Releases"
          - "Internal latest APK"
          - "resources/app-commcare-release-Android16.apk"
          - "resources/app-commcare-qaAutomation.apk"
          - "resources/app-cccStaging-qaAutomation.apk"
      slack_channel:
        description: "Slack channel for the report. auto = scheduled runs and manual runs on main go to the main channel; runs on any other branch go to the branch test channel. Pick 'branch test channel' to run on main WITHOUT posting to the main channel."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - main channel
          - branch test channel
      android_version:
        description: "Android version to test on (maps to the Samsung Galaxy flagship BrowserStack has at that version). Ignored if 'devices' is set."
        required: false
        type: choice
        default: "16.0"
        options:
          - "16.0"
          - "15.0"
          - "14.0"
          - "13.0"
          - "12.0"
          - "11.0"
          - "10.0"
      devices:
        description: "Comma-separated BrowserStack device names - overrides android_version when set."
        required: false
        default: ""
  # Weekly, Saturdays 01:00 UTC, against the latest commcare-android release.
  # A full non-core run takes ~70 min on its 2 parallel sessions (see the
  # prepare job), so it's done well before the core suite's 03:00 UTC run.
  schedule:
    - cron: "0 1 * * 6"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      start_epoch: ${{ steps.set-matrix.outputs.start_epoch }}
    steps:
      - id: set-matrix
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "All" ]; then
            # 2 parallel BrowserStack sessions (the plan allows 5; the core
            # suite's nightly run uses 3, so both fit even if they overlap).
            # Split by each tag's real measured test time from the first
            # live runs (2026-10-02, Galaxy S26 / Android 16), largest
            # first into the lighter group:
            #   group-a: advanced_settings 36.6 + text_to_speech 9.8 +
            #            graphing ~8.5 + printing 6.1           = ~61 min
            #   group-b: case_list_optimization 31.9 + developer_options
            #            10.7 + mapbox 7.0 + performance_tests 3.3 +
            #            wifi_direct 3.1 + sd_card_dump 2.8      = ~59 min
            # (~2h10m end to end on one session; ~70 min on two, counting
            # BrowserStack's per-build upload/queue overhead.) Rebalance from
            # the run report's durations if tags grow.
            MATRIX='{"include":[
              {"name":"group-a","tags":"advanced_settings text_to_speech graphing printing"},
              {"name":"group-b","tags":"case_list_optimization developer_options mapbox performance_tests wifi_direct sd_card_dump"}
            ]}'
          else
            MATRIX="{\"include\":[{\"name\":\"single\",\"tags\":\"$TAG\"}]}"
          fi
          echo "matrix=$(echo "$MATRIX" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  maestro-tests:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch APK from commcare-android Actions (commcare_android_run set, or apk_source = Internal latest APK)
        if: ${{ github.event.inputs.commcare_android_run != '' || github.event.inputs.apk_source == 'Internal latest APK' }}
        env:
          # commcare-android is public; the built-in token should be enough to read its
          # artifacts. If GitHub refuses cross-repo artifact access, add a repo secret
          # COMMCARE_ANDROID_READ_TOKEN (a token with read access) - it is preferred when set.
          GH_TOKEN: ${{ secrets.COMMCARE_ANDROID_READ_TOKEN || github.token }}
          RUN_INPUT: ${{ github.event.inputs.commcare_android_run }}
          ARTIFACT_INPUT: ${{ github.event.inputs.commcare_android_artifact }}
          BRANCH_INPUT: ${{ github.event.inputs.commcare_android_branch }}
        run: |
          ARTIFACT="${ARTIFACT_INPUT:-commcare-release-apk}"
          if [ -n "$RUN_INPUT" ]; then
            # an explicit commcare-android run id/URL always wins
            python scripts/fetch_apk.py --run "$RUN_INPUT" --artifact "$ARTIFACT" --github-env
          else
            # apk_source = "Internal latest APK": newest dispatched dev build, any branch
            BRANCH_ARGS=()
            if [ -n "$BRANCH_INPUT" ]; then BRANCH_ARGS=(--branch "$BRANCH_INPUT"); fi
            python scripts/fetch_apk.py --latest "${BRANCH_ARGS[@]}" --artifact "$ARTIFACT" --github-env
          fi

      - name: Run non-core Maestro suite on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
          HQ_SESSION_COOKIE: ${{ secrets.HQ_SESSION_COOKIE }}
          HQ_DOMAIN: qateam
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          CC_TEST2_USERNAME: ${{ secrets.CC_TEST2_USERNAME }}
          CC_TEST2_PASSWORD: ${{ secrets.CC_TEST2_PASSWORD }}
          HQ_MOBILE_WORKER_USERNAME: ${{ secrets.HQ_MOBILE_WORKER_USERNAME }}
          HQ_MOBILE_WORKER_PASSWORD: ${{ secrets.HQ_MOBILE_WORKER_PASSWORD }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
          CC_CASELIST_USERNAME: ${{ secrets.CC_CASELIST_USERNAME }}
          CC_LARGE_APP_USERNAME: ${{ secrets.CC_LARGE_APP_USERNAME }}
        run: |
          # Same android_version-to-device mapping as maestro-browserstack.yml.
          declare -A ANDROID_DEVICE_MAP=(
            ["16.0"]="Samsung Galaxy S26"
            ["15.0"]="Samsung Galaxy S25"
            ["14.0"]="Samsung Galaxy S24"
            ["13.0"]="Samsung Galaxy S23"
            ["12.0"]="Samsung Galaxy S22"
            ["11.0"]="Samsung Galaxy S21"
            ["10.0"]="Samsung Galaxy S20"
          )
          ANDROID_VERSION="${{ github.event.inputs.android_version || '16.0' }}"
          DEVICES="${{ github.event.inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="${ANDROID_DEVICE_MAP[$ANDROID_VERSION]}-$ANDROID_VERSION"
          fi
          ARGS=(--flows-root flows_non_core --devices "$DEVICES" --build-name "QA-COMMCARE-MOBILE-NONCORE-${{ matrix.name }}" --retry-failed)
          for T in ${{ matrix.tags }}; do ARGS+=(--tag "$T"); done
          APK_SOURCE="${{ github.event.inputs.apk_source || 'GitHub Releases' }}"
          # commcare_android_run (fetch step above) wins over apk_source/release_tag when set.
          APK_SOURCE="${APK_OVERRIDE:-$APK_SOURCE}"
          if [ "$APK_SOURCE" != "GitHub Releases" ]; then
            ARGS+=(--apk "$APK_SOURCE")
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            ARGS+=(--release-tag "${{ github.event.inputs.release_tag }}")
          fi
          python scripts/run_suite.py "${ARGS[@]}"

      # Case List Optimization / Performance Tests flows measure load times;
      # the values are recomputed from the Maestro command log's step
      # timestamps (see the script's docstring) and shown on the run's
      # summary page, plus reports/timings.json in the artifact.
      - name: Report measured load times
        if: always()
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -f reports/latest_results.json ]; then
            { echo "## Measured load times"; echo; python scripts/extract_flow_timings.py; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Safety net for a CANCELLED job: scripts/cancel_guard.py normally stops this job's
      # BrowserStack builds from inside the process on SIGINT/SIGTERM; this stops any it
      # recorded but could not (e.g. the process was SIGKILLed first). Only this job's builds.
      - name: Stop BrowserStack builds if the job was cancelled
        if: cancelled()
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: python scripts/stop_run_builds.py

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-non-core-report-${{ matrix.name }}
          path: reports/
          retention-days: 30

  merge-reports:
    needs: [prepare, maestro-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Separate cache key prefix from the core workflow's "report-history-",
      # so the non-core pass-rate trend never mixes with the core one.
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: reports/history.json
          key: report-history-non-core-${{ github.run_id }}
          restore-keys: report-history-non-core-

      - name: Download run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-non-core-report-*
          path: artifacts/

      - name: Merge reports
        run: python scripts/merge_reports.py artifacts/*/

      # AI failure analysis (same idea as dimagi-qa / dimagi-qa-sureadhere): sends each FAILED test, with
      # BrowserStack's failure evidence and the flow, to OpenAI and writes reports/ai_failure_report.md
      # (uploaded with the merged report). slack_notify.py then replies with it IN THE THREAD of the run's
      # Slack message. Needs the OPENAI_API_KEY repo secret; skips quietly without it, and can never fail
      # the workflow (continue-on-error). Not run for cancelled runs.
      - name: AI failure analysis
        if: ${{ needs.maestro-tests.result != 'cancelled' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}      # an Anthropic 'sk-ant-' key saved here is detected too
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          # Values scripts/ai_failure_analyst.py REDACTS from everything it sends to OpenAI:
          CC_TEST_USERNAME: ${{ secrets.CC_TEST_USERNAME }}
          CC_TEST_PASSWORD: ${{ secrets.CC_TEST_PASSWORD }}
          CC_TEST2_USERNAME: ${{ secrets.CC_TEST2_USERNAME }}
          CC_TEST2_PASSWORD: ${{ secrets.CC_TEST2_PASSWORD }}
          CC_CASELIST_USERNAME: ${{ secrets.CC_CASELIST_USERNAME }}
          CC_LARGE_APP_USERNAME: ${{ secrets.CC_LARGE_APP_USERNAME }}
          HQ_WEB_USER_EMAIL: ${{ secrets.HQ_WEB_USER_EMAIL }}
          HQ_WEB_USER_PASSWORD: ${{ secrets.HQ_WEB_USER_PASSWORD }}
          HQ_MOBILE_WORKER_USERNAME: ${{ secrets.HQ_MOBILE_WORKER_USERNAME }}
          HQ_MOBILE_WORKER_PASSWORD: ${{ secrets.HQ_MOBILE_WORKER_PASSWORD }}
          HQ_API_USERNAME: ${{ secrets.HQ_API_USERNAME }}
          HQ_API_PASSWORD: ${{ secrets.HQ_API_PASSWORD }}
        run: python scripts/ai_failure_analyst.py

      - name: Save report history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/history.json
          key: report-history-non-core-${{ github.run_id }}

      - name: Upload merged HTML report
        if: always()
        id: upload_report
        uses: actions/upload-artifact@v4
        with:
          name: maestro-non-core-report
          path: reports/
          retention-days: 30

      - name: Compute run duration
        id: duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ needs.prepare.outputs.start_epoch }} ))
          hours=$(( elapsed / 3600 ))
          minutes=$(( (elapsed % 3600) / 60 ))
          if [ "$hours" -gt 0 ]; then
            echo "text=${hours}h ${minutes}m" >> "$GITHUB_OUTPUT"
          else
            echo "text=${minutes}m" >> "$GITHUB_OUTPUT"
          fi

      # Same Slack channel as the core suite; the post's header carries this
      # workflow's own name ("... (Non-Core)", via GITHUB_WORKFLOW in
      # slack_notify.py), so the two are easy to tell apart.
      # Which Slack channel gets this run's report (and the AI analysis thread). Same scheme as
      # dimagi-qa-sureadhere: scheduled runs and manual runs on main -> the main channel
      # (SLACK_CHANNEL_ID); manual runs on any other branch -> the branch test channel
      # (SLACK_CHANNEL_ID_BRANCH_TEST). A manual run can override this with the slack_channel input,
      # e.g. to run on main without posting to the main channel.
      - name: Set slack channel
        if: always()
        id: configure_slack
        uses: actions/github-script@v7
        env:
          CC_EVENT: ${{ github.event_name }}
          CC_REF: ${{ github.ref_name }}
          CC_CHOICE: ${{ github.event.inputs.slack_channel }}
          MAIN_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
          BRANCH_CHANNEL: ${{ secrets.SLACK_CHANNEL_ID_BRANCH_TEST }}
        with:
          result-encoding: string
          script: |
            const {CC_EVENT, CC_REF, CC_CHOICE, MAIN_CHANNEL, BRANCH_CHANNEL} = process.env
            const choice = CC_CHOICE || 'auto'
            const ids = {main: MAIN_CHANNEL, branch: BRANCH_CHANNEL}
            const names = {main: 'SLACK_CHANNEL_ID', branch: 'SLACK_CHANNEL_ID_BRANCH_TEST'}
            let target
            if (CC_EVENT === 'schedule') {
              target = 'main'
            } else if (CC_EVENT === 'workflow_dispatch') {
              if (choice === 'main channel') target = 'main'
              else if (choice === 'branch test channel') target = 'branch'
              else target = CC_REF === 'main' ? 'main' : 'branch'
            } else {
              target = 'branch'  // anything else (PR, push/merge) is branch-channel traffic
            }
            if (!ids[target]) {
              // Never drop a report over a missing secret; never fall back INTO the main channel
              // from a branch run.
              const fallback = target === 'main' ? ['branch'].find(t => ids[t]) : undefined
              core.warning(`${names[target]} is not set -- ` + (fallback ? `posting to ${names[fallback]} instead` : 'not posting to Slack'))
              target = fallback
            }
            console.log(`event=${CC_EVENT} ref=${CC_REF} slack_channel=${choice} -> ${target || 'no'} channel`)
            return target ? ids[target] : ''

      - name: Post Slack notification
        if: ${{ always() && steps.configure_slack.outputs.result != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ steps.configure_slack.outputs.result }}
          REPORT_ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          RUN_TAG: ${{ github.event.inputs.tag }}
          RUN_DURATION: ${{ steps.duration.outputs.text }}
          ANDROID_VERSION: ${{ github.event.inputs.android_version || '16.0' }}
          # So the report can say "CANCELLED" / "INCOMPLETE" instead of posting a green
          # card for a run whose groups were stopped or never reported.
          MATRIX_RESULT: ${{ needs.maestro-tests.result }}
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: python scripts/slack_notify.py
